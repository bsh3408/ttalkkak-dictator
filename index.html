<meta charset="utf-8">


<meta name="viewport" content="width=device-width, initial-scale=1">
<title>딸깍 독재자</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Song+Myung&family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700;900&family=IBM+Plex+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
:root{
  --page:#FFFFFF; --sheet:#F4F7F6; --line:#DCE3E1; --ink:#1B2A2C; --soft:#5D6D70; --mute:#8A9799;
  --green:#1E7A4C; --greenbg:#E7F3EC; --o:#23866F; --x:#C9533A; --ai:#E3B341; --aiInk:#3A2C05; --aibg:#FFF6DC;
  --dn:#B4432C; --dnbg:#FBE7E1; --up:#1E7A4C; --upbg:#E2F2E8;
  --coal:#4A4A4A; --lng:#8C7A5B; --nuke:#7C8BA1; --wind:#4FA3C7; --solar:#E0A62B;
}
*{box-sizing:border-box}
body{margin:0;word-break:keep-all;overflow-wrap:break-word;line-break:strict;background:var(--page);color:var(--ink);font-family:"IBM Plex Sans KR","Malgun Gothic",sans-serif;font-size:15px;line-height:1.65;-webkit-tap-highlight-color:transparent}
button{font:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--ai);outline-offset:2px}
.top{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line);font-size:13px;position:sticky;top:0;z-index:50}
.snd.home{background:#b0201f!important;color:#fff!important;border-color:#b0201f!important;font-weight:900}
.top b{color:var(--green)} .top .file{font-family:"IBM Plex Mono",monospace;font-size:12px;background:var(--sheet);border:1px solid var(--line);border-radius:4px;padding:1px 8px;color:var(--soft)}
.top .note{margin-left:auto;color:var(--mute);font-size:12px;text-align:right}
.top b,.top .file{white-space:nowrap}
@media (max-width:560px){.top .note{display:none}}
.wrap{max-width:1320px;margin:0 auto;padding:14px 14px 40px}
.game{display:grid;gap:14px}
.col{display:grid;gap:12px;align-content:start}
@media (min-width:920px){.game{grid-template-columns:270px 1fr;align-items:start}.mhud{display:none!important}}
.logrow{grid-column:1/-1;order:9}
.logbox summary{cursor:pointer;list-style:none}.logbox summary::-webkit-details-marker{display:none}.logbox summary h3{margin:0}.logbox[open] summary{border-bottom:1px solid var(--line)}
.logbox .log{max-height:420px}
@media (max-width:919px){.game>.col:first-child{order:2}}
.mhud{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 10px;font-size:13px;color:var(--soft);font-variant-numeric:tabular-nums;border:1px solid var(--line);border-radius:6px;padding:6px 10px;background:var(--sheet)}
.mhud b{color:var(--ink)} .mhud .neg{color:var(--dn)}
.box{border:1px solid var(--line);border-radius:6px;background:var(--page)}
.box h3{margin:0;font-size:13px;padding:8px 12px;border-bottom:1px solid var(--line);background:var(--sheet);color:var(--soft);font-weight:700;display:flex;justify-content:space-between}
.box h3 em{font-style:normal;font-weight:500}
.box .in{padding:10px 12px}
.who{display:flex;gap:10px;align-items:center}
.who .av{width:40px;height:40px;border-radius:6px;background:var(--greenbg);display:grid;place-items:center}
.who b{display:block;font-size:16px}
.who small{color:var(--mute);font-size:12px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;font-size:13px;margin-top:10px;font-variant-numeric:tabular-nums}
.kv span{color:var(--mute)} .kv b{text-align:right}
.neg{color:var(--dn)}
.gdpbig{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.2;margin-top:8px}
.gdpbig small{font-size:13px;color:var(--mute);font-weight:500}
.bars{display:grid;gap:7px;font-size:13px}
.bars .r{display:grid;grid-template-columns:5.4em 1fr 2em;gap:8px;align-items:center;font-variant-numeric:tabular-nums}
.bars .t{height:7px;background:var(--sheet);border:1px solid var(--line);border-radius:4px;overflow:hidden}
.bars .t i{display:block;height:100%;background:var(--green);transition:width .6s}
.bars .bad .t i{background:var(--dn)}
.mission{font-size:12.5px;color:var(--soft);background:var(--sheet);border-radius:4px;padding:6px 8px;margin-top:10px}
.pw{display:grid;grid-template-columns:1fr auto;gap:2px 10px;font-size:13px;font-variant-numeric:tabular-nums}
.pw span{color:var(--mute)}
.gauge{position:relative;height:12px;border-radius:6px;background:var(--sheet);border:1px solid var(--line);margin:8px 0 4px;overflow:hidden}
.gauge i{position:absolute;top:0;bottom:0;left:0;background:var(--green)}
.gauge i.short{background:var(--dn)}
.gauge u{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--ink)}
.gnote{font-size:11.5px;color:var(--mute)}
.mix{display:flex;height:10px;border-radius:5px;overflow:hidden;margin-top:8px}
.legend{display:flex;flex-wrap:wrap;gap:2px 10px;font-size:11.5px;color:var(--soft);margin-top:5px}
.legend i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:3px}
.land{border:1px solid var(--line);border-radius:6px;overflow:hidden}
.land svg{display:block;width:100%;height:auto}
.pop{transform-box:fill-box;transform-origin:50% 100%;animation:pop .8s ease-out}
@keyframes pop{0%{transform:scale(0);opacity:0}70%{transform:scale(1.2)}100%{transform:scale(1);opacity:1}}
.spin{transform-box:view-box;animation:spin 3s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.smoke{animation:smoke 3s ease-in-out infinite}
@keyframes smoke{0%{transform:translateY(0);opacity:.7}100%{transform:translateY(-10px);opacity:0}}
.mid{display:grid;gap:12px}
.event{border:1px solid #E7C27A;background:#FFF8E8;border-radius:8px;padding:10px 14px;font-size:14px}
.event b{display:block;color:#8A5A00}
.card{border:1px solid var(--line);border-radius:10px;padding:24px 26px;min-height:230px;background:var(--page);box-shadow:0 6px 18px rgba(27,42,44,.08);touch-action:none;user-select:none;transition:transform .25s;position:relative}
.card.drag{transition:none}
.card .head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:8px;flex-wrap:wrap}
.badge{font-size:12px;font-weight:700;color:var(--green);background:var(--greenbg);border-radius:4px;padding:1px 8px}
.wx{font-size:12px;color:var(--soft)}
.from{display:flex;align-items:center;gap:10px;font-size:15px;color:var(--soft);margin-bottom:6px}
.from i{width:56px;height:56px;border-radius:8px;display:grid;place-items:center;font-style:normal;flex:none;background:color-mix(in srgb,var(--tint) 22%,#fff);border:2px solid color-mix(in srgb,var(--tint) 55%,#fff)}
.from b{color:var(--ink)}
.bubble .aihead{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.bubble .aihead i{width:40px;height:40px;border-radius:8px;background:#2B3640;display:grid;place-items:center;flex:none}
.aibtns{display:grid;grid-template-columns:1.6fr 1fr;gap:8px}
.aibtns .no{border:2px solid var(--x);background:var(--page);color:var(--x);border-radius:6px;font-weight:700;padding:12px}
.q{font-size:24px;font-weight:700;line-height:1.5;text-wrap:balance;margin:0}
.stat{margin-top:12px;font-size:14px;color:var(--soft);border-top:1px dashed var(--line);padding-top:8px}
.stat b{color:var(--green);margin-right:6px}
.stat em{font-style:normal;color:var(--mute)}
.signbox{position:absolute;right:16px;top:16px;width:88px;border:2px solid var(--ink);background:#fff;text-align:center;font-size:12px}
.signbox b{display:block;border-bottom:2px solid var(--ink);padding:2px 0;font-size:12px}
.signbox span{display:grid;place-items:center;height:70px;color:var(--mute,#888);font-size:11px}
.card .from,.card .q,.card .chain{padding-right:100px}
.stampmark{width:66px;height:66px;border-radius:50%;border:4px double currentColor;display:grid;place-items:center;font-style:normal;font-weight:900;font-size:15px;transform:rotate(-14deg) scale(2.4);opacity:0;animation:stampin .22s steps(4) forwards;background:rgba(255,255,255,.6)}
.stampmark.o{color:#1E7B34}.stampmark.x{color:#B03A2E}.stampmark.a{color:#1F6F86}
@keyframes stampin{to{transform:rotate(-14deg) scale(1);opacity:.95}}
.card.stamped{animation:thump .18s steps(2)}
@keyframes thump{50%{transform:translateY(3px)}}
.btn .sicon{display:inline-grid;place-items:center;width:38px;height:38px;border-radius:50%;border:3px double rgba(255,255,255,.85);font-size:11px;margin-right:6px;vertical-align:middle}
@media (max-width:560px){.card .from,.card .q,.card .chain{padding-right:0}.signbox{position:static;width:auto;margin-top:10px;display:flex;align-items:center}.signbox b{border:0;border-right:2px solid var(--ink);padding:4px 10px}.signbox span{height:74px;flex:1}.btn .sicon{display:none}}
.choices{display:grid;grid-template-columns:1fr 1fr 1.25fr;gap:8px}
.btn{border:0;border-radius:6px;padding:16px 10px;font-weight:700;font-size:20px;color:#fff;position:relative;overflow:hidden}
.btn.o{background:var(--o)} .btn.x{background:var(--x)} .btn.ai{background:var(--ai);color:var(--aiInk)}
.btn small{display:block;font-weight:500;font-size:13px;opacity:.9}
.btn[disabled]{filter:grayscale(.65) brightness(.95);opacity:.7;cursor:default}
.lock{position:absolute;left:0;bottom:0;height:4px;background:rgba(255,255,255,.8);width:0}
.bubble{background:var(--aibg);border:1px solid #EBD38A;border-radius:8px;padding:12px 14px;font-size:15px}
.bubble b{color:#8A6400}
.bubble .plan{display:block;margin:6px 0;padding:8px 10px;background:#fff;border-radius:6px;font-weight:700}
.result{border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.result .tag{display:inline-block;font-size:12px;font-weight:700;border-radius:4px;padding:1px 8px;margin-bottom:6px;color:#fff}
.result p{margin:0 0 8px;font-size:15.5px}
.power{font-size:14px;border-radius:6px;padding:8px 10px;margin:4px 0 8px;background:var(--sheet)}
.power.bad{background:var(--dnbg);color:var(--dn);font-weight:700}
.delta{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 10px}
.delta span{font-size:12.5px;border-radius:4px;padding:1px 8px;background:var(--sheet);font-variant-numeric:tabular-nums}
.delta .dn{background:var(--dnbg);color:var(--dn)} .delta .up{background:var(--upbg);color:var(--up)}
.next{width:100%;border:0;border-radius:6px;padding:12px;font-weight:700;background:var(--green);color:#fff;position:relative;overflow:hidden}

.log{max-height:560px;overflow:auto;display:grid}
.log .e{display:grid;grid-template-columns:3.4em 1fr;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line);font-size:13px}
.log .e:first-child{background:#FAFCFB}
.log .e.ev{background:#FFF8E8}
.log .y{font-family:"IBM Plex Mono",monospace;color:var(--mute);font-size:12px}
.log .ai{display:inline-block;font-size:11px;font-weight:700;background:var(--aibg);color:#8A6400;border-radius:3px;padding:0 5px;margin-left:4px}
.log .bo{display:inline-block;font-size:11px;font-weight:700;background:var(--dnbg);color:var(--dn);border-radius:3px;padding:0 5px;margin-left:4px}
.log .d{color:var(--mute);font-size:12px;font-variant-numeric:tabular-nums}
.log .empty{padding:12px;color:var(--mute);font-size:13px}
.screen{max-width:640px;margin:0 auto;display:grid;gap:14px}
.screen h1{font-size:30px;line-height:1.3;margin:6px 0 0;text-wrap:balance}
.screen h2{font-size:18px;margin:0}
.lead{color:var(--soft);margin:0}
.mode{display:grid;gap:10px}
.mode button{text-align:left;border:1px solid var(--line);background:var(--page);border-radius:6px;padding:14px}
.mode button:hover{border-color:var(--green)}
.mode button b{display:block;font-size:16px}
.mode button span{font-size:13px;color:var(--soft)}
label.f{display:grid;gap:4px;font-size:13px;color:var(--soft)}
input[type=text],input[type=password]{width:100%;font:inherit;padding:11px;border-radius:6px;border:1px solid var(--line);color:var(--ink)}
.names{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:480px){.names{grid-template-columns:1fr}}
.row{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--soft)}
.primary{border:0;border-radius:6px;padding:13px;font-weight:700;font-size:16px;background:var(--green);color:#fff}
.ghost{border:1px solid var(--line);border-radius:6px;padding:11px;background:var(--page);color:var(--ink)}
.big{font-size:40px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.rank{display:grid;font-variant-numeric:tabular-nums;font-size:14px}
.rank:not(.wr) div{grid-template-columns:2.2em 1fr auto auto}.roomrk div{padding:4px 10px;font-size:13px}
.rank .rg{color:var(--x,#b0201f);font-weight:900;text-align:right;min-width:2.6em}
.rank div{display:grid;grid-template-columns:2.2em 1fr auto;gap:8px;padding:6px 12px;border-bottom:1px solid var(--line)}
.rank .me{background:var(--aibg);font-weight:700}
.quiz{display:grid;gap:8px}
.qopt{text-align:left;border:1px solid var(--line);background:var(--page);border-radius:6px;padding:12px 14px;font-size:15px;color:var(--ink)}
.qopt:hover:not([disabled]){border-color:var(--green)}
.qopt.right{background:var(--upbg);border-color:var(--up);color:var(--up);font-weight:700}
.qopt.wrong{background:var(--dnbg);border-color:var(--dn);color:var(--dn)}
.dice{display:flex;flex-wrap:wrap;gap:8px;min-height:52px}
.die{display:grid;place-items:center;width:64px;height:48px;border:2px solid var(--line);border-radius:8px;font-weight:700;font-variant-numeric:tabular-nums;animation:pop .35s ease-out}
.die.best{border-color:var(--green);background:var(--greenbg);color:var(--green)}
.rank.wr div{padding:4px 10px;font-size:12.5px;grid-template-columns:2.4em 1fr auto}
.rank.wr .mate{background:#F2F6FB;color:#33507A}
.rank.wr .mate span:first-child{font-size:11px}
.power.up{background:var(--upbg);color:var(--up);font-weight:700}
.ending{border:2px solid var(--ink);border-radius:8px;padding:16px;text-align:center}
.ending small{color:var(--mute);display:block}
.ending b{display:block;font-size:24px;margin:2px 0 4px}
.grade{display:flex;align-items:center;gap:12px;margin-bottom:10px}.grade b{font-size:44px;line-height:1;font-family:'IBM Plex Mono',monospace}.grade span{font-weight:700}
table.runs{width:100%;border-collapse:collapse;font-size:13px}table.runs td,table.runs th{padding:5px 6px;border-bottom:1px solid var(--line, #ddd);text-align:left}table.runs tr.me td{font-weight:700}
table.lead-t{width:100%;border-collapse:collapse;font-size:13px}table.lead-t th,table.lead-t td{padding:6px 5px;border-bottom:1px solid var(--line, #ddd);text-align:left;vertical-align:middle}
table.lead-t td small{display:block;color:var(--mute, #777);font-size:11.5px}table.lead-t tr.me td{background:#FFF5D6}table.lead-t tr.podium td b{font-size:15px}
table.lead-t td.g{font:700 22px 'IBM Plex Mono',monospace}table.lead-t td.n{font-weight:700}
table.lead-t td.pn{min-width:54px;position:relative}table.lead-t td.pn i{display:block;height:6px;background:#5BB6A0;border-radius:3px;margin-bottom:2px}table.lead-t td.pn span{font-size:11px}
.lmv{font-weight:700}.lmv.up{color:#2E7D3A}.lmv.dn{color:#B03A2E}
@media (max-width:720px){table.lead-t .pn{display:none}}
.mode button.locked{opacity:.55;filter:grayscale(1)}.lockline{display:block;margin-top:6px;font-weight:700;font-size:13px}
.fold{border:1px solid var(--line);border-radius:8px;background:var(--page)}.fold summary{cursor:pointer;padding:10px 14px;font-weight:700;list-style:none}.fold summary::-webkit-details-marker{display:none}.fold summary:before{content:'▸ ';color:var(--mute)}.fold[open] summary:before{content:'▾ '}.fold summary em{font-style:normal;font-weight:400;color:var(--mute);font-size:13px;margin-left:6px}.fold .in{padding:0 14px 12px}.fold p{margin:6px 0;line-height:1.6}
details.sbox>summary{list-style:none;cursor:pointer}details.sbox>summary::-webkit-details-marker{display:none}

details.sbox>summary h3{justify-content:flex-start;flex-wrap:wrap;align-items:baseline}details.sbox>summary h3 em{flex-basis:100%;margin:2px 0 0 18px;font-size:15px;color:var(--ink)}
details.stat summary{cursor:pointer;list-style:none;color:var(--gold,#c90)}details.stat summary::-webkit-details-marker{display:none}
details.stat[open] summary{margin-bottom:6px}
.dexh{margin:12px 0 6px;color:var(--gold,#c90);font-weight:400;font-size:17px}.dexh em{font-style:normal;color:var(--mute);font-size:14px;margin-left:6px}
.drank{border:3px double var(--gold,#c90);background:#140707;padding:12px 16px;text-align:center;display:grid;gap:2px}
.drank b{font-size:26px;color:var(--gold,#c90);font-weight:400}.drank .stars{color:#f2c230;letter-spacing:.15em}.drank small{color:var(--soft);font-size:14px}
.letters{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:6px 0}

.env{position:relative;aspect-ratio:4/3;border:2px solid #6b5a45;background:#e9dcbc;cursor:pointer;overflow:hidden;opacity:0;transform:translate(120vw,-40px) rotate(25deg);animation:fly .7s cubic-bezier(.2,.9,.3,1.1) forwards;padding:0;color:#3a2c1a}

@keyframes fly{to{opacity:1;transform:none}}

.letter .lgreet{margin:0 0 8px;color:#6b5a45;font-size:15px}

body{background:#140707;font-family:"Song Myung","Gungsuh",serif;font-size:16px}

// 보통 학생들의 점수(평균·표준편차, 시뮬레이션 750판)와 견주어 무엇이 유난히 높고 낮았는지 본다
const PF_REF = {econ:[34, 27], life:[31, 14], fair:[48, 10], env:[68, 8]};
function profileOf(s){
  const G = gradeOf(s), g = n => (G.it.find(x => x.n === n) || {v:50}).v;
  const v = {econ:g('경제 성장'), life:g('국민 삶'), fair:g('공정함'), env:g('환경과 기후'), wise:g('현명한 결재')};
  const z = k => (v[k] - PF_REF[k][0]) / PF_REF[k][1];
  const four = [['경제', 'econ'], ['국민 삶', 'life'], ['공정함', 'fair'], ['환경', 'env']].map(([n, k]) => [n, v[k], k, z(k)]).sort((a, b) => b[3] - a[3]);
  const best = four[0], worst = four[3];
  let k = null;
  if (v.wise < 35) k = 'stamp';
  else if (best[3] < -0.4) k = 'none';
  else if (best[3] - worst[3] >= 1.2) k = best[2] === 'econ' ? (worst[2] === 'env' ? 'dirty' : worst[2] === 'fair' ? 'unfair' : 'money')
                                     : {env:'green', life:'kind', fair:'fair'}[best[2]];
  const raw = four.slice().sort((a, b) => b[1] - a[1]);   // 화면에 보여 줄 때는 실제 점수 순서
  return {v, P:k && PROFILE[k], best, worst, hi:raw[0], lo:raw[3]};   // 네 가지가 고르면 원래 등급 이름
}
function drankName(s){
  const r = drankOf(s), pf = profileOf(s), tier = r.lv <= 3 ? 0 : r.lv <= 6 ? 1 : 2;
  return pf.P ? {name:pf.P.names[tier], word:pf.P.word, pf} : {name:r.name, word:r.word, pf};
}

const MINISTER = {happy:['minWel','보건 인민위원'], median:['minLab','노동 인민위원'], gap:['minLab','노동 인민위원'], nature:['minEnv','국토 환경 인민위원'], climate:['minCli','기상 수문 인민위원']};
function ministerAdvice(c){
  const effs = o => STATS.filter(x => o.d[x.k]).map(x => ({k:x.k, n:x.n, v:x.inv ? -o.d[x.k] : o.d[x.k]}));
  const eO = effs(c.O), eA = effs(c.A);
  const worstO = eO.slice().sort((a, b) => a.v - b.v)[0], bestO = eO.slice().sort((a, b) => b.v - a.v)[0], worstA = eA.slice().sort((a, b) => a.v - b.v)[0];
  const deg = v => Math.abs(v) >= 8 ? '크게 ' : Math.abs(v) >= 4 ? '' : '조금 ';
  const bad = e => `${josa(e.n, '이', '가')} ${deg(e.v)}${e.k === 'gap' ? '커질' : '나빠질'}`;
  const key = worstO && worstO.v < 0 ? worstO.k : worstA && worstA.v < 0 ? worstA.k : 'happy';
  let t = worstO && worstO.v < 0 ? `받아들이면 ${bad(worstO)} 겁니다. ` : '받아들여도 국민 생활에 큰 부담은 없어 보입니다. ';
  if (bestO && bestO.v > 0) t += `대신 ${josa(bestO.n, '에는', '에는')} 도움이 됩니다. `;
  if (worstA && worstA.v < 0) t += `AI 보좌관의 안대로 하면 ${bad(worstA)} 수 있습니다.`;
  return {face:MINISTER[key][0], role:MINISTER[key][1], t};
}

// ───────── 픽셀 국기: 여러 나라 국기의 짜임새(삼색기·십자·원·별·삼각형·사선)를 본떠 씨앗 값으로 무작위 생성 ─────────
const FLAG_COLORS = ['#c8102e', '#ffffff', '#0033a0', '#012169', '#009b3a', '#fcd116', '#111111', '#ff8200', '#75aadb', '#8d1b3d', '#007a5e', '#f4f1e6'];
function flagRng(seed){ let a = (+seed || 1) >>> 0; return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ t >>> 15, t | 1); t ^= t + Math.imul(t ^ t >>> 7, t | 61); return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function flagGrid(seed){
  const r = flagRng(seed), W = 15, H = 10, pick = n => Math.floor(r() * n);
  const cols = []; while (cols.length < 4){ const c = FLAG_COLORS[pick(FLAG_COLORS.length)]; if (!cols.includes(c)) cols.push(c); }
  const [a, b, c, d] = cols, g = Array.from({length:H}, () => Array(W).fill(a));
  const fill = f => { for (let y = 0; y < H; y++) for (let x = 0; x < W; x++){ const v = f(x, y); if (v) g[y][x] = v; } };
  const star = (cx, cy, col) => [[0,-2],[0,-1],[-2,0],[-1,0],[0,0],[1,0],[2,0],[-1,1],[1,1],[-1,2],[1,2]].forEach(([dx, dy]) => { const x = cx + dx, y = cy + dy; if (y >= 0 && y < H && x >= 0 && x < W) g[y][x] = col; });
  const disc = (cx, cy, rad, col) => fill((x, y) => (x + .5 - cx) ** 2 + (y + .5 - cy) ** 2 <= rad * rad ? col : 0);
  const ext = +seed > 1e9;   // 새로 만든 국기만 늘어난 무늬를 쓴다 (이미 고른 학생들의 국기는 그대로)
  const put = (x, y, col) => { if (y >= 0 && y < H && x >= 0 && x < W) g[y][x] = col; };
  const moon = (cx, cy, col) => { const bg = g[cy][cx]; disc(cx + .5, cy + .5, 2.3, col); disc(cx + 1.6, cy + .2, 1.9, bg); };
  const sun = (cx, cy, col) => { disc(cx + .5, cy + .5, 1.7, col); [[0,-3],[0,3],[-3,0],[3,0],[-2,-2],[2,-2],[-2,2],[2,2]].forEach(([dx, dy]) => put(cx + dx, cy + dy, col)); };
  const gear = (cx, cy, col) => { const bg = g[cy][cx]; disc(cx + .5, cy + .5, 2.2, col); [[0,-3],[0,3],[-3,0],[3,0]].forEach(([dx, dy]) => put(cx + dx, cy + dy, col)); put(cx, cy, bg); };
  const wheat = (cx, cy, col) => { for (let k = -3; k <= 3; k++){ put(cx, cy + k, col); if (k % 2 === 0 && k < 3){ put(cx - 1, cy + k, col); put(cx + 1, cy + k, col); } } };
  const EMB = [star, (cx, cy, col) => disc(cx + .5, cy + .5, 1.8, col), gear, sun, wheat];
  const emblem = (cx, cy, col) => ext ? EMB[pick(EMB.length)](cx, cy, col) : (r() < .5 ? star(cx, cy, col) : disc(cx + .5, cy + .5, 1.8, col));
  switch (pick(ext ? FLAG_KINDS : 12)){
    case 0: fill((x, y) => y < 3 ? a : y < 7 ? b : c); if (r() < .4) emblem(7, 5, d); break;                         // 가로 삼색기
    case 1: fill(x => x < 5 ? a : x < 10 ? b : c); if (r() < .4) emblem(7, 5, d); break;                              // 세로 삼색기
    case 2: fill((x, y) => y < 5 ? a : b); if (r() < .5) emblem(3, 2, c); break;                                     // 가로 이색기
    case 3: { const wide = r() < .5; fill((x, y) => (wide && (x >= 3 && x <= 6 || y >= 3 && y <= 6)) ? b : 0);       // 북유럽 십자
      fill((x, y) => (x === 4 || x === 5 || y === 4 || y === 5) ? (wide ? c : b) : 0); break; }
    case 4: disc(7.5, 5, 3.2, b); break;                                                                             // 가운데 원
    case 5: fill((x, y) => y < 5 ? a : b); fill((x, y) => x < 1.4 * Math.min(y + .5, H - y - .5) ? c : 0); if (r() < .6) star(2, 5, d); break;   // 깃대 쪽 삼각형
    case 6: fill((x, y) => y % 2 ? b : a); fill((x, y) => x < 6 && y < 5 ? c : 0); star(3, 2, d); break;             // 모서리 칸 + 줄무늬
    case 7: fill((x, y) => { const v = (x + .5) / W - (y + .5) / H; return v > .14 ? a : v < -.14 ? c : b; }); break;   // 사선 띠
    case 8: fill((x, y) => (x >= 6 && x <= 8 && y >= 2 && y <= 7) || (y >= 4 && y <= 5 && x >= 4 && x <= 10) ? b : 0); break;   // 가운데 십자
    case 9: star(7, 5, b); if (r() < .5) fill((x, y) => y === 0 || y === H - 1 ? c : 0); break;                     // 큰 별
    case 10: fill((x, y) => Math.abs((x + .5) / W - (y + .5) / H) < .09 || Math.abs((x + .5) / W - 1 + (y + .5) / H) < .09 ? b : 0); break;   // 대각 십자
    case 11: fill(x => x < 5 ? a : b); emblem(9, 5, c); break;                                                     // 세로 이색기 + 문장
    case 12: fill((x, y) => y % 2 ? b : a); fill((x, y) => x < 5 && y < 5 ? c : 0); emblem(2, 2, d); break;          // 다섯 줄 + 모서리 문장
    case 13: fill((x, y) => (x + .5) / W + (y + .5) / H < 1 ? a : b); emblem(3, 2, c); break;                       // 대각선 반분
    case 14: fill((x, y) => Math.abs(x + .5 - 7.5) / 7.5 + Math.abs(y + .5 - 5) / 5 <= 1 ? b : 0); emblem(7, 5, c); break;   // 가운데 마름모
    case 15: fill((x, y) => x === 0 || y === 0 || x === W - 1 || y === H - 1 ? b : 0); emblem(7, 5, c); break;     // 테두리 + 문장
    case 16: fill((x, y) => y < 5 ? b : c); fill(x => x < 4 ? a : 0); emblem(1, 4, d); break;                      // 깃대 쪽 세로 띠
    case 17: sun(7, 5, b); if (r() < .5) fill((x, y) => y === H - 1 ? c : 0); break;                               // 가운데 해
    case 18: fill((x, y) => x < 5 ? b : 0); moon(2, 4, c); star(9, 5, c); break;                                   // 초승달과 별
    case 19: fill((x, y) => y < 2 || y > 7 ? b : 0); gear(7, 5, c); break;                                         // 톱니바퀴
    case 20: fill((x, y) => y > 6 ? b : 0); wheat(4, 4, c); wheat(10, 4, c); break;                                // 밀 이삭 둘
    case 21: fill((x, y) => { const m = Math.abs(y + .5 - 5); return x < 7 && m < 1.2 + (7 - x) * 0.5 ? b : 0; }); fill((x, y) => y >= 4 && y <= 5 && x >= 6 ? b : 0); fill((x, y) => x < 3 && Math.abs(y + .5 - 5) < 2 ? c : 0); break;   // 가로 Y자
    case 22: fill((x, y) => (x < 8) === (y < 5) ? a : b); emblem(3, 2, c); break;                                  // 네 칸 체크
    default: fill((x, y) => y >= 3 && y <= 6 ? b : 0); star(3, 4, c); star(7, 4, c); star(11, 4, c); break;        // 가운데 띠에 별 셋
  }
  return g;
}
const FLAG_KINDS = 24;
function flagSVG(seed, w){
  const g = flagGrid(seed), H = g.length, W = g[0].length;
  let rects = '';
  g.forEach((row, y) => { let x0 = 0; for (let x = 1; x <= W; x++) if (x === W || row[x] !== row[x0]){ rects += `<rect x="${x0}" y="${y}" width="${x - x0}" height="1" fill="${row[x0]}"/>`; x0 = x; } });
  return `<svg class="flag" viewBox="0 0 ${W} ${H}" width="${w}" height="${Math.round(w * H / W)}" shape-rendering="crispEdges" aria-hidden="true">${rects}</svg>`;
}

const EVENT_CLIMATE = ['heat', 'drought', 'typhoon', 'elnino', 'elninorain', 'lanina'];   // 이 사건이 난 해는 사건 문구로 대신한다
function climateImpact(out){
  if (S.event && EVENT_CLIMATE.includes(S.event.id)) return null;
  const k = S.weather.k, g = v => { S.gdp = Math.round(S.gdp * (1 + v / 100)); };
  const dam = (S.plants.dam || 0) > 0 || S.cap.hydro >= 30;
  const r = climateCase(k, g, dam, out);
  if (r && r.ok === true) hid('happy', 1);   // 대비가 통하면 인민이 지도자를 믿는다
  return r;
}
function climateCase(k, g, dam, out){
  switch (k){
    case 'drought':
      if (dam) return {ok:true, t:'가뭄이 들었지만 미리 지어 둔 댐에 물을 모아 두어 피해 없이 지나갑니다!'};
      hid('median', -1); return {ok:false, t:'가뭄으로 논밭이 말라 농사를 망쳤습니다.'};
    case 'typhoon':
      if (S.grid > 0) return {ok:true, t:'태풍이 몰아쳤지만 튼튼한 전력망 덕분에 정전 없이 지나갑니다!'};
      S.tmpWind = 0; hid('happy', -1); return {ok:false, t:'태풍에 송전선 곳곳이 끊겨 마을들이 한동안 어둠 속에 지냈습니다.'};
    case 'heat':
      if (out) return {ok:false, t:'폭염에 냉방 전기 수요가 치솟아 결국 정전까지 났습니다.'};
      if (S.ess > 0) return {ok:true, t:'폭염에 전기 수요가 치솟았지만 저장 장치에 모아 둔 전기를 나눠 써서 무사히 버팁니다!'};
      if (S.st.nature >= 60) return {ok:true, t:'폭염이 이어졌지만 도시의 숲이 그늘을 만들어 더위를 덜어 주었습니다!'};
      hid('happy', -1); return {ok:false, t:'정전은 피했지만, 그늘과 쉼터가 모자라 시민들이 무더위에 지쳤습니다.'};
    case 'cold':
    case 'lanina':
      if (out) return {ok:false, t:'한파에 난방 전기 수요가 몰려 결국 정전까지 났습니다.'};
      if (S.ess > 0 || S.grid > 0) return {ok:true, t:'한파가 길었지만 저장 장치와 전력망이 난방 전기를 고르게 나눠 주었습니다!'};
      hid('happy', -1); return {ok:false, t:'정전은 피했지만, 난방비 부담이 커져 시민들이 힘든 겨울을 보냈습니다.'};
    case 'monsoon':
      if (S.st.nature >= 55) return {ok:true, t:'폭우가 쏟아졌지만 숲과 습지가 빗물을 머금어 큰 홍수 없이 지나갑니다!'};
      hid('nature', -1); return {ok:false, t:'강이 넘쳐 마을과 논이 물에 잠겼습니다.'};
    case 'windy':
      if (S.cap.wind >= 5){ g(1); return {ok:true, t:'바람이 강해 풍력 발전기가 쉴 새 없이 돌았습니다! 남는 전기 덕분에 GDP +1%'}; }
      return {ok:null, t:S.cap.wind > 0 ? '바람이 강한 해였습니다. 풍력 발전기가 더 많았다면 남는 전기로 돈을 벌 수 있었을 것입니다.' : '바람이 강한 해였습니다. 풍력 발전기가 있었다면 전기가 넘쳤을 것입니다.'};
    case 'sunny':
      if (S.cap.solar >= 5){ g(1); return {ok:true, t:'맑은 날이 많아 태양광 발전이 넉넉했습니다! GDP +1%'}; }
      return {ok:null, t:S.cap.solar > 0 ? '햇볕이 좋은 해였습니다. 태양광 발전소가 더 많았다면 남는 전기로 돈을 벌 수 있었을 것입니다.' : '햇볕이 좋은 해였습니다. 태양광 발전소가 있었다면 전기가 넉넉했을 것입니다.'};
    case 'cloudy':
      if (S.cap.solar >= 8 && !S.ess) return {ok:false, t:'흐린 날이 많아 태양광 발전이 크게 줄었습니다. 저장 장치가 있었다면 버틸 수 있었습니다.'};
      return null;
    default: return null;
  }
}

function supplyParts(){
  const w=S.weather, th=S.tmpThermal||1, floor=S.ess?Math.min(1,.55+.2*S.ess):0, eff=1+.05*S.grid;
  const sun=Math.max(w.sun,floor), wnd=Math.max(w.wind,floor);
  const tw=(S.tmpWind===undefined?1:S.tmpWind), th2=(S.tmpHydro||1)*(w.hydro||1);
  const p={coal:S.cap.coal*th, lng:S.cap.lng, hydro:S.cap.hydro*th*th2, nuke:S.cap.nuke*th, other:S.cap.other, wind:S.cap.wind*wnd*tw, solar:S.cap.solar*sun};
  for(const k in p) p[k]=Math.round(p[k]*eff);
  return p;

function comboCheck(){
  if (S.turn < 6 || Math.random() < 0.45) return null;
  const c = COMBOS.find(x => !S.used[x.card.id] && x.test(S));
  if (!c) return null;
  S.used[c.card.id] = true;
  const roots = S.log.filter(l => l.type === 'card' && c.roots.includes(l.card.id)).slice(-3).reverse().map(l => ({title:l.card.title, year:yearOf(l.turn)}));
  return {card:c.card, cause:{title:roots.length ? roots[roots.length - 1].title : '여러 해의 선택', year:roots.length ? roots[roots.length - 1].year : yearOf(S.turn), step:3, path:roots, combo:true}};
}
function nextCard(){
  if (left() <= 0) return endGame();
  if (S.turn >= TURNS){ S.over = 'done'; return renderFuture(); }
  S.turn++;
  S.demand += TURNS === 50 ? 0.5 : 1.6;   // 산업화로 해마다 전력 수요가 늘어남
  S.adviceText = null; S.landNote = null;   // 새 안건을 읽는 동안에는 풍경 변화 문구를 숨긴다
  S.tmpDem = 0; S.tmpThermal = 1; S.tmpWind = undefined; S.tmpHydro = 1; S.event = null;
  S.weather = pickWeather();
  if (EVENT_TURNS.includes(S.turn) && S.events.length){
    let ei = S.events.findIndex(ev => EVENT_ERA[ev.id] === eraOf(S.turn)); if (ei < 0) ei = 0;
    const ev=S.events.splice(ei,1)[0]; const res=ev.apply();
    S.event={...ev, res};
    S.log.unshift({type:'event', turn:S.turn, title:ev.title, res});
  }
  const due = S.pending.findIndex(f => f.at <= S.turn);
  const combo = due >= 0 ? null : comboCheck();
  if (due >= 0){ const it=S.pending.splice(due,1)[0]; S.card=it.card; S.cause=it.cause; S.maxChain=Math.max(S.maxChain,it.cause.step); if(DOMINO.includes(it.card.id)) S.dominos++; }
  else if (combo){ S.card=combo.card; S.cause=combo.cause; S.maxChain=Math.max(S.maxChain,3); if (!combo.card.O.good) S.dominos++; }
  else { const e = eraOf(S.turn); S.card = S.decks[e].shift() || S.decks[3].shift() || S.decks[2].shift() || S.decks[1].shift(); S.cause = null; }
  if (!S.card) return endGame();
  if (S.cause) (S.butterfly = S.butterfly || []).push({path:[...(S.cause.path || [{title:S.cause.title, year:S.cause.year}]), {title:S.card.title, year:yearOf(S.turn)}], combo:!!S.cause.combo, good:goodChain(S.card)});
  renderPlay();
}

    el.push(`<g><rect x="${tx-1}" y="${ty}" width="2" height="6" fill="#5B3E2B"/><circle cx="${tx}" cy="${ty-3}" r="${S.st.nature>=70?7:6}" fill="${S.st.nature<35?'#8C8F4A':'#3E8E4E'}"/></g>`); }
  for (let i=0;i<L.stumps;i++){ const tx=14+(trees+i)*11+((trees+i)%2)*3, ty=146+((trees+i)%3)*6;
    el.push(`<g><rect x="${tx-3}" y="${ty}" width="6" height="4" fill="#7A5A3A"/><ellipse cx="${tx}" cy="${ty}" rx="3" ry="1.2" fill="#C8A878"/></g>`); }
  if (S.st.nature >= 65) for (let i=0;i<4;i++){ const bx=90+i*34, by=30+(i%2)*10; el.push(`<path class="bird" d="M${bx} ${by} q4 -4 8 0 q4 -4 8 0" stroke="#3A3A3A" stroke-width="1.5" fill="none"/>`); }
  // 빈부격차: 커지면 판자촌과 금빛 고층 빌딩이 함께 들어선다
  for (let i=0;i<L.shanty;i++){ const x=92+i*15; el.push(`<g><path d="M${x} 165 v-8 l6 -3 l6 3 v8z" fill="#8A7A66"/><rect x="${x}" y="154" width="12" height="2" fill="#5F6B73"/><rect x="${x+4}" y="160" width="3" height="5" fill="#3A3028"/></g>`); }
  if (L.shanty >= 2){ const th = 40 + L.shanty * 9; el.push(`<g><rect x="228" y="${118-th}" width="12" height="${th}" fill="#C9A43A"/><rect x="230" y="${120-th}" width="8" height="${th-4}" fill="#E8CF72" opacity=".6"/><rect x="233" y="${110-th}" width="2" height="8" fill="#C9A43A"/></g>`); }
  // 국민 행복도: 광장의 사람들 (시위대 ↔ 축제)
  for (let i=0;i<L.crowd;i++){ const px=180+i*11, py=161, c=L.mood==='angry'?'#5A5A5A':L.mood==='happy'?['#C8202A','#2B6CB0','#2E8B57','#D4A017'][i%4]:'#7A6E66';
    let g = `<circle cx="${px}" cy="${py-7}" r="2.4" fill="#E0BB93"/><rect x="${px-2}" y="${py-5}" width="4" height="7" fill="${c}"/>`;

}

// 풍경을 정하는 값: 선택 전후를 비교해 "올해 풍경이 이렇게 바뀌었다"를 알려 준다
function landState(){
  const st = S.st, h = st.happy;
  return {trees:Math.max(0, Math.min(15, Math.round(st.nature / 6.5))), stumps:Math.max(0, Math.min(6, Math.round((55 - st.nature) / 7))),
    shanty:Math.max(0, Math.min(5, Math.round((st.gap - 48) / 6))), crowd:h < 35 ? 6 : h >= 60 ? 6 : 3, mood:h < 35 ? 'angry' : h >= 60 ? 'happy' : 'calm',
    sea:Math.max(0, Math.min(8, Math.round((50 - st.climate) / 6))), towns:Math.min(9, S.built.filter(x => x === 'town').length)};
}
const BUILD_NAME = {coal:'석탄 발전소', dc:'데이터센터', solar:'태양광 패널', wind:'풍력 발전기', nuke:'원자력 발전소', dam:'댐', mine:'광산', factory:'공장', hut:'집', ess:'에너지 저장 장치', tower:'송전탑', geo:'지열 발전소', tank:'저장 탱크', town:'아파트'};
function landDiff(a, b){
  const out = [];
  (S.lastAdd || []).forEach(t => BUILD_NAME[t] && out.push(`${BUILD_NAME[t]}이 들어섰습니다`));
  if (b.towns > a.towns) out.push('아파트가 새로 올라갔습니다');
  if (b.trees < a.trees) out.push(`나무 ${a.trees - b.trees}그루가 사라졌습니다`); else if (b.trees > a.trees) out.push(`나무 ${b.trees - a.trees}그루가 자랐습니다`);
  if (b.shanty > a.shanty) out.push('도시 끝에 판자촌이 늘었습니다'); else if (b.shanty < a.shanty) out.push('판자촌이 줄었습니다');
  if (b.mood !== a.mood) out.push({angry:'광장에 시위대가 모였습니다', happy:'광장에 축제가 열렸습니다', calm:'광장이 조용해졌습니다'}[b.mood]);
  if (b.sea > a.sea) out.push('바닷물이 땅으로 올라왔습니다'); else if (b.sea < a.sea) out.push('바닷물이 물러났습니다');
  return out.map(t => t.replace(/([가-힣])이 들어섰/, (m, c) => (((c.charCodeAt(0) - 0xAC00) % 28) ? c + '이' : c + '가') + ' 들어섰'));
}
function pollutionSVG(smog, dirt){
  let out = '';
  if (dirt > 0.45) for (let i = 0; i < Math.round(dirt * 8); i++) out += `<rect x="${326 + (i * 13) % 50}" y="${124 + (i * 7) % 36}" width="3" height="2" fill="#5A4A32"/>`;   // 바다 위 쓰레기
  if (smog > 0.2){ const o = Math.min(0.85, smog); out += `<g opacity="${o}"><ellipse cx="70" cy="26" rx="46" ry="12" fill="#6F6A62"/><ellipse cx="170" cy="18" rx="56" ry="13" fill="#77726A"/><ellipse cx="290" cy="30" rx="50" ry="12" fill="#6F6A62"/></g>`; }   // 스모그 구름
  if (smog > 0) out += `<rect width="380" height="165" fill="#8C877C" opacity="${(smog * 0.4).toFixed(2)}"/>`;   // 뿌연 공기
  return out;
}

// 하던 통치를 이 브라우저에 저장해 두었다가 이어서 한다. 카드·사건은 번호만 저장한다
const saveKey = () => 'ttalkkak_save_' + ((PICK && PICK.name) || '');
let CARD_MAP = null;
function saveGame(){
  if (!S || S.over || !PICK || S.recorded) return;
  try {
    const rep = (k, v) => {
      if (v && typeof v === 'object'){
        if (typeof v.apply === 'function' && v.id) return {__e:v.id, res:v.res};
        if (typeof v.id === 'string' && v.q && (CARD_MAP || (CARD_MAP = new Map([...BASE, ...FOLLOW].map(c => [c.id, c])))).get(v.id) === v) return {__c:v.id};
      }
      return v;
    };
    const ses = {...SESSION, net:null, runs:(SESSION.runs || []).map(r => ({...r, S:undefined}))};
    localStorage.setItem(saveKey(), JSON.stringify({v:1, at:Date.now(), S:{...S, net:null}, SESSION:ses, ROOM, TIME_LIMIT, NATION, MYFLAG, GDP0, START_RANK}, rep));
  } catch(e){ console.warn(e); }
}
function loadSave(){
  try { const d = JSON.parse(localStorage.getItem(saveKey()) || 'null'); if (!d || d.v !== 1) return null;
    if (Date.now() - d.S.start > (d.TIME_LIMIT || 1800) * 1000) { clearSave(); return null; }   // 시간이 다 지난 판은 지운다
    return d; } catch(e){ return null; }
}
function clearSave(){ try { localStorage.removeItem(saveKey()); } catch(e){} }
function resumeGame(){
  const d = loadSave(); if (!d) return renderHome();
  const cards = new Map([...BASE, ...FOLLOW].map(c => [c.id, c])), evs = new Map(EVENTS.map(e => [e.id, e]));
  const rev = v => {
    if (Array.isArray(v)) return v.map(rev);
    if (v && typeof v === 'object'){
      if (v.__c) return cards.get(v.__c);
      if (v.__e){ const e = evs.get(v.__e); return v.res !== undefined ? {...e, res:v.res} : e; }
      for (const k in v) v[k] = rev(v[k]);
    }
    return v;
  };
  const st = rev(d.S);
  ROOM = d.ROOM; TIME_LIMIT = d.TIME_LIMIT; NATION = d.NATION; MYFLAG = d.MYFLAG; GDP0 = d.GDP0; START_RANK = d.START_RANK;
  if (ROOM) setLength(50);
  SESSION = rev(d.SESSION); SESSION.net = null;
  S = st; S.net = null; S.mates = [];
  SND.unlockAudio(); SND.music('play');
  if (ROOM && NET_OK) netStart();
  PLAYING = true;
  renderPlay();
}

function bannerHTML(){
  const bad = avgHidden(S) < 40, list = bad ? SLOGAN_BAD : SLOGAN_OK, sl = list[S.turn % list.length];

  return `<div class="banner">${sl}</div>${S.motto ? `<div class="mottoline"><span>“${esc(S.motto)}” · ${esc(josa(S.nation, '이', '가'))} 나아갈 길 · “${esc(S.motto)}” · ${esc(josa(S.nation, '이', '가'))} 나아갈 길 · </span></div>` : ''}<div class="ticker"><span>${line}${line}</span></div>`;

let timers=[];
function clearTimers(){timers.forEach(t=>{clearInterval(t);clearTimeout(t)});timers=[]; const rg = document.getElementById('reign'); if (rg) rg.hidden = true;}   // 통치 연도 표시는 결재 화면에서만
function tickClock(){ timers.push(setInterval(()=>{ document.querySelectorAll('.clock').forEach(el=>el.textContent=clock()); },1000)); }
function runLock(btns, sec, done){
  btns.forEach(b=>{ const l=b.querySelector('.lock'); l.style.transition=`width ${sec}s linear`; requestAnimationFrame(()=>requestAnimationFrame(()=>l.style.width='100%')); });
  timers.push(setTimeout(()=>{ btns.forEach(b=>{ b.disabled=false; const l=b.querySelector('.lock'); if(l) l.remove(); }); done&&done(); }, sec*1000));
}
const esc = t => String(t).replace(/[&<>"]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));

  const fut = ENDINGS.filter(e => e.cat === 'future'), rest = ENDINGS.filter(e => e.cat !== 'future');
  return `<h4 class="dexh">미래 엔딩 · 50년을 끝까지 다스리면 <em>${fut.filter(e => got.includes(e.id)).length}/${fut.length}</em></h4><div class="dex">${fut.map(cell).join('')}</div>
    <h4 class="dexh">몰락과 통치의 결말 <em>${rest.filter(e => got.includes(e.id)).length}/${rest.length}</em></h4><div class="dex">${rest.map(cell).join('')}</div>`;

  app.innerHTML = '<div class="screen start"><span class="badge" style="justify-self:start">방 만들기</span><h1>방을 만드는 중…</h1><div id="roommsg"></div></div>';
  let r = null;
  try { r = await supaRpc('tk_make_room', {p_name:ACCOUNT.name, p_pass:ACCOUNT.pass}); } catch(e){ console.warn(e); }
  if (!r || !r.ok){ document.getElementById('roommsg').innerHTML = `<div class="power bad">${esc((r && r.msg) || '방을 만들지 못했습니다. 잠시 뒤 다시 해 주세요.')}</div><button class="ghost" onclick="renderRoomMenu()">뒤로</button>`; return; }

    <div class="power up"><b>${esc(ACCOUNT.name)}</b> 님이 이 방의 방장입니다. 메뉴의 「방 관리」에서 친구들의 순위를 보고 초보 독재자 시간(지금 ${r.beginner_min ?? BASE_MIN}분)을 바꿀 수 있습니다.</div>
    <button class="primary" id="goroom">이 방으로 들어가기</button>

async function backToRoom(){

}

      document.getElementById('dgo').onclick = () => launch(m, name);
    }, 350));
  }, 450 * k + 200)));
}

function explainParts(c, opt, side){
  const good = [], bad = [], d = opt.d || {};
  const add = (ok, t) => (ok ? good : bad).push(t);
  const sup = opt.sup ? Object.values(opt.sup).reduce((a, b) => a + b, 0) : 0;
  if (sup > 0) good.push('발전 설비가 늘어 전력 수급에 도움이 됩니다');
  if (sup < 0) bad.push('발전 설비가 줄어 전기가 모자랄 수 있습니다');
  if ((opt.dem || 0) > 0) bad.push('전기를 많이 쓰는 시설이 늘어 전력 수요가 커집니다');
  if ((opt.dem || 0) < 0) good.push('전력 수요가 줄어 정전 걱정이 덜해집니다');
  if (opt.ess || opt.grid) good.push('전력망이 튼튼해져 정전에 강해집니다');
  if (d.gdp) add(d.gdp > 0, `경제(GDP)가 ${amt(d.gdp)}${d.gdp > 0 ? '성장할' : '줄어들'} 수 있습니다`);
  if (d.happy) add(d.happy > 0, `국민 행복도가 ${amt(d.happy)}${d.happy > 0 ? '오를' : '떨어질'} 수 있습니다`);
  if (d.median) add(d.median > 0, `보통 사람들의 소득이 ${amt(d.median)}${d.median > 0 ? '늘' : '줄'} 수 있습니다`);
  if (d.gap) add(d.gap < 0, `빈부격차가 ${amt(d.gap)}${d.gap < 0 ? '줄어들' : '커질'} 수 있습니다`);
  if (d.nature) add(d.nature > 0, d.nature > 0 ? `자연환경이 ${amt(d.nature)}나아질 수 있습니다` : `자연환경이 ${amt(d.nature)}훼손될 수 있습니다`);
  if (d.climate) add(d.climate > 0, d.climate > 0 ? `탄소 배출이 줄어 기후에 ${amt(d.climate)}도움이 됩니다` : `탄소 배출이 늘어 기후가 ${amt(d.climate)}나빠질 수 있습니다`);
  const e = econEffect(c, opt, side) || {};
  if (e.ex) add(e.ex > 0, `수출이 ${amt(e.ex / 2)}${e.ex > 0 ? '늘' : '줄'} 수 있습니다`);
  if (e.im) add(e.im < 0, e.im > 0 ? '외국에서 사 오는 물건(수입)이 늘어 나라 돈이 더 나갑니다' : '수입이 줄어 나라 돈이 덜 나갑니다');
  if (e.as) add(e.as > 0, e.as > 0 ? '나라 자산이 늘 수 있습니다' : '나라 돈이 들어갑니다');
  if (e.debt) add(e.debt < 0, e.debt > 0 ? `공사비를 대느라 나랏빚이 ${amt(e.debt / 2)}늘 수 있습니다` : '나랏빚이 줄어들 수 있습니다');
  if (e.tax) add(e.tax < 0, e.tax > 0 ? '세금이 올라 나라 수입은 늘지만 국민 부담이 커집니다' : '세금이 줄어 부담은 덜하지만 나라 수입이 줄어듭니다');
  return {good, bad};
}
function explainSentence(lead, {good, bad}){
  if (!good.length && !bad.length) return `${lead} 지금 상태가 크게 달라지지 않습니다.`;
  const j = a => a.join('. ');
  if (!bad.length) return `${lead} ${j(good)}.`;
  if (!good.length) return `${lead} ${j(bad)}.`;
  return `${lead} ${j(good)}. 하지만 ${j(bad)}.`;
}
