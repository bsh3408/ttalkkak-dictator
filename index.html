  S.justUnlocked = wasLocked && realUnlocked(S.baseName);
  recordRun();
  const lastEnd = endingOf(S), lastYears = S.turn;
  // 초보 독재자 공개 화면과 투표는 이번 수업에서 GDP가 가장 높았던 판으로 보여 준다
  if (S.mode === 1 && SESSION.runs.length){ const top = SESSION.runs.slice().sort((a, b) => b.gdp - a.gdp)[0].S; if (top && top !== S) S = top; }
  netPush({done:true, ending:endingOf(S).id, motto:S.motto || null});
  if (S.net && !S.net.open && S.mode === 1) setTimeout(() => waitRoom('revealed', reveal), 300);

function recordRun(){
  if (S.recorded) return; S.recorded = true; clearSave();

  S.sessionFalls = SESSION.falls;
  const e = endingOf(S), more = ENDINGS.filter(x => x.id !== e.id && x.id !== 'plain' && x.test(S));
  const before = loadTitles();
  saveDex(e.id); more.forEach(x => saveDex(x.id));
  // 칭호는 한 판에 몇 개만: 대표 결말 하나, 3급 이상 등급, 얻기 어려운 칭호 (함께 해당한 결말은 엔딩 수집에만 들어간다)
  const lv = drankOf(S).lv, why = {[e.id]:`결말 「${e.name}」`};
  if (lv <= 3) why['r' + lv] = `독재자 등급 ${lv}급`;
  if (S.mode === 2){ const h = Object.fromEntries(hsScores(S).map(x => [x.k, x.v])); HARD_TITLES.filter(x => x.test(S, h)).forEach(x => why[x.id] = x.why); }
  saveTitles(Object.keys(why));
  S.newTitles = Object.keys(why).filter(id => !before.includes(id)); S.titleWhy = why;
  SESSION.newT = (SESSION.newT || []).concat(S.newTitles);
  SESSION.best = Math.max(SESSION.best || 0, S.gdp);
  SESSION.runs.push({run:S.run, nation:S.nation, over:S.over, years:S.turn, gdp:S.gdp, rank:worldRank(S.gdp), ai:S.aiCount, cards:S.log.filter(l => l.type === 'card').length, ending:e.name, grade:drankOf(S).lv + '급', S});

// 휴먼스킬 성적표: 실제로 한 행동으로 매긴다. 랭킹 점수에는 들어가지 않는다
function hsScores(s){
  const cards = s.log.filter(l => l.type === 'card').length || 1, pc = (a, b) => Math.round(Math.max(0, Math.min(100, a / b * 100)));
  const open = Object.keys(s.hsOpen || {}).length, ai = s.aiCount || 0;
  return [
    {k:'curious', n:'호기심', v:pc(open, cards), why:`해설을 펼쳐 본 안건 ${open} / ${cards}장`},
    {k:'reflect', n:'성찰적 사고', v:s.hsChainN ? pc(s.hsChainOk || 0, s.hsChainN) : null, why:s.hsChainN ? `돌아온 안건 ${s.hsChainN}건 중 ${s.hsChainOk || 0}건을 현명하게 결재` : '돌아온 안건이 없었습니다'},
    {k:'whole', n:'통합적 사고', v:pc((s.hsBal || 0) * 2, s.turn || 1), why:`경제가 크면서 국민 삶·공정함·환경도 나빠지지 않은 해 ${s.hsBal || 0}년 (가장 길게 ${s.hsRunMax || 0}년 연속)`},
    {k:'critic', n:'비판적 사고', v:s.hsAiN ? pc((s.hsAiOk || 0) + (s.hsAskSharp || 0), s.hsAiN + (s.hsAskN || 0)) : null, why:s.hsAiN ? `AI의 안을 들은 ${s.hsAiN}번 중 ${s.hsAiOk || 0}번 옳게 판단 · 되묻기 ${s.hsAskN || 0}번 중 날카로운 질문 ${s.hsAskSharp || 0}번` : 'AI의 안을 들어 본 적이 없습니다'},
    {k:'solver', n:'문제 해결 사고', v:s.hsPrepN ? pc(s.hsPrepOk || 0, s.hsPrepN) : null, why:s.hsPrepN ? `기후가 시험한 ${s.hsPrepN}번 중 ${s.hsPrepOk || 0}번 미리 대비해 이겨 냄` : '기후의 시험을 받지 않았습니다'},
    {k:'ethic', n:'주체성·윤리적 사고', v:Math.max(0, Math.min(100, 100 - Math.round(ai / cards * 60) - (s.corrupt || 0) * 8 - (s.illegal || 0) * 10 - (s.spies || 0) * 10)), why:`AI에게 맡김 ${ai}번 · 생각 없이 찍은 도장 ${s.corrupt || 0}번 · 불법·기술 훔치기 ${(s.illegal || 0) + (s.spies || 0)}번`},
  ];
}
function hsBox(s){
  const H = hsScores(s);
  return `<details class="box hsbox" open><summary><h3>휴먼스킬 성적표 <em>랭킹 점수와는 상관없습니다 · 눌러서 접기</em></h3></summary><div class="in"><div class="bars">${H.map(x =>
    `<div class="r ${x.v != null && x.v < 40 ? 'bad' : ''}" style="grid-template-columns:8.6em 1fr 3em"><span>${x.n}</span><div class="t">${x.v == null ? '' : `<i style="width:${x.v}%"></i>`}</div><b>${x.v == null ? '–' : x.v}</b></div><small class="hswhy">${x.why}</small>`).join('')}</div></div></details>`;
}
function butterflyBox(s){
  // 이어진 연쇄는 가장 긴 것만 남긴다 (A→B 가 A→B→C 안에 들어 있으면 뺀다)
  const key = x => x.path.map(p => p.title).join('>');
  const all = (s.butterfly || []).filter((x, i, a) => a.findIndex(y => key(y) === key(x)) === i);
  const uniq = all.filter(x => !all.some(y => y !== x && key(y).startsWith(key(x) + '>')));
  const seeds = s.log.filter(l => l.type === 'card').length;
  if (!uniq.length) return `<div class="box"><h3>나의 선택이 일으킨 연쇄</h3><div class="in lead">이번 통치에서는 돌아온 결재가 없었습니다. 더 오래 다스리면 예전에 찍은 도장이 다른 일이 되어 돌아옵니다.</div></div>`;
  const b = uniq.slice().sort((x, y) => y.path.length - x.path.length).slice(0, 3);
  return `<div class="box"><h3>나의 선택이 일으킨 연쇄 <em>연쇄 ${uniq.length}개${uniq.length > 3 ? ' · 긴 것 3개' : ''}</em></h3><div class="in">${b.map(x => `<div class="bfly ${x.good ? 'good' : ''}">

      <div class="delta">${chainSum(x.path)}</div></div>`).join('')}
    <div class="lead" style="font-size:13px">결재 ${seeds}번 가운데 ${uniq.reduce((a, x) => a + x.path.length - 1, 0)}번이 몇 년 뒤 다른 안건이 되어 돌아왔습니다.</div></div></div>`;
}

function leaderMeta(s){ const G = gradeOf(s); return {score:G.total, grade:drankOf(s).lv + '급', years:s.turn, parts:G.it.map(x => x.v)}; }
const PART_NAMES = ['경제 성장', '국민 삶', '공정함', '환경과 기후', '스스로 판단', '통치 기간'];
async function leaderRows(){
  if (S.net){
    const rows = (await supaRpc('tk_reveal2', {p_code:S.net.code, p_mode:2})) || [];
    const list = rows.filter(r => r.st && r.st.score != null).map(r => ({name:r.name, nation:r.nation, flag:r.flag, gdp:+r.gdp, score:r.st.score, grade:r.st.grade, years:r.st.years, parts:r.st.parts || [], ending:r.ending, me:r.name === S.baseName}));

  }
  // 혼자 연습: 가상 학급 친구들의 지표를 만들어 비교한다

  return [{name:S.baseName, nation:S.nation, flag:MYFLAG, gdp:S.gdp, ...me, ending:endingOf(S).id, me:true}].concat(S.bots.map(b => {

  }));
}

}
function reveal(){
  SND.music('reveal'); SND.sfx('reveal');
  const logs=S.log.slice().reverse();
  const cards=S.log.filter(l=>l.type==='card').length;
  app.innerHTML = `<div class="screen">
    <span class="badge" style="justify-self:start">초보 독재자 · 숨겨진 지표 공개</span>
    <h1>GDP 말고, 나라는 어떻게 되었을까요?</h1>
    ${S.over === 'done' ? futureHTML(S) : drankBox(S)}
    ${endingBox()}
    ${SESSION && SESSION.runs.some(r => r.S.newTitles && r.S.newTitles.length) ? `<div class="power up">이번 수업에서 얻은 칭호: ${[...new Set(SESSION.runs.flatMap(r => r.S.newTitles || []))].map(id => `<b>${esc(titleOf(id))}</b>`).join(' · ')}</div>` : ''}
    <div class="box"><div class="in plan"><div><small>AI의 안을 따른 횟수</small><b class="big">${S.aiCount}<span style="font-size:18px;color:var(--mute)"> / ${cards}번</span></b></div><div><small>AI 제안을 듣고 거부한 횟수</small><b class="big">${S.aiRefused}<span style="font-size:18px;color:var(--mute)">번</span></b></div><div><small>숙청당한 횟수</small><b class="big ${S.purges?'neg':''}">${S.purges}<span style="font-size:18px;color:var(--mute)">번</span></b></div></div></div>
    <div class="box"><h3>숨겨져 있던 나랏빚</h3><div class="in"><div class="lead">${fmt(Math.round(S.debt))}조 원 · GDP의 ${Math.round(debtRatio(S)*100)}% (IMF 위험선 100%, 게임 설정)</div></div></div>
    <div class="box"><h3>숨겨져 있던 국민 생활 지표</h3><div class="in">${compareBars()}</div></div>
    ${gradeBox(S, false)}
    ${runsTable(false)}
    <div class="land">${landSVG()}</div>
    <div class="box"><h3>통치 기록 다시 보기</h3><div class="log" style="max-height:none">${logs.map(l=>{
        if (l.type==='event') return `<div class="e ev"><span class="y">${yearOf(l.turn)}</span><div><b>사건</b> ${l.title}<div class="d">${l.res}</div></div></div>`;
        const hidTxt=STATS.filter(s=>l.d[s.k]).map(s=>`${s.n} ${l.d[s.k]>0?'+':''}${l.d[s.k]}`).join(' · ');
        const what = l.side==='A' ? 'AI의 안 결재' : (l.side==='O'?'승인':'반려');
        return `<div class="e"><span class="y">${yearOf(l.turn)}</span><div>${l.step?`<span class="ch">연쇄 ${l.step}</span>`:''}${l.card.title} <b>${what}</b>${l.side==='A'?'<span class="ai">AI</span>':''}${l.out?'<span class="bo">정전</span>':''}
          ${l.side==='A'?`<div class="said">AI가 말한 것: ${l.card.A.plan} GDP ${l.d.gdp>0?'+':''}${l.d.gdp}%</div><div class="unsaid">AI가 말하지 않은 것: ${hidTxt||'없음'}</div>`:`<div class="d">GDP ${l.d.gdp>0?'+':''}${l.d.gdp||0}%${hidTxt?' · '+hidTxt:''}</div>`}</div></div>`}).join('')}</div></div>
    <button class="ghost" onclick="PICK?renderHome():renderStart()">처음으로</button></div>`;
}
function nationCard(){
  SND.sfx('end');
  app.innerHTML = `<div class="screen">
    <span class="badge" style="justify-self:start">진짜 독재자 · 투표용 나라 카드 (이름 가림)</span>
    <h1>나라 ${String.fromCharCode(65+Math.floor(Math.random()*20))}</h1>
    <div class="ending"><small>이 나라의 결말</small><b>${endingOf(S).name}</b><small>${endingOf(S).sub}</small></div>
    <div class="box"><div class="in"><div class="lead">이 나라의 통치 이념</div><div style="font-size:18px;font-weight:700">“${esc(S.motto||'방향 없음')}”</div></div></div>
    <div class="land">${landSVG()}</div>
    <div class="box"><h3>국가소득 ${fmt(S.gdp)}조 원 <em>AI ${S.aiCount}번 · 정전 ${S.blackouts}번</em></h3><div class="in">${compareBars()}</div></div>
    <div class="box"><h3>가장 고민한 선택과 그 이유</h3><div class="in"><input type="text" id="refl" maxlength="200" placeholder="예: 데이터센터 유치를 거절했다. 냉각수 부족이 걱정됐다."></div></div>
    ${S.net && !S.net.open ? `<button class="primary" id="submitcard">나라 카드 제출하기</button><div id="votewait"></div>` : S.net ? `<button class="primary" onclick="renderLeaders()">${S.net.code === 'ALL' ? '모두의' : '우리 방'} 진짜 지도자 랭킹 보기</button>` : `<p class="lead">실제 수업에서는 지도자 이름을 가린 채 이 카드가 친구들에게 공개되고, 1인 1표로 투표합니다.</p><button class="primary" onclick="renderLeaders()">진짜 지도자 랭킹 보기 (가상 학급)</button>`}
    ${left() > 0 ? '<button class="primary" onclick="renderNewRun()">새 나라 세우기</button>' : ''}
    <button class="ghost" onclick="saveDex(endingOf(S).id);PICK?renderHome():renderStart()">처음으로</button></div>`;
  const sb = document.getElementById('submitcard');
  if (sb) sb.onclick = () => {
    netPush({done:true, card:true, ending:endingOf(S).id, reflection:document.getElementById('refl').value || '', motto:S.motto || ''});
    SESSION.card = true;
    sb.disabled = true; sb.textContent = '제출했습니다';
    document.getElementById('votewait').innerHTML = '<div class="power">선생님이 투표를 열면 친구들의 나라 카드가 나옵니다…</div>';
    waitRoom('voting', renderVote);
  };
}
async function renderVote(){
  let cards = [];
  try { cards = await supaRpc('tk_cards', {p_code:S.net.code}); } catch(e){}
  const endName = id => (ENDINGS.find(e => e.id === id) || {name:'-'}).name;
  const bars = st => st ? STATS.map(x => `<span>${x.n} ${st[x.k]}</span>`).join(' · ') : '';
  app.innerHTML = `<div class="screen" style="max-width:900px">
    <span class="badge" style="justify-self:start">진짜 독재자 · 이름을 가린 나라 카드 투표</span>
    <h1>가장 좋은 나라에 한 표를</h1>
    <p class="lead">자기 나라에는 투표할 수 없습니다. 고른 까닭을 한 줄로 적어 주세요.</p>
    <div class="vcards">${cards.map(c => `<label class="vcard"><input type="radio" name="vt" value="${c.label}"><b>나라 ${c.label}</b>
      <span class="vm">“${esc(c.motto || '이념 없음')}”</span>
      <span class="vs">결말: ${esc(endName(c.ending))} · GDP ${fmt(Math.round(c.gdp))}조 · AI ${c.ai_count}번 · 숙청 ${c.purges}번</span>
      <span class="vs">${bars(c.st)}</span>
      ${c.reflection ? `<span class="vr">가장 고민한 선택: ${esc(c.reflection)}</span>` : ''}</label>`).join('') || '<p class="lead">아직 제출된 나라 카드가 없습니다.</p>'}</div>
    <input type="text" id="vreason" maxlength="200" placeholder="이 나라를 고른 까닭">
    <button class="primary" id="vgo">투표하기</button><div id="vmsg"></div>
    <button class="ghost" onclick="renderLeaders()">진짜 지도자 랭킹 보기</button></div>`;
  document.getElementById('vgo').onclick = async () => {
    const pick = document.querySelector('input[name=vt]:checked');
    const msg = document.getElementById('vmsg');
    if (!pick){ msg.innerHTML = '<div class="power bad">나라를 하나 골라 주세요.</div>'; return; }
    try {
      const r = await supaRpc('tk_vote', {p_id:S.net.id, p_secret:S.net.secret, p_label:pick.value, p_reason:document.getElementById('vreason').value || ''});
      msg.innerHTML = r.ok ? `<div class="power up">나라 ${pick.value}에 투표했습니다. 다시 고르면 바뀝니다.</div>` : `<div class="power bad">${esc(r.msg)}</div>`;
    } catch(e){ msg.innerHTML = '<div class="power bad">서버에 연결하지 못했습니다.</div>'; }
  };
}
renderStart();
</script>
