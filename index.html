 "햇빛과 바람이 강할 때 남는 전기를 저장했다가 부족할 때 꺼내 쓰면 재생에너지를 버리지 않고 쓸 수 있어 화석 연료 발전을 덜 돌리게 되므로 기후가 나아질 수 있습니다. 전기가 끊기는 일이 줄어 경제가 성장하고 국민 행복도도 조금 오를 수 있습니다.", "X": "지금 상태가 그대로 이어집니다. 다만 날씨에 따라 들쭉날쭉한 재생에너지 전기를 저장해 두고 안정적으로 쓸 기회는 얻지 못합니다."}, "agrisolar": {"O": "농지 위에 태양광 패널을 얹으면 농사를 계속 지으면서 전기도 만들 수 있어 전력 공급이 크게 늘고, 탄소를 내보내지 않는 발전이라 기후가 나아질 수 있습니다. 전기 판매 수익을 마을 주민이 나눠 받으므로 보통 사람 소득과 국민 행복도가 오르고 빈부격차가 줄어들 수 있으며, 경제도 조금 성장할 수 있습니다.", "X": "지금 상태가 그대로 이어집니다. 다만 농사와 발전을 함께 하며 주민 소득을 늘리고 빈부격차를 줄일 기회는 얻지 못합니다."}, "carbontax": {"O": "탄소를 많이 내보낼수록 세금을 더 내게 하면 기업이 연료를 아끼고 배출을 줄이려 하므로 기후가 크게 나아지고 자연환경도 조금 좋아질 수 있습니다. 에너지를 아끼는 움직임으로 전력 수요가 줄고, 배출이 많은 대기업이 더 부담하므로 빈부격차도 조금 줄어들 수 있습니다. 하지만 기업의 생산 비용이 늘어 경제 성장은 조금 줄어들 수 있습니다.", "X": "지금 상태가 그대로 이어집니다. 다만 기업이 스스로 탄소 배출을 줄이도록 이끌 기회는 얻지 못합니다."}, "coalimport": {"O": "값싼 수입 석탄으로 발전 연료비를 낮추면 전기요금을 올리지 않아도 되어 국민 행복도가 조금 오르고, 석탄 발전이 늘어 전력 공급이 늘며 경제도 성장할 수 있습니다. 하지만 석탄을 더 많이 태우게 되어 이산화탄소 배출이 늘고 기후가 크게 나빠질 수 있습니다.", "X": "지금 상태가 그대로 이어집니다. 다만 값싼 연료로 전기요금을 묶어 두고 전력 공급을 늘릴 기회는 얻지 못합니다."}, "grid": {"O": "전압을 높여 전기를 보내면 전류가 작아져 송전선에서 열로 사라지는 손실이 줄고, 남쪽의 재생에너지 전기를 북쪽 공장에서 쓸 수 있게 되어 경제가 성장하고 기후도 조금 나아질 수 있습니다. 하지만 긴 송전선과 철탑을 세우며 숲과 땅이 깎여 자연환경이 나빠지고, 철탑이 지나가는 마을 주민의 불편으로 국민 행복도가 조금 떨어질 수 있습니다.", "X": "지금 상태가 그대로 이어집니다. 다만 남쪽의 재생에너지 전기를 손실을 줄여 공장 지대까지 보낼 기회는 얻지 못합니다."}, "hydro": {"O": "댐에 가둔 물이 높은 곳에서 떨어지는 힘으로 발전기를 돌리면 탄소를 거의 내보내지 않고 전기를 만들 수 있어 전력 공급이 크게 늘고 경제가 크게 성장하며 기후도 나아질 수 있습니다. 하지만 강이 막히고 넓은 땅이 물에 잠겨 물고기와 숲의 서식지가 사라지므로 자연환경이 크게 나빠질 수 있습니다. 또 살던 마을을 떠나야 하는 주민들의 피해로 국민 행복도가 떨어지고 빈부격차가 조금 커질 수 있습니다.", "X": "지금 상태가 그대로 이어집니다. 다만 대규모 수력 발전으로 전력 공급을 늘리고 경제를 키울 기회는 얻지 못합니다."}, "mine": {"O": "배터리용 니켈은 수요가 많은 광물이라 광산을 열면 수출로 돈이 들어와 경제가 크게 성장할 수 있습니다. 하지만 열대 우림을 파헤치고 광석을 처리하는 과정에서 숲과 강이 오염되어 자연환경이 크게 나빠지고, 광산 장비를 돌리느라 전력 수요도 늘어날 수 있습니다. 또 이익이 주로 외국 기업과 일부 사람에게 돌아가 빈부격차가 커지고 국민 행복도가 조금 떨어질 수 있습니다.", "X": "지금 상태가 그대로 이어집니다. 다만 광물 수출로 큰돈을 벌어 경제를 키울 기회는 얻지 못합니다."}, "village": {"O": "전선을 멀리 끌어오지 않아도 마을에서 소형 태양광과 배터리로 직접 전기를 만들어 쓸 수 있어 전력 공급이 늘고 기후도 조금 나아질 수 있습니다. 밤에도 불을 켜고 공부하거나 일할 수 있게 되어 국민 행복도와 보통 사람 소득이 오르고 도시와 산골의 빈부격차가 줄어들 수 있으며, 경제도 조금 성장할 수 있습니다.", "X": "지금 상태가 그대로 이어집니다. 다만 산골 마을에 전기를 공급해 주민의 생활을 나아지게 하고 빈부격차를 줄일 기회는 얻지 못합니다."}, "lng": {"O": "액화 천연가스 발전소가 생기면 전력 공급이 크게 늘어 경제가 성장할 수 있습니다. 하지만 천연가스도 화석 연료라서 석탄보다는 적지만 태울 때 이산화탄소가 나와 기후가 나빠질 수 있습니다. 또 연료를 모두 수입해야 해서 비싼 연료비가 전기요금에 더해지면 보통 사람 소득이 조금 줄어들 수 있습니다.", "X": "지금 상태가 그대로 이어집니다. 다만 석탄보다 매연이 적은 발전소로 전력 공급을 크게 늘릴 기회는 얻지 못합니다."}, "geo": {"O": "화산 지대의 뜨거운 땅속 열로 물을 끓여 증기로 발전기를 돌리면 날씨와 상관없이 일정하게 전기를 만들 수 있어 전력 공급이 크게 늘고, 탄소 배출이 적어 기후가 나아지며 경제도 성장할 수 있습니다. 하지만 땅을 깊이 뚫고 발전 시설을 세우는 과정에서 주변 자연환경이 조금 나빠질 수 있습니다.", "X": "지금 상태가 그대로 이어집니다. 다만 날씨와 상관없이 꾸준히 전기를 만드는 발전 설비를 늘릴 기회는 얻지 못합니다."}, "h2": {"O": "재생에너지 전기로 물을 전기 분해해 만든 수소는 사용할 때 이산화탄소 대신 물이 나오는 연료라서 기후가 나아질 수 있고, 새 기술과 일자리로 경제가 조금 성장하며 보통 사람 소득도 조금 오를 수 있습니다. 하지만 물을 분해하는 데 전기가 많이 들어 전력 수요가 늘어납니다.", "X": "지금 상태가 그대로 이어집니다. 다만 탄소를 내보내지 않는 미래 연료 기술을 미리 익힐 기회는 얻지 못합니다."}, "smr": {"O": "소형 모듈 원자로는 작은 원자로를 공장에서 만들어 조립하는 방식으로, 연구가 성공하면 탄소를 거의 내보내지 않는 전기를 얻을 수 있어 기후에 조금 도움이 될 수 있습니다. 연구 투자로 기술 인력과 일자리가 생겨 경제가 조금 성장하고 보통 사람 소득도 조금 오를 수 있습니다.", "X": "지금 상태가 그대로 이어집니다. 다만 탄소 배출이 적은 미래 발전 기술을 연구하고 기술 인력을 기를 기회는 얻지 못합니다."}, "ccs": {"O": "굴뚝에서 나오는 이산화탄소를 붙잡아 땅속 깊은 지층에 가두면 대기로 나가는 탄소가 줄어 기후가 나아질 수 있습니다. 하지만 장치를 달고 돌리는 데 돈과 에너지가 들어 발전 비용이 오르므로 경제 성장은 조금 줄어들 수 있습니다.", "X": "지금 상태가 그대로 이어집니다. 다만 석탄 발전소에서 나오는 이산화탄소를 줄일 기회는 얻지 못합니다."}, "ev": {"O": "전기차 공장이 들어서면 많은 일자리와 투자가 생겨 경제가 크게 성장하고 보통 사람 소득도 조금 오를 수 있으며, 휘발유차 대신 전기차가 늘면 배기가스가 줄어 기후도 조금 나아질 수 있습니다. 하지만 공장 가동과 전기차 충전으로 전력 수요가 크게 늘고, 공장 주변 지역에 이익이 몰려 빈부격차가 조금 커질 수 있습니다.", "X": "지금 상태가 그대로 이어집니다. 다만 외국 투자와 일자리로 경제를 크게 키울 기회는 얻지 못합니다."}, "crypto": {"O": "외국 업체가 조국의 전기를 사 가면 전기 판매 수입이 생겨 경제가 성장할 수 있습니다. 하지만 채굴장은 수많은 컴퓨터로 계산을 쉬지 않고 반복하므로 전력 수요가 크게 늘고, 늘어난 전기를 만드는 과정에서 탄소 배출이 늘어 기후가 조금 나빠질 수 있습니다.", "X": "지금 상태가 그대로 이어집니다. 다만 남는 전기를 팔아 수입을 올릴 기회는 얻지 못합니다."}, "ewaste": {"O": "폐전자제품과 폐배터리에서 구리, 금, 리튬 같은 금속을 뽑아 팔면 돈을 벌어 경제가 성장할 수 있습니다. 하지만 처리 과정에서 납, 수은 같은 중금속과 유해 물질이 흙과 물로 새어 나가 자연환경이 크게 나빠지고, 주민 건강에 대한 걱정으로 국민 행복도가 조금 떨어질 수 있습니다.", "X": "지금 상태가 그대로 이어집니다. 다만 폐전자제품 속 금속을 팔아 돈을 벌 기회는 얻지 못합니다."}, "led": {"O": "발광 다이오드 조명은 같은 밝기를 내는 데 기존 조명보다 전기를 훨씬 적게 써서 전력 수요가 줄어들 수 있습니다. 전기를 덜 만들어도 되니 탄소 배출이 줄어 기후가 조금 나아지고, 전기요금이 절약되어 경제도 조금 성장할 수 있습니다.", "X": "지금 상태가 그대로 이어집니다. 다만 같은 밝기를 더 적은 전기로 얻어 전력 수요를 줄일 기회는 얻지 못합니다."}, "transit": {"O": "많은 사람이 전기버스와 지하철을 함께 타면 자동차가 줄어 배기가스가 줄고 기후가 나아질 수 있습니다. 출퇴근이 편해지고 교통비가 줄어 국민 행복도가 오르고 보통 사람 소득도 조금 오르며, 경제도 조금 성장할 수 있습니다. 하지만 버스와 전동차를 전기로 움직이므로 전력 수요가 늘어납니다.", "X": "지금 상태가 그대로 이어집니다. 다만 배기가스를 줄이고 출퇴근을 편하게 만들 기회는 얻지 못합니다."}, "fuelsub": {"O": "나라가 서민의 등유와 가스 연료비 일부를 대신 내주면 생활비 부담이 줄어 국민 행복도가 오르고, 보통 사람 소득이 조금 늘며 빈부격차가 조금 줄어들 수 있습니다. 하지만 보조금에 나라 돈이 들어 경제 성장이 조금 줄고, 연료가 싸져 화석 연료를 더 많이 태우게 되므로 기후가 조금 나빠질 수 있습니다.", "X": "보조금에 쓰던 나라 돈을 다른 곳에 쓸 수 있어 경제가 조금 성장할 수 있습니다. 하지만 서민 가정의 연료비 부담이 커져 국민 행복도가 떨어지고, 보통 사람 소득이 조금 줄며 빈부격차가 조금 커질 수 있습니다."}, "ecopark": {"O": "원시림을 국립공원으로 지정하면 개발이 막혀 숲과 동식물이 보호되므로 자연환경이 나아질 수 있습니다. 생태 관광객이 찾아와 일자리와 수입이 생기므로 경제가 조금 성장하고 보통 사람 소득과 국민 행복도도 조금 오를 수 있습니다.", "X": "지금 상태가 그대로 이어집니다. 다만 원시림을 보호하면서 생태 관광으로 수입을 얻을 기회는 얻지 못합니다."}, "offset": {"O": "숲은 광합성으로 대기 중 이산화탄소를 흡수해 저장하므로, 숲을 베지 않고 지키면 자연환경과 기후가 나아질 수 있습니다. 숲을 지키는 대가로 선진국의 돈이 들어와 경제가 조금 성장하고 보통 사람 소득도 조금 오를 수 있습니다.", "X": "지금 상태가 그대로 이어집니다. 다만 숲을 지키는 대가로 돈을 받고 기후 개선에도 도움을 줄 기회는 얻지 못합니다."}, "biomass": {"O": "나무를 태워 전기를 만들면 전력 공급이 크게 늘고 경제가 성장할 수 있으며, 베어 낸 자리에 나무가 다시 자라 이산화탄소를 흡수한다고 보면 기후에는 조금 도움이 될 수 있습니다. 하지만 태울 때는 이산화탄소가 바로 나오고, 연료로 쓸 나무를 대량으로 베어 내면 숲과 서식지가 줄어 자연환경이 크게 나빠질 수 있습니다.", "X": "지금 상태가 그대로 이어집니다. 다만 새 발전 설비로 전력 공급을 늘릴 기회는 얻지 못합니다."}, "coolshelter": {"O": "에어컨이 없는 사람들도 무료 쉼터에서 더위를 피할 수 있어 온열 질환 걱정이 줄고 국민 행복도가 오를 수 있으며, 형편에 따른 차이가 줄어 빈부격차도 조금 줄어들 수 있습니다. 하지만 쉼터를 짓고 운영하는 데 나라 돈이 들어 경제 성장이 조금 줄고, 냉방에 쓰는 전기로 전력 수요가 늘어납니다.", "X": "지금 상태가 그대로 이어집니다. 다만 에어컨이 없는 노인과 아이들이 더위를 피할 곳을 마련할 기회는 얻지 못합니다."}, "tou": {"O": "전기가 몰리는 시간의 요금을 비싸게 받으면 사람들이 세탁이나 충전 같은 일을 한가한 시간으로 옮기므로, 전기가 한꺼번에 몰리는 부담이 줄어 전력 수요가 크게 줄어들 수 있습니다. 수요가 몰릴 때 급히 돌리던 화석 연료 발전기를 덜 써도 되어 기후가 조금 나아질 수 있습니다. 하지만 생활 시간을 요금에 맞춰야 하는 불편으로 국민 행복도가 조금 떨어질 수 있습니다.", "X": "지금 상태가 그대로 이어집니다. 다만 전기가 한꺼번에 몰리는 부담을 요금으로 나눌 기회는 얻지 못합니다."}, "gasfield": {"O": "앞바다의 천연가스를 뽑아 전기를 만들고 수출하면 전력 공급이 크게 늘고 외화가 들어와 경제가 크게 성장할 수 있습니다. 하지만 천연가스도 태우면 이산화탄소가 나오는 화석 연료라 기후가 나빠지고, 바다에 시추 시설을 세우면서 해양 생태계가 흔들려 자연환경도 나빠질 수 있습니다.", "X": "지금 상태가 그대로 이어집니다. 다만 가스를 팔아 외화를 벌고 전력 공급을 늘릴 기회는 얻지 못합니다."}, "cookstove": {"O": "장작 대신 전기나 가스 조리 기구를 쓰면 집 안 연기가 줄어 아이들의 호흡기 건강이 좋아지므로 국민 행복도가 오를 수 있습니다. 땔감으로 베던 나무가 줄어 자연환경이 나아지고, 땔감을 구하던 시간을 다른 일에 쓸 수 있어 경제가 조금 성장하고 보통 사람 소득도 조금 오를 수 있습니다. 하지만 전기 조리 기구가 늘어 전력 수요가 늘어납니다.", "X": "지금 상태가 그대로 이어집니다. 다만 집 안 연기를 줄여 가족의 건강을 지키고 땔감용 벌목을 줄일 기회는 얻지 못합니다."}, "smartcity": {"O": "도시 곳곳의 센서 정보로 인공지능이 신호등과 가로등을 조절하면 교통이 원활해지고 새 산업이 생겨 경제가 성장하고 국민 행복도가 조금 오를 수 있습니다. 하지만 수많은 센서와 컴퓨터를 돌리느라 전력 수요가 크게 늘고, 혜택이 개발된 도시에 사는 사람들에게 몰려 빈부격차가 조금 커질 수 있습니다.", "X": "지금 상태가 그대로 이어집니다. 다만 첨단 도시를 만들어 경제를 키울 기회는 얻지 못합니다."}, "heatpump": {"O": "열펌프는 바깥 공기의 열을 모아 집 안으로 옮기는 장치라서 같은 전기로 더 많은 열을 얻을 수 있고, 석유 보일러를 쓰지 않으니 탄소 배출이 줄어 기후가 나아질 수 있습니다. 난방이 편해져 국민 행복도가 조금 오르고 경제도 조금 성장할 수 있습니다. 하지만 석유 대신 전기로 난방하므로 전력 수요가 늘어납니다.", "X": "지금 상태가 그대로 이어집니다. 다만 석유 보일러를 줄여 난방에서 나오는 탄소 배출을 줄일 기회는 얻지 못합니다."}, "fusion": {"O": "핵융합은 가벼운 원자핵이 합쳐질 때 나오는 에너지를 이용하는 기술로, 연구가 성공하면 탄소를 내보내지 않는 전기를 얻을 수 있어 기후에 조금 도움이 될 수 있습니다. 국제 연구에 참여하며 과학자를 기르고 기술을 익혀 경제가 조금 성장하고 보통 사람 소득도 조금 오를 수 있습니다.", "X": "지금 상태가 그대로 이어집니다. 다만 여러 나라와 함께 미래 에너지 기술을 익힐 기회는 얻지 못합니다."}, "phaseout": {"O": "석탄을 태우는 발전소를 닫으면 이산화탄소와 매연이 줄어 기후가 크게 나아지고, 공기가 맑아져 국민 행복도가 오를 수 있습니다. 하지만 석탄 발전 설비가 사라져 전력 공급이 크게 줄고, 그만큼 다른 발전소를 마련하는 동안 경제 성장이 조금 줄어들 수 있습니다.", "X": "지금 상태가 그대로 이어집니다. 다만 석탄 발전에서 나오는 이산화탄소와 매연을 줄일 기회는 얻지 못합니다."}, "intlgrid": {"O": "이웃 나라와 전력망을 이으면 전기가 남을 때 팔고 모자랄 때 사 올 수 있어 정전 걱정이 줄고 경제가 성장하며 국민 행복도가 조금 오를 수 있습니다. 남는 재생에너지 전기를 버리지 않고 나눠 쓸 수 있어 기후도 조금 나아질 수 있습니다.", "X": "지금 상태가 그대로 이어집니다. 다만 남거나 모자란 전기를 이웃 나라와 주고받을 기회는 얻지 못합니다."}, "justtrans": {"O": "석탄 산업이 줄어도 노동자가 재생에너지 기술을 배워 새 일자리로 옮길 수 있어 국민 행복도가 오르고, 보통 사람 소득이 조금 오르며 빈부격차가 줄어들 수 있습니다. 하지만 교육에 나라 돈이 들어 경제 성장은 조금 줄어들 수 있습니다.", "X": "석탄 산업이 줄어들 때 노동자들이 새 일자리를 찾기 어려워 국민 행복도가 떨어지고 빈부격차가 조금 커질 수 있습니다. 또 새 기술을 익힌 노동자를 길러 낼 기회도 얻지 못합니다."}, "seawall": {"O": "지구가 따뜻해지면서 빙하가 녹고 바닷물의 부피가 늘어 해수면이 높아지므로, 방조제를 쌓고 마을을 높은 곳으로 옮기면 주민이 안전해져 국민 행복도가 오를 수 있습니다. 피해를 크게 입기 쉬운 가난한 바닷가 주민이 보호되어 빈부격차도 조금 줄어들 수 있습니다. 하지만 큰 공사비와 이주비가 들어 경제 성장은 조금 줄어들 수 있습니다.", "X": "공사비는 들지 않지만, 빙하가 녹고 바닷물의 부피가 늘어 높아진 바다가 바닷가 마을을 계속 위협하므로 주민의 불안이 커져 국민 행복도가 떨어질 수 있습니다."}, "aigrid": {"O": "인공지능이 전기 사용량을 미리 예측해 필요한 곳에 알맞게 나눠 보내면 낭비되는 전기가 줄어 전력 수요가 줄어들 수 있습니다. 발전소를 덜 돌려도 되어 기후가 조금 나아지고, 전기를 효율적으로 쓰게 되어 경제도 성장할 수 있습니다.", "X": "지금 상태가 그대로 이어집니다. 다만 전기를 필요한 곳에 알맞게 나눠 보내 낭비를 줄일 기회는 얻지 못합니다."}, "carbonmarket": {"O": "나라가 정한 배출 총량 안에서 기업이 배출권을 사고팔게 하면, 배출을 줄이는 비용이 적은 기업부터 배출을 줄이게 되어 기후가 나아질 수 있습니다. 하지만 기업이 배출권을 사거나 설비를 바꾸는 비용을 부담해야 해서 경제 성장은 조금 줄어들 수 있습니다.", "X": "지금 상태가 그대로 이어집니다. 다만 시장의 원리를 이용해 탄소 배출을 줄일 기회는 얻지 못합니다."}, "spacesolar": {"O": "햇빛이 강하고 구름이 적은 사막에 태양광 단지를 지으면 전력 공급이 크게 늘고, 탄소를 내보내지 않는 발전이라 기후가 나아질 수 있습니다. 새 발전 단지와 우주 태양광 연구로 일자리가 생겨 경제가 성장하고 보통 사람 소득도 조금 오를 수 있습니다.", "X": "지금 상태가 그대로 이어집니다. 다만 햇빛이 풍부한 사막에서 전력 공급을 크게 늘릴 기회는 얻지 못합니다."}, "exportzone": {"O": "세금을 깎아 주면 외국 공장이 들어와 수출과 일자리가 늘어 경제가 크게 성장할 수 있습니다. 하지만 이익이 외국 기업과 일부 지역에 몰려 빈부격차가 커지고, 공장이 늘면서 전력 수요가 늘며 자연환경도 조금 나빠질 수 있습니다.", "X": "지금 상태가 그대로 이어집니다. 다만 외국 공장을 불러들여 수출을 크게 늘릴 기회는 얻지 못합니다."}, "port": {"O": "큰 화물선이 드나들 수 있는 항만이 생기면 수출입 물건을 더 많이 실어 나를 수 있어 경제가 크게 성장할 수 있습니다. 하지만 갯벌을 메우면 바다 생물의 서식지와 오염 물질을 걸러 주는 갯벌의 기능이 사라져 자연환경이 나빠지고, 항만 시설을 돌리느라 전력 수요도 조금 늘어날 수 있습니다.", "X": "지금 상태가 그대로 이어집니다. 다만 수출입 물동량을 늘려 경제를 크게 키울 기회는 얻지 못합니다."}, "steel": {"O": "철강은 건물, 자동차, 배 등 거의 모든 산업에 쓰이므로 제철소가 생기면 경제가 크게 성장할 수 있습니다. 하지만 철광석(산화 철)에서 산소를 떼어 내는 환원 과정에 석탄을 써서 이산화탄소가 많이 나오므로 기후가 크게 나빠지고, 전력 수요가 늘며 자연환경도 조금 나빠질 수 있습니다.", "X": "지금 상태가 그대로 이어집니다. 다만 모든 산업의 기초인 철강을 직접 만들어 경제를 키울 기회는 얻지 못합니다."}, "chipfab": {"O": "반도체는 값비싼 첨단 제품이라 공장이 들어서면 경제가 크게 성장하고 고소득 일자리가 생겨 보통 사람 소득도 조금 오를 수 있습니다. 하지만 정밀한 공정을 쉬지 않고 돌리느라 전력 수요가 크게 늘고, 많은 물과 화학 물질을 써서 자연환경이 나빠질 수 있습니다. 또 높은 임금이 일부 기술자에게 몰려 빈부격차가 커질 수 있습니다.", "X": "지금 상태가 그대로 이어집니다. 다만 첨단 산업과 고소득 일자리로 경제를 크게 키울 기회는 얻지 못합니다."}, "battery": {"O": "전기차와 에너지 저장 장치에 쓰이는 배터리는 수요가 빠르게 늘고 있어 공장이 생기면 경제가 크게 성장할 수 있습니다. 하지만 공장을 돌리느라 전력 수요가 늘고, 생산 과정의 화학 물질과 폐수로 자연환경이 조금 나빠질 수 있습니다.", "X": "지금 상태가 그대로 이어집니다. 다만 재생에너지 시대의 핵심 부품 산업으로 경제를 키울 기회는 얻지 못합니다."}, "tourism": {"O": "국제공항과 관광 도시가 생기면 외국 관광객이 쓰는 돈이 들어와 경제가 크게 성장하고, 일자리와 즐길 거리가 늘어 국민 행복도도 조금 오를 수 있습니다. 하지만 비행기는 많은 연료를 태워 이산화탄소를 내보내므로 기후가 나빠지고, 호텔과 시설이 늘어 전력 수요도 조금 늘어날 수 있습니다.", "X": "지금 상태가 그대로 이어집니다. 다만 외국 관광객의 돈으로 경제를 키울 기회는 얻지 못합니다."}, "aihub": {"O": "인공지능 기업과 연구소가 한곳에 모이면 첨단 산업이 커져 경제가 크게 성장하고 보통 사람 소득도 조금 오를 수 있습니다. 하지만 데이터센터가 수많은 컴퓨터를 돌리고 식히느라 전력 수요가 크게 늘고, 높은 임금이 일부 기술 인력에게 몰려 빈부격차가 커질 수 있습니다.", "X": "지금 상태가 그대로 이어집니다. 다만 미래 기술 경쟁에 뛰어들어 경제를 크게 키울 기회는 얻지 못합니다."}, "h2export": {"O": "재생에너지로 만든 그린수소는 사용할 때 이산화탄소 대신 물이 나오는 연료라서, 수출하면 외화가 들어와 경제가 크게 성장하고 화석 연료를 대신해 기후에도 도움이 될 수 있습니다. 하지만 물을 전기 분해하는 데 전기가 많이 들어 전력 수요가 늘어납니다.", "X": "지금 상태가 그대로 이어집니다. 다만 깨끗한 연료를 팔아 외화를 벌 기회는 얻지 못합니다."}, "evexport": {"O": "전기차를 많이 만들어 수출하면 외화와 일자리가 늘어 경제가 크게 성장하고 보통 사람 소득도 조금 오를 수 있으며, 휘발유차를 대신하는 전기차가 늘어 기후도 조금 나아질 수 있습니다. 하지만 공장이 늘어 전력 수요가 늘어납니다.", "X": "지금 상태가 그대로 이어집니다. 다만 전기차 수출로 경제를 크게 키울 기회는 얻지 못합니다."}, "textile": {"O": "임금이 낮은 노동력으로 옷감과 옷을 싸게 만들어 팔면 수출이 늘어 경제가 크게 성장할 수 있습니다. 하지만 낮은 임금 때문에 이익이 공장 주인에게 몰려 빈부격차가 조금 커지고, 염색 폐수가 강으로 흘러 자연환경이 나빠지며 전력 수요도 늘어날 수 있습니다.", "X": "지금 상태가 그대로 이어집니다. 다만 섬유 수출과 일자리로 경제를 키울 기회는 얻지 못합니다."}, "cement": {"O": "시멘트를 직접 만들면 건물과 도로 공사가 활발해져 경제가 성장할 수 있습니다. 하지만 석회암을 높은 온도로 구우면 석회암 속 탄산 칼슘이 분해되면서 이산화탄소가 나오고 연료도 많이 태워 기후가 나빠질 수 있습니다. 또 석회암 산을 깎고 먼지가 날려 자연환경이 나빠지며 전력 수요도 늘어납니다.", "X": "지금 상태가 그대로 이어집니다. 다만 부족한 시멘트를 직접 만들어 공사를 늘리고 경제를 키울 기회는 얻지 못합니다."}, "highway": {"O": "수도와 항구를 잇는 길이 생기면 물건을 나르는 시간과 비용이 줄어 경제가 성장하고, 이동이 편해져 국민 행복도가 조금 오를 수 있습니다. 하지만 산과 숲을 가르는 도로 때문에 동물의 서식지가 끊겨 자연환경이 나빠지고, 자동차와 트럭이 늘어 배기가스 때문에 기후가 조금 나빠질 수 있습니다.", "X": "지금 상태가 그대로 이어집니다. 다만 물건을 빠르게 실어 날라 경제를 키울 기회는 얻지 못합니다."}, "logging": {"O": "열대림의 나무를 베어 수출하면 목재를 판 돈이 들어와 경제가 성장할 수 있습니다. 하지만 숲이 사라지면 수많은 동식물의 서식지가 없어져 자연환경이 크게 나빠지고, 이산화탄소를 흡수하던 나무가 줄어 기후도 나빠질 수 있습니다.", "X": "지금 상태가 그대로 이어집니다. 다만 목재를 팔아 돈을 벌 기회는 얻지 못합니다."}, "smallhydro": {"O": "개울물이 흐르는 힘으로 작은 발전기를 돌리면 탄소를 내보내지 않고 마을 전기를 만들 수 있어 전력 공급이 늘고, 기후가 조금 나아지며 경제도 조금 성장할 수 있습니다. 하지만 물길에 시설을 세우면서 물고기가 다니는 길이 막혀 자연환경이 조금 나빠질 수 있습니다.", "X": "지금 상태가 그대로 이어집니다. 다만 산골 마을에서 탄소 없이 전기를 만들 기회는 얻지 못합니다."}, "fertilizer": {"O": "화학 비료로 작물에 필요한 질소 같은 영양분을 채워 주면 수확량이 늘어 경제가 성장하고, 농민 소득이 늘어 보통 사람 소득도 조금 오를 수 있습니다. 하지만 비료를 만드는 데 천연가스와 전기를 많이 써서 전력 수요가 늘고 이산화탄소가 나와 기후가 나빠질 수 있습니다. 또 쓰고 남은 비료가 강과 호수로 흘러들어 물이 오염되면 자연환경이 나빠질 수 있습니다.", "X": "지금 상태가 그대로 이어집니다. 다만 농사 수확량을 늘려 농민 소득을 높일 기회는 얻지 못합니다."}, "techschool": {"O": "학생들이 공장에서 필요한 기술을 배우면 더 좋은 일자리를 얻을 수 있어 보통 사람 소득이 오르고 빈부격차가 줄어들 수 있습니다. 숙련된 기술자가 늘어 경제가 조금 성장하고 국민 행복도도 조금 오를 수 있습니다.", "X": "지금 상태가 그대로 이어집니다. 다만 기술을 갖춘 인력을 길러 소득을 높이고 빈부격차를 줄일 기회는 얻지 못합니다."}, "refinery": {"O": "원유를 휘발유와 경유로 직접 만들면 비싼 완제품 연료를 사 오지 않아도 되어 경제가 크게 성장할 수 있습니다. 하지만 원유를 높은 온도로 가열해 끓는점 차이로 나누는 과정과 만들어진 연료를 태우는 과정에서 이산화탄소가 많이 나와 기후가 크게 나빠질 수 있습니다. 또 기름 유출과 대기 오염으로 자연환경이 나빠지며 전력 수요도 늘어납니다.", "X": "지금 상태가 그대로 이어집니다. 다만 연료를 직접 만들어 경제를 크게 키울 기회는 얻지 못합니다."}, "ruralgrid": {"O": "전기가 없던 농촌에 불이 들어오면 밤에도 공부하고 일할 수 있고 농기계와 가전제품을 쓸 수 있어 국민 행복도가 오르고, 보통 사람 소득이 조금 늘며 도시와 농촌의 빈부격차가 줄어들 수 있습니다. 경제도 조금 성장할 수 있습니다. 하지만 새로 전기를 쓰는 집이 늘어 전력 수요가 늘어납니다.", "X": "지금 상태가 그대로 이어집니다. 다만 농촌 마을에 전기를 공급해 생활을 나아지게 하고 빈부격차를 줄일 기회는 얻지 못합니다."}, "wastefire": {"O": "도시 쓰레기를 태워 전기를 만들면 쓰레기 매립지가 줄어 자연환경이 조금 나아지고, 새 발전 설비가 생겨 전력 공급이 늘며 경제도 조금 성장할 수 있습니다. 하지만 태우는 과정에서 이산화탄소가 나와 기후가 조금 나빠질 수 있습니다.", "X": "지금 상태가 그대로 이어집니다. 다만 쓰레기 매립지를 줄이면서 전기도 얻을 기회는 얻지 못합니다."}, "coaltown": {"O": "산속 석탄을 직접 캐면 발전 연료를 마련할 수 있어 석탄 발전에 따른 전력 공급이 크게 늘고, 광부 일자리가 생겨 경제가 성장하고 보통 사람 소득도 조금 오를 수 있습니다. 하지만 산을 파헤치고 광산 폐수가 흘러나와 자연환경이 나빠지고, 캐낸 석탄을 태우면 이산화탄소가 나와 기후가 나빠질 수 있습니다.", "X": "지금 상태가 그대로 이어집니다. 다만 발전 연료를 직접 마련하고 광부 일자리를 만들 기회는 얻지 못합니다."}, "foreignloan": {"O": "외국에서 빌린 큰돈으로 공장과 도로를 지으면 생산과 물자 수송이 늘어 경제가 성장할 수 있습니다. 하지만 새 시설의 혜택이 공장과 도로가 생긴 지역과 일부 기업에 먼저 돌아가 빈부격차가 조금 커질 수 있습니다.", "X": "지금 상태가 그대로 이어집니다. 다만 빌린 돈으로 공장과 도로를 빨리 지어 경제를 키울 기회는 얻지 못합니다."}, "tidalflat": {"O": "갯벌을 메워 공장 부지를 만들면 공장이 들어서고 일자리가 생겨 경제가 성장하고 보통 사람 소득도 조금 오를 수 있습니다. 하지만 갯벌은 수많은 생물이 사는 곳이자 오염 물질을 걸러 주는 곳이라, 메우면 자연환경이 크게 나빠질 수 있습니다.", "X": "지금 상태가 그대로 이어집니다. 다만 새 공장 부지를 만들어 경제를 키울 기회는 얻지 못합니다."}, "cleanwater": {"O": "깨끗한 수돗물을 공급하고 하수를 처리하면 오염된 물로 퍼지는 수인성 질병이 줄어 국민 행복도가 오르고, 하수가 강으로 그대로 흘러가지 않아 자연환경이 나아질 수 있습니다. 깨끗한 물을 구하기 어려웠던 가난한 가정이 특히 혜택을 받아 빈부격차가 조금 줄고, 경제도 조금 성장할 수 있습니다.", "X": "지금 상태가 그대로 이어집니다. 다만 깨끗한 물로 국민 건강을 지키고 강을 깨끗하게 만들 기회는 얻지 못합니다."}, "plastic": {"O": "플라스틱은 석유를 원료로 값싸게 대량 생산할 수 있어 공장이 들어서면 경제가 크게 성장할 수 있습니다. 하지만 일회용 플라스틱은 자연에서 잘 분해되지 않아 쓰레기로 쌓이고 바다로 흘러가 자연환경이 나빠질 수 있습니다. 또 석유를 가공하는 과정에서 이산화탄소가 나와 기후가 나빠지고 전력 수요도 늘어납니다.", "X": "지금 상태가 그대로 이어집니다. 다만 공장을 유치해 경제를 크게 키울 기회는 얻지 못합니다."}, "fastfashion": {"O": "유행에 맞춘 값싼 옷을 빠르게 만들어 수출하면 일자리와 수출이 늘어 경제가 크게 성장할 수 있습니다. 하지만 낮은 임금으로 많이 만드는 방식이라 이익이 공장 주인에게 몰려 빈부격차가 커지고, 옷감 염색 폐수와 버려지는 옷 때문에 자연환경이 나빠지며 전력 수요도 늘어날 수 있습니다.", "X": "지금 상태가 그대로 이어집니다. 다만 옷 수출로 경제를 크게 키울 기회는 얻지 못합니다."}, "newtown": {"O": "집이 부족할 때 신도시를 지으면 건설 일자리가 생겨 경제가 성장하고 살 집이 늘어 국민 행복도가 조금 오를 수 있습니다. 하지만 새 아파트를 살 여유가 있는 사람과 없는 사람의 차이가 벌어져 빈부격차가 조금 커지고, 숲과 농지를 개발하면서 자연환경이 나빠지며 전력 수요도 늘어납니다.", "X": "지금 상태가 그대로 이어집니다. 다만 부족한 집을 늘리고 건설 경기를 살릴 기회는 얻지 못합니다."}, "aircon": {"O": "에어컨이 집집마다 생기면 더위로 인한 고통과 온열 질환이 줄어 국민 행복도가 오르고, 가전제품 판매가 늘어 경제도 조금 성장할 수 있습니다. 하지만 에어컨은 전기를 많이 써서 여름 전력 수요가 크게 늘고, 그 전기를 만드는 과정에서 탄소 배출이 늘어 기후가 조금 나빠질 수 있습니다.", "X": "나라가 구입비를 대지 않아도 되지만, 점점 더워지는 여름을 에어컨 없이 버텨야 하는 가정이 많아 국민 행복도가 조금 떨어질 수 있습니다."}, "pumpedhydro": {"O": "전기가 남을 때 물을 위쪽 저수지로 퍼 올려 위치 에너지로 저장했다가 필요할 때 흘려보내 발전기를 돌리면, 남는 재생에너지를 버리지 않고 쓸 수 있어 기후가 조금 나아지고 경제도 조금 성장할 수 있습니다. 하지만 산속에 위아래 두 개의 저수지를 만들면서 숲과 계곡이 물에 잠겨 자연환경이 나빠질 수 있습니다.", "X": "지금 상태가 그대로 이어집니다. 다만 남는 전기를 물의 위치 에너지로 저장해 둘 기회는 얻지 못합니다."}, "rooftop": {"O": "이미 있는 지붕에 태양광 패널을 달면 새 땅을 깎지 않고도 전기를 만들 수 있어 전력 공급이 크게 늘고, 탄소를 내보내지 않는 발전이라 기후가 나아질 수 있습니다. 집집마다 전기요금이 줄어 보통 사람 소득이 조금 오르고 경제도 조금 성장할 수 있습니다.", "X": "지금 상태가 그대로 이어집니다. 다만 땅을 깎지 않고 지붕에서 깨끗한 전기를 만들 기회는 얻지 못합니다."}, "shalegas": {"O": "땅속 깊은 셰일층에 물과 모래, 화학 물질을 높은 압력으로 넣어 암석을 깨뜨리면 갇혀 있던 가스를 뽑아낼 수 있어 전력 공급이 크게 늘고 경제가 크게 성장할 수 있습니다. 하지만 이 과정에서 많은 물을 쓰고 지하수가 오염될 수 있어 자연환경이 크게 나빠지며, 가스를 태우면 이산화탄소가 나와 기후도 나빠질 수 있습니다.", "X": "지금 상태가 그대로 이어집니다. 다만 땅속 가스로 전력 공급을 늘리고 경제를 키울 기회는 얻지 못합니다."}, "palmoil": {"O": "기름야자 열매에서 짠 기름으로 바이오 연료를 만들면 새 연료를 얻어 전력 공급이 늘고 경제가 성장할 수 있습니다. 하지만 농장을 넓히려고 열대림을 베어 내면 서식지가 사라져 자연환경이 크게 나빠지고, 숲이 흡수하던 이산화탄소가 줄고 연료를 태울 때도 이산화탄소가 나와 기후가 조금 나빠질 수 있습니다.", "X": "지금 상태가 그대로 이어집니다. 다만 바이오 연료로 전력 공급을 늘리고 경제를 키울 기회는 얻지 못합니다."}, "livestock": {"O": "소를 대규모로 길러 고기를 수출하면 외화가 들어와 경제가 성장할 수 있습니다. 하지만 소는 소화 과정에서 온실 기체인 메테인을 내뿜고, 목초지를 만들려고 숲을 베어 내므로 기후가 나빠질 수 있습니다. 또 가축 분뇨가 강으로 흘러들고 숲이 줄어 자연환경도 나빠질 수 있습니다.", "X": "지금 상태가 그대로 이어집니다. 다만 고기 수출로 외화를 벌 기회는 얻지 못합니다."}, "platform": {"O": "배달 앱이 들어오면 주문과 배달이 편리해지고 새 일거리가 생겨 경제가 성장하고 국민 행복도가 조금 오를 수 있습니다. 하지만 배달원은 정해진 월급 없이 건당 수수료를 받는 경우가 많아 보통 사람 소득이 조금 줄고, 이익이 플랫폼 기업에 몰려 빈부격차가 커질 수 있습니다.", "X": "지금 상태가 그대로 이어집니다. 다만 편리한 배달 서비스와 새 일거리로 경제를 키울 기회는 얻지 못합니다."}, "nukewaste": {"O": "방사성 폐기물은 아주 오랫동안 방사선을 내므로, 깊고 단단한 지층에 가두는 방법을 연구하면 주민의 걱정이 줄어 국민 행복도가 조금 오르고 자연환경 보호에도 조금 도움이 될 수 있습니다. 하지만 오랜 연구에 나라 돈이 들어 경제 성장은 조금 줄어들 수 있습니다.", "X": "연구비는 들지 않지만, 방사성 폐기물이 발전소 안 임시 저장 시설에 계속 쌓이면서 주변 환경에 대한 위험이 커져 자연환경이 조금 나빠질 수 있습니다."}, "ebike": {"O": "휘발유 오토바이를 전기 오토바이로 바꾸면 배기가스와 소음이 줄어 기후가 나아지고 국민 행복도가 조금 오를 수 있으며, 새 오토바이 판매로 경제도 조금 성장할 수 있습니다. 하지만 오토바이를 충전하는 데 전기가 들어 전력 수요가 늘어납니다.", "X": "지금 상태가 그대로 이어집니다. 다만 도시의 배기가스와 소음을 줄일 기회는 얻지 못합니다."}, "floatpv": {"O": "저수지 물 위에 패널을 띄우면 땅을 깎지 않고도 태양광 발전을 할 수 있어 전력 공급이 크게 늘고, 탄소를 내보내지 않아 기후가 나아지며 경제도 조금 성장할 수 있습니다. 하지만 패널이 물 위를 덮어 햇빛이 물속에 덜 닿으면 물속 생물에 영향을 주어 자연환경이 조금 나빠질 수 있습니다.", "X": "지금 상태가 그대로 이어집니다. 다만 땅을 깎지 않고 태양광 발전 설비를 늘릴 기회는 얻지 못합니다."}, "deepsea": {"O": "바다 밑의 배터리 광물을 캐면 수요가 큰 광물을 팔 수 있어 경제가 성장할 수 있습니다. 하지만 채굴 장비가 바닥을 긁고 흙탕물을 일으켜, 아주 느리게 회복되는 심해 생태계가 망가지므로 자연환경이 크게 나빠질 수 있습니다.", "X": "지금 상태가 그대로 이어집니다. 다만 배터리 광물을 팔아 경제를 키울 기회는 얻지 못합니다."}, "greensteel": {"O": "석탄 대신 수소로 철광석의 산소를 떼어 내면 이산화탄소 대신 물이 나오므로 제철 과정의 탄소 배출이 줄어 기후가 크게 나아질 수 있습니다. 저탄소 철강을 원하는 나라에 팔 수 있어 경제도 성장할 수 있습니다. 하지만 수소를 만들고 설비를 돌리는 데 전기가 많이 들어 전력 수요가 크게 늘어납니다.", "X": "기존 용광로에서는 석탄으로 철광석을 환원하는 과정에서 이산화탄소가 계속 나와 기후가 조금 나빠질 수 있습니다. 또 탄소 배출을 크게 줄일 새 제철 기술을 익힐 기회도 얻지 못합니다."}, "floatwind": {"O": "바닥에 기둥을 박기 어려운 깊은 바다에도 발전기를 띄워 놓으면 더 강하고 꾸준한 바람으로 전기를 만들 수 있어 전력 공급이 크게 늘고, 탄소를 내보내지 않아 기후가 나아지며 경제도 성장할 수 있습니다. 하지만 바다에 구조물을 고정하는 과정에서 해양 생물에 영향을 주어 자연환경이 조금 나빠질 수 있습니다.", "X": "지금 상태가 그대로 이어집니다. 다만 먼바다의 강한 바람으로 전력 공급을 크게 늘릴 기회는 얻지 못합니다."}, "v2g": {"O": "주차된 전기차의 배터리를 커다란 저장 장치처럼 써서 전기가 남을 때 충전하고 모자랄 때 전력망으로 보내면, 발전소를 덜 돌려도 되어 기후가 조금 나아질 수 있습니다. 전기를 효율적으로 쓰게 되고 차 주인도 남는 전기를 팔 수 있어 경제가 조금 성장할 수 있습니다.", "X": "지금 상태가 그대로 이어집니다. 다만 주차된 전기차를 저장 장치로 활용할 기회는 얻지 못합니다."}, "refugee": {"O": "집을 잃은 이웃을 받아들이면 일할 사람이 늘어 경제 성장에 조금 도움이 되고, 어려운 이웃을 도왔다는 자부심에 국민 행복도가 조금 오를 수 있습니다. 난민 정착을 돕는 과정에서 일자리 교육과 생활 지원 같은 제도가 함께 넓어져 빈부격차도 조금 줄어들 수 있습니다.", "X": "도움을 청한 이웃을 외면했다는 안타까움과 비판이 퍼져 국민 행복도가 조금 떨어질 수 있습니다. 새로 일할 사람을 맞아들일 기회도 얻지 못합니다."}, "greenbond": {"O": "재생에너지에만 쓰기로 약속한 채권은 환경을 중시하는 투자자의 돈을 끌어모을 수 있어, 그 돈으로 재생에너지 사업을 벌이면 경제 성장에 도움이 됩니다. 화석 연료 대신 재생에너지로 전기를 만드는 일이 늘어 탄소 배출이 줄고 기후가 나아질 수 있습니다.", "X": "지금 상태가 그대로 이어집니다. 재생에너지 사업에 쓸 새 돈을 모을 기회는 얻지 못합니다."}, "batteryrecycle": {"O": "폐배터리에서 리튬, 니켈, 코발트 같은 광물을 다시 뽑아 쓰면 새 공장과 일자리가 생겨 경제 성장에 도움이 됩니다. 버려진 배터리의 유해 물질이 땅과 물로 새어 나가는 일이 줄어 자연환경이 나아지고, 광물을 새로 캐고 실어 나르는 일이 줄어 기후도 조금 나아질 수 있습니다.", "X": "다 쓴 배터리가 쌓이면 그 안의 중금속과 전해질이 새어 나와 자연환경이 조금 나빠질 수 있습니다. 배터리 속 광물을 다시 쓸 기회도 얻지 못합니다."}, "aiforecast": {"O": "날씨와 전력 수요를 미리 알면 필요한 만큼만 발전기를 돌릴 수 있어 연료 낭비가 줄고 경제 성장에 조금 도움이 됩니다. 남는 전기를 만들려고 화석 연료를 태우는 일이 줄어 기후도 조금 나아질 수 있습니다.", "X": "지금 상태가 그대로 이어집니다. 발전량을 알맞게 맞춰 연료를 아낄 기회는 얻지 못합니다."}, "fourday": {"O": "쉬는 날이 늘어 가족과 보내는 시간과 여가가 많아지면 국민 행복도가 크게 오를 수 있고, 회사와 공장이 하루 덜 돌아가 전력 수요도 조금 줄어들 수 있습니다. 남는 날에 배움이나 부업에 시간을 쓸 수 있어 보통 사람 소득이 조금 오를 수 있습니다. 하지만 일하는 날이 줄어 생산량이 줄면 경제 성장은 조금 느려질 수 있습니다.", "X": "지금 상태가 그대로 이어집니다. 국민이 쉬는 시간을 늘려 삶의 만족을 높일 기회는 얻지 못합니다."}, "greenport": {"O": "배가 정박해 있는 동안 배의 엔진 대신 육지 전기를 쓰면 연료를 태우는 일이 줄어 기후가 나아지고, 깨끗한 항구로 알려져 찾아오는 배가 늘면 경제 성장에 도움이 됩니다. 하지만 배에 전기를 대 주어야 하므로 전력 수요가 조금 늘어납니다.", "X": "지금 상태가 그대로 이어집니다. 항구의 배 매연을 줄이고 깨끗한 항구로 배를 끌어올 기회는 얻지 못합니다."}, "seadc": {"O": "차가운 바닷물로 컴퓨터를 식히면 냉각에 드는 비용이 줄어 데이터센터 사업이 커지고 경제 성장에 도움이 됩니다. 하지만 수많은 컴퓨터가 밤낮없이 돌아가 전력 수요가 크게 늘고, 컴퓨터에서 나온 열이 주변 바닷물을 데워 바다 생물이 사는 자연환경이 조금 나빠질 수 있습니다.", "X": "지금 상태가 그대로 이어집니다. 데이터센터를 유치해 새 산업을 키울 기회는 얻지 못합니다."}, "aitutor": {"O": "학생마다 수준에 맞는 설명을 받으면 뒤처진 학생도 따라잡기 쉬워져 국민 행복도가 조금 오르고, 비싼 사교육을 받기 어려운 집 학생에게도 기회가 생겨 빈부격차가 조금 줄어들 수 있습니다. 잘 배운 사람이 늘면 경제 성장과 보통 사람 소득에도 조금 도움이 됩니다. 하지만 인공지능을 돌리는 컴퓨터가 늘어 전력 수요가 조금 늘어납니다.", "X": "지금 상태가 그대로 이어집니다. 모든 학생에게 수준에 맞는 공부를 도와줄 기회는 얻지 못합니다."}, "urbanforest": {"O": "나무는 그늘을 만들고 잎에서 물을 증발시켜 주변 열을 식히므로 도시의 열섬 현상이 줄고, 광합성으로 이산화탄소를 흡수해 기후가 나아질 수 있습니다. 숲에 새와 곤충이 돌아와 자연환경이 나아지고, 쉴 곳이 생겨 국민 행복도가 오르며, 찾아오는 사람이 늘어 경제 성장에도 조금 도움이 됩니다.", "X": "지금 상태가 그대로 이어집니다. 도시의 여름 더위를 식히고 쉴 곳을 만들 기회는 얻지 못합니다."}, "rail": {"O": "광산에서 캔 광석을 기차로 한꺼번에 항구까지 실어 나르면 운송비가 줄어 경제 성장에 도움이 되고, 트럭보다 연료를 적게 써 기후도 조금 나아질 수 있습니다. 하지만 철길을 놓으려고 숲을 베고 땅을 깎으면 동물의 서식지가 끊겨 자연환경이 나빠질 수 있습니다.", "X": "지금 상태가 그대로 이어집니다. 광석을 값싸게 실어 날라 돈을 벌 기회는 얻지 못합니다."}, "sugar": {"O": "넓은 땅에 사탕수수를 심어 설탕을 만들어 팔면 돈이 들어와 경제 성장에 도움이 됩니다. 하지만 숲을 베어 한 가지 작물만 심으면 생물 다양성이 줄고 땅이 메말라 자연환경이 나빠질 수 있습니다. 또 이익이 대농장 주인에게 몰리고 일꾼은 낮은 임금을 받기 쉬워 빈부격차가 조금 커질 수 있습니다.", "X": "지금 상태가 그대로 이어집니다. 설탕을 팔아 돈을 벌 기회는 얻지 못합니다."}, "dieselbus": {"O": "값싼 버스가 다니면 자가용이 없는 사람도 일터와 학교에 쉽게 갈 수 있어 국민 행복도가 오르고 빈부격차가 조금 줄어들 수 있으며, 사람과 물건의 이동이 늘어 경제 성장에도 조금 도움이 됩니다. 하지만 경유 같은 연료를 태우는 버스에서 이산화탄소가 나와 기후가 조금 나빠질 수 있습니다.", "X": "지금 상태가 그대로 이어집니다. 차가 없는 사람들이 쉽게 이동할 기회는 얻지 못합니다."}, "gold": {"O": "금을 캐면 광산 일자리와 수익이 생겨 경제 성장에 도움이 되고 보통 사람 소득도 조금 오를 수 있습니다. 하지만 금을 뽑아내는 데 쓰는 수은과 청산가리가 강과 땅으로 흘러가면 물고기와 사람에게 해로운 오염이 생겨 자연환경이 크게 나빠질 수 있습니다.", "X": "지금 상태가 그대로 이어집니다. 금을 캐서 돈과 일자리를 얻을 기회는 얻지 못합니다."}, "dam2": {"O": "논밭에 물을 꾸준히 대면 가뭄에도 농사를 지을 수 있어 수확이 늘고, 경제 성장에 도움이 되며 농민의 살림이 나아져 보통 사람 소득도 조금 오를 수 있습니다. 하지만 강물을 끌어다 쓰면 하류로 흐르는 물이 줄어 강의 생태계 같은 자연환경이 조금 나빠질 수 있습니다.", "X": "지금 상태가 그대로 이어집니다. 가뭄에도 안정적으로 농사지을 기회는 얻지 못합니다."}, "kerosene": {"O": "등유 등잔은 그을음과 연기를 내뿜는데, 태양광 램프로 바꾸면 집 안 공기가 깨끗해지고 밤에도 공부하고 일할 수 있어 국민 행복도가 오를 수 있습니다. 등유 살 돈을 아껴 가난한 집의 부담이 줄어 빈부격차가 조금 줄고 경제 성장에도 조금 도움이 되며, 등유를 태우지 않으니 이산화탄소가 줄어 기후도 조금 나아질 수 있습니다.", "X": "지금 상태가 그대로 이어집니다. 마을의 밤을 깨끗하고 밝게 바꿀 기회는 얻지 못합니다."}, "fishing": {"O": "큰 배로 먼바다에서 물고기를 많이 잡으면 수산물을 팔아 경제 성장에 도움이 되고, 어부의 벌이가 늘어 보통 사람 소득도 조금 오를 수 있습니다. 하지만 물고기가 알을 낳아 다시 늘어나는 속도보다 빨리 잡으면 바다 생물이 줄어 자연환경이 나빠질 수 있습니다.", "X": "지금 상태가 그대로 이어집니다. 먼바다의 수산 자원으로 돈을 벌 기회는 얻지 못합니다."}, "censor": {"O": "신문이 정부를 감시하는 역할을 하지 못하면 국민은 나라 일을 제대로 알 권리와 자유롭게 말할 권리를 잃게 됩니다. 그 답답함과 불만이 쌓여 국민 행복도가 조금 떨어질 수 있습니다.", "X": "언론의 자유가 지켜지면 국민이 나라 일을 알고 자유롭게 의견을 낼 수 있어 국민 행복도가 조금 오를 수 있습니다. 비판 기사는 계속 나오겠지만, 그 비판은 정부가 잘못을 고칠 기회가 되기도 합니다."}, "salt": {"O": "바닷물을 염전에 가두고 햇볕과 바람으로 물을 증발시켜 소금을 얻으면, 소금을 팔아 경제 성장에 조금 도움이 되고 바닷가 주민의 소득이 늘어 보통 사람 소득도 조금 오를 수 있습니다. 하지만 갯벌을 막아 염전을 만들면 갯벌 생물이 살 곳이 줄어 자연환경이 조금 나빠질 수 있습니다.", "X": "지금 상태가 그대로 이어집니다. 소금을 만들어 팔아 바닷가 주민이 돈을 벌 기회는 얻지 못합니다."}, "vaccine": {"O": "예방 접종을 하면 몸에 면역이 생겨 홍역 같은 감염병에 걸리는 어린이가 줄고, 아이가 아파 애태우는 가정이 줄어 국민 행복도가 오를 수 있습니다. 무료라서 가난한 집 아이도 똑같이 보호받아 빈부격차가 조금 줄고, 병원비와 일 못 하는 날이 줄어 보통 사람 소득과 경제 성장에도 조금 도움이 됩니다.", "X": "접종을 받지 못한 아이가 많으면 감염병이 퍼지기 쉬워 아이와 부모의 걱정이 커지고 국민 행복도가 조금 떨어질 수 있습니다. 전국의 어린이를 한꺼번에 감염병에서 지킬 기회도 얻지 못합니다."}, "peat": {"O": "이탄을 연료로 쓰면 발전 설비가 늘어 전력 공급에 도움이 되고 경제 성장에도 도움이 됩니다. 하지만 이탄은 오랜 세월 식물이 다 썩지 않고 쌓인 탄소 덩어리라, 캐서 태우면 갇혀 있던 탄소가 이산화탄소로 한꺼번에 나와 기후가 크게 나빠질 수 있습니다. 습지의 물을 빼고 땅을 파헤치면 습지 생물이 살 곳을 잃어 자연환경도 나빠질 수 있습니다.", "X": "지금 상태가 그대로 이어집니다. 이탄을 연료로 써서 전기와 돈을 얻을 기회는 얻지 못합니다."}, "chemplant": {"O": "큰 공장 단지가 들어서면 일자리와 생산이 늘어 경제 성장에 크게 도움이 될 수 있습니다. 하지만 공장 기계를 돌리느라 전력 수요가 늘고, 화학 물질이 섞인 폐수와 배기가스로 자연환경이 나빠지며, 오염을 걱정하는 주민이 늘어 국민 행복도가 조금 떨어질 수 있습니다.", "X": "지금 상태가 그대로 이어집니다. 큰 공장 단지로 일자리와 생산을 늘릴 기회는 얻지 못합니다."}, "ewastefix": {"O": "부품을 쉽게 구할 수 있으면 고장 난 물건을 버리지 않고 고쳐 쓰게 되어 전자 쓰레기가 줄고 자연환경이 나아질 수 있습니다. 수리점이 늘어 일자리가 생기므로 경제 성장과 보통 사람 소득에도 조금 도움이 됩니다.", "X": "지금 상태가 그대로 이어집니다. 버려지는 전자 제품을 줄이고 수리 일자리를 만들 기회는 얻지 못합니다."}, "mall": {"O": "큰 쇼핑몰이 생기면 건설과 판매 일자리가 생기고 소비가 늘어 경제 성장에 도움이 되며, 즐길 곳이 생겨 국민 행복도도 조금 오를 수 있습니다. 하지만 손님이 쇼핑몰로 몰리면 주변 작은 가게들이 장사가 어려워져 빈부격차가 조금 커질 수 있고, 냉난방과 조명에 전기를 많이 써 전력 수요가 늘어납니다.", "X": "지금 상태가 그대로 이어집니다. 쇼핑몰로 소비와 일자리를 늘릴 기회는 얻지 못합니다."}, "lithium": {"O": "리튬은 전기차와 휴대폰 배터리에 꼭 필요해 값이 비싸므로, 캐서 팔면 경제 성장에 크게 도움이 될 수 있습니다. 하지만 소금 사막의 지하수를 퍼 올려 증발시키는 방식이라 메마른 고원의 물이 더 부족해지고, 그 물에 기대 사는 동식물이 줄어 자연환경이 나빠질 수 있습니다.", "X": "지금 상태가 그대로 이어집니다. 값비싼 리튬을 팔아 돈을 벌 기회는 얻지 못합니다."}, "olympic": {"O": "대회를 열면 경기장과 도로 공사, 관광객이 쓰는 돈으로 경제 성장에 도움이 되고, 온 나라가 함께 즐기는 축제가 되어 국민 행복도가 오를 수 있습니다. 하지만 경기장과 도로를 새로 지으려고 숲과 땅을 깎으면 자연환경이 나빠질 수 있습니다.", "X": "지금 상태가 그대로 이어집니다. 국제 대회로 나라를 알리고 돈을 벌 기회는 얻지 못합니다."}, "gene": {"O": "가뭄에 잘 견디는 벼를 심으면 비가 적은 해에도 수확이 덜 줄어 경제 성장에 도움이 되고, 농민 살림이 안정되어 보통 사람 소득이 조금 오를 수 있습니다. 흉년 걱정이 줄어 국민 행복도도 조금 오를 수 있습니다.", "X": "지금 상태가 그대로 이어집니다. 가뭄이 든 해에도 수확을 지킬 기회는 얻지 못합니다."}, "smartmeter": {"O": "전기를 얼마나 쓰는지 바로 보이면 사람들이 쓸데없는 전기를 스스로 아끼게 되어 전력 수요가 줄어들 수 있습니다. 발전소에서 태우는 연료가 줄어 기후가 조금 나아지고, 전기 요금을 아껴 경제 성장에도 조금 도움이 됩니다.", "X": "지금 상태가 그대로 이어집니다. 집집마다 전기를 아끼게 할 기회는 얻지 못합니다."}, "bikeroad": {"O": "자전거로 다니는 사람이 늘면 자동차가 내뿜는 이산화탄소가 줄어 기후가 나아질 수 있습니다. 운동이 되고 교통비도 아낄 수 있어 국민 행복도가 오르고, 경제 성장에도 조금 도움이 됩니다.", "X": "지금 상태가 그대로 이어집니다. 자동차 배기가스를 줄이고 건강한 이동 수단을 늘릴 기회는 얻지 못합니다."}, "cleanstove2": {"O": "석탄 난로는 연기와 미세먼지를 뿜는데, 전기 난방으로 바꾸면 겨울 공기가 맑아져 국민 행복도가 오르고, 집집마다 석탄을 직접 태우는 일이 줄어 기후도 나아질 수 있습니다. 난방 기구를 바꾸는 일로 경제 성장에도 조금 도움이 됩니다. 하지만 겨울마다 난방에 전기를 많이 써 전력 수요가 늘어납니다.", "X": "석탄 난로의 연기와 미세먼지가 겨울마다 계속되어 국민 행복도가 조금 떨어질 수 있습니다. 겨울 공기를 맑게 할 기회도 얻지 못합니다."}, "wetland": {"O": "습지를 보호하면 철새와 물고기, 갯벌 생물이 살 곳이 지켜져 자연환경이 크게 나아질 수 있습니다. 습지의 식물과 흙은 탄소를 저장하므로 기후도 조금 나아지고, 철새가 찾아오는 아름다운 풍경이 남아 국민 행복도도 조금 오를 수 있습니다.", "X": "지금 상태가 그대로 이어집니다. 철새와 습지 생물의 보금자리를 확실히 지킬 기회는 얻지 못합니다."}, "pension": {"O": "일하기 어려운 노인에게 기초 생활비가 생기면 가장 가난한 계층의 소득이 올라 빈부격차가 줄고 보통 사람 소득도 조금 오를 수 있습니다. 노후 걱정이 줄어 국민 행복도가 오를 수 있습니다. 하지만 연금에 나랏돈을 쓰는 만큼 다른 곳에 투자할 돈이 줄어 경제 성장은 조금 느려질 수 있습니다.", "X": "일하기 어려운 노인들이 생활비 걱정을 계속 안고 살아 국민 행복도가 조금 떨어질 수 있습니다. 노인들의 생활을 안정시킬 기회도 얻지 못합니다."}, "crypto2": {"O": "가상 화폐 투자 열기로 관련 사업에 돈이 몰리면 경제 성장에 조금 도움이 될 수 있습니다. 하지만 가상 화폐는 값이 크게 오르내리고, 그 바람을 타고 이익을 보는 쪽은 주로 돈과 정보가 많은 사람이라 빈부격차가 조금 커질 수 있습니다.", "X": "지금 상태가 그대로 이어집니다. 가상 화폐 값이 오를 때 얻을 수 있는 이익은 얻지 못합니다."}, "gigschool": {"O": "수업료가 없어지면 가난한 집 학생도 돈 걱정 없이 고등학교를 다닐 수 있어 빈부격차가 줄어들 수 있습니다. 학부모의 교육비 부담이 덜어져 국민 행복도가 오르고 보통 사람 소득도 조금 늘며, 더 많이 배운 젊은이들이 일터에 나가 경제 성장에도 조금 도움이 됩니다.", "X": "지금 상태가 그대로 이어집니다. 가난한 집 학생도 돈 걱정 없이 공부할 기회는 얻지 못합니다."}, "nukeold": {"O": "원자력 발전은 전기를 만들 때 이산화탄소를 거의 내보내지 않으므로, 낡은 원전을 더 돌리면 화석 연료 발전을 덜 써 기후가 나아질 수 있습니다. 문을 닫았을 발전소가 계속 돌아가 발전 설비가 크게 늘어나는 셈이라 전력 공급에 도움이 되고 경제 성장에도 조금 도움이 됩니다. 하지만 오래된 원전의 사고 위험을 걱정하는 사람이 늘어 국민 행복도가 조금 떨어질 수 있습니다.", "X": "원전이 멈추면 그만큼의 전기를 화석 연료 발전으로 메우게 되어 이산화탄소가 늘고 기후가 조금 나빠질 수 있습니다. 전기를 만드는 비용이 늘어 경제 성장도 조금 느려질 수 있습니다."}, "carbonfarm": {"O": "땅을 갈아엎지 않으면 흙 속 유기물이 공기와 덜 만나 분해가 줄고, 덮개 작물이 광합성으로 흡수한 탄소가 흙에 쌓여 기후가 나아질 수 있습니다. 흙이 비바람에 쓸려 가지 않고 흙 속 생물이 늘어 자연환경이 나아지며, 땅심이 좋아져 보통 사람 소득과 경제 성장에도 조금 도움이 됩니다.", "X": "지금 상태가 그대로 이어집니다. 농사를 지으면서 흙 속에 탄소를 저장할 기회는 얻지 못합니다."}, "hydrogenbus": {"O": "수소 연료 전지는 수소와 산소가 반응해 전기를 만들고 물만 내보내므로, 경유 버스를 바꾸면 버스에서 나오는 배기가스가 줄어 기후가 나아질 수 있습니다. 매연이 줄어 국민 행복도가 조금 오르고, 새 버스와 충전소를 만드는 사업으로 경제 성장에도 조금 도움이 됩니다.", "X": "지금 상태가 그대로 이어집니다. 버스 매연과 탄소 배출을 줄일 기회는 얻지 못합니다."}, "ai_judge": {"O": "인공지능이 판결문 초안을 대신 쓰면 판사가 더 많은 재판을 빨리 처리할 수 있어, 재판을 오래 기다리던 사람들의 걱정이 덜어져 국민 행복도가 조금 오를 수 있습니다. 다툼이 빨리 끝나 사업과 거래가 다시 굴러가므로 경제 성장에도 조금 도움이 됩니다.", "X": "지금 상태가 그대로 이어집니다. 재판을 빠르게 처리할 기회는 얻지 못합니다."}, "aiwork": {"O": "로봇이 쉬지 않고 일하면 생산량이 늘어 경제 성장에 도움이 됩니다. 하지만 공장과 로봇을 돌리느라 전력 수요가 늘고, 기계가 대신하는 일자리가 늘어 보통 사람 소득이 조금 떨어질 수 있습니다. 이익이 공장 주인과 기술을 가진 사람에게 몰려 빈부격차도 조금 커질 수 있습니다.", "X": "지금 상태가 그대로 이어집니다. 자동화로 생산량을 늘릴 기회는 얻지 못합니다."}, "climateclass": {"O": "폭염과 홍수 때 어디로 어떻게 피해야 하는지 미리 익혀 두면 재난이 와도 덜 불안해 국민 행복도가 조금 오를 수 있습니다. 기후 위기를 몸으로 겪어 보며 관심이 커지면 에너지를 아끼는 생활로 이어져 기후에도 조금 도움이 될 수 있습니다.", "X": "지금 상태가 그대로 이어집니다. 국민이 폭염과 홍수에 미리 대비할 기회는 얻지 못합니다."}, "greenhouse": {"O": "인공지능이 온도와 물을 알맞게 맞춰 주면 날씨와 상관없이 1년 내내 작물을 길러 경제 성장에 도움이 되고, 농민 살림이 나아져 보통 사람 소득도 조금 오를 수 있습니다. 물과 비료를 필요한 만큼만 써 자연환경도 조금 나아질 수 있습니다. 하지만 온실의 조명과 냉난방, 감지기에 전기를 써 전력 수요가 늘어납니다.", "X": "지금 상태가 그대로 이어집니다. 날씨와 상관없이 작물을 길러 낼 기회는 얻지 못합니다."}, "tidalpower": {"O": "밀물과 썰물 때 바닷물이 드나드는 힘으로 발전기를 돌리면 연료를 태우지 않고 전기를 만들 수 있어 발전 설비가 크게 늘고 기후가 나아질 수 있으며, 경제 성장에도 조금 도움이 됩니다. 하지만 바다를 둑으로 막으면 바닷물 흐름이 바뀌고 갯벌이 줄어 자연환경이 나빠질 수 있습니다.", "X": "지금 상태가 그대로 이어집니다. 연료 없이 바닷물의 힘으로 전기를 얻을 기회는 얻지 못합니다."}, "ewaste3": {"O": "수명이 다한 패널에서 유리, 알루미늄, 은, 규소 같은 재료를 다시 뽑아 쓰면 새 산업이 생겨 경제 성장에 조금 도움이 됩니다. 패널을 그냥 버리지 않게 되어 납 같은 유해 물질이 새어 나가는 일이 줄고 자연환경이 나아질 수 있습니다.", "X": "버려진 패널이 쌓이면 그 안의 납 같은 중금속이 빗물에 녹아 나와 자연환경이 조금 나빠질 수 있습니다. 패널 속 재료를 다시 쓸 기회도 얻지 못합니다."}, "meatless": {"O": "소는 먹이를 소화할 때 메테인을 내뿜고 기르는 데 넓은 땅이 필요한데, 콩으로 고기를 대신하면 온실가스가 줄어 기후가 나아질 수 있습니다. 목장을 만들려고 숲을 베는 일이 줄어 자연환경이 조금 나아지고, 새 식품 산업이 커져 경제 성장에도 도움이 됩니다.", "X": "지금 상태가 그대로 이어집니다. 온실가스를 줄이면서 새 식품 산업을 키울 기회는 얻지 못합니다."}, "citizenpanel": {"O": "평범한 시민이 직접 정책을 정하면 내 목소리가 반영된다는 느낌에 국민 행복도가 오를 수 있습니다. 여러 형편의 시민이 함께 의논해 가난한 사람의 부담도 고려하게 되어 빈부격차가 조금 줄고, 시민이 스스로 정한 기후 정책은 잘 지켜져 기후도 조금 나아질 수 있습니다.", "X": "지금 상태가 그대로 이어집니다. 시민이 직접 기후 정책을 만들어 갈 기회는 얻지 못합니다."}, "spaceport": {"O": "지구는 적도에서 가장 빠르게 자전하므로 적도 근처에서 로켓을 쏘면 그 속도를 이용해 연료를 아낄 수 있어, 우주 기업이 몰려들고 경제 성장에 도움이 됩니다. 일자리가 생겨 보통 사람 소득도 조금 오를 수 있습니다. 하지만 해안에 발사장과 도로를 지으면서 바닷가 생물의 서식지가 줄어 자연환경이 나빠질 수 있습니다.", "X": "지금 상태가 그대로 이어집니다. 적도 가까운 땅의 장점을 살려 우주 산업을 키울 기회는 얻지 못합니다."}, "tariff": {"O": "관세를 올리면 외국 물건 값이 비싸져 사 오는 물건, 곧 수입이 크게 줄어듭니다. 하지만 물건값이 전반적으로 올라 보통 사람 소득과 국민 행복도가 조금 떨어지고, 수입 원료와 부품도 비싸져 우리 물건을 만드는 비용이 오르면 수출이 줄고 경제 성장이 조금 느려질 수 있습니다.", "X": "지금 상태가 그대로 이어집니다. 사 오는 외국 물건을 줄여 조국 공장을 보호할 기회는 얻지 못합니다."}, "devalue": {"O": "화폐 가치가 낮아지면 우리 물건이 외국에서 싸져 수출이 크게 늘고, 외국 물건은 비싸져 수입이 크게 줄어 경제 성장에 조금 도움이 됩니다. 하지만 수입 물가가 올라 보통 사람 소득과 국민 행복도가 조금 떨어지고, 달러로 진 빚을 갚는 데 우리 돈이 더 많이 들어 나랏빚이 늘어날 수 있습니다.", "X": "지금 상태가 그대로 이어집니다. 우리 물건 값을 낮춰 수출을 늘릴 기회는 얻지 못합니다."}, "bond": {"O": "국채를 팔아 모은 돈으로 철도와 항만을 지으면 물건을 싣고 나르기 쉬워져 수출이 늘고 경제 성장에 도움이 됩니다. 하지만 국채는 나중에 이자와 함께 갚아야 하는 돈이라 나랏빚이 크게 늘고, 공사로 땅을 깎아 자연환경이 조금 나빠질 수 있습니다.", "X": "지금 상태가 그대로 이어집니다. 철도와 항만을 한꺼번에 지어 수출 길을 넓힐 기회는 얻지 못합니다."}, "reserves": {"O": "달러를 쌓아 두면 위기 때 꺼내 쓸 수 있는 나라 자산이 늘어납니다. 하지만 그 돈을 당장 공장이나 도로에 쓰지 않으니 경제 성장은 조금 느려질 수 있습니다.", "X": "지금 상태가 그대로 이어집니다. 위기에 대비해 나라 자산을 쌓아 둘 기회는 얻지 못합니다."}, "rawexport": {"O": "원목과 광석을 그대로 팔면 가공 공장이 없어도 바로 내다 팔 수 있어 수출이 크게 늘고 경제 성장에 도움이 됩니다. 하지만 가공해서 파는 것보다 값을 덜 받아 같은 돈을 벌려면 더 많이 베고 캐야 하므로, 숲과 땅이 망가져 자연환경이 나빠질 수 있습니다.", "X": "지금 상태가 그대로 이어집니다. 원자재를 팔아 당장 수출을 늘릴 기회는 얻지 못합니다."}, "foodself": {"O": "우리 땅에서 식량을 기르면 밀가루와 쌀을 사 오는 일이 크게 줄어 수입이 줄고, 농민의 일거리가 늘어 보통 사람 소득이 조금 오를 수 있습니다. 하지만 수확이 늘기까지 몇 해 동안 식량이 모자라 국민 행복도가 조금 떨어지고, 농사 기반을 만드는 데 돈이 들어 경제 성장도 조금 느려질 수 있습니다.", "X": "지금 상태가 그대로 이어집니다. 사 오는 식량을 줄이고 스스로 먹을거리를 마련할 기회는 얻지 못합니다."}, "luxury": {"O": "고급 상점이 생기면 소비가 늘어 경제 성장에 조금 도움이 되고, 사고 싶던 물건을 살 수 있는 사람들의 국민 행복도가 조금 오를 수 있습니다. 하지만 비싼 외국 물건을 많이 사 오게 되어 수입이 크게 늘고, 이런 물건을 살 수 있는 사람은 주로 부자라 빈부격차가 커질 수 있습니다.", "X": "지금 상태가 그대로 이어집니다. 고급 상점으로 소비를 늘릴 기회는 얻지 못합니다."}, "aidloan": {"O": "낮은 이자로 빌린 돈으로 학교와 병원을 지으면 가난한 지역 사람도 교육과 치료를 받을 수 있어 국민 행복도가 오르고 빈부격차가 조금 줄어들 수 있습니다. 공사와 새 시설 덕분에 경제 성장에 조금 도움이 되고 나라 자산도 조금 늘어납니다. 하지만 빌린 돈이므로 나랏빚이 늘어납니다.", "X": "지금 상태가 그대로 이어집니다. 낮은 이자로 학교와 병원을 지을 기회는 얻지 못합니다."}, "fta": {"O": "관세가 사라지면 우리 물건이 이웃 나라에서 싸져 수출이 크게 늘고 경제 성장에 도움이 됩니다. 하지만 값싼 외국 농산물 같은 수입도 크게 늘어 경쟁에서 밀린 농민의 소득이 줄면 보통 사람 소득이 조금 떨어지고, 수출 기업과 농민의 차이가 벌어져 빈부격차가 커질 수 있습니다.", "X": "지금 상태가 그대로 이어집니다. 관세 없이 이웃 나라에 물건을 팔 기회는 얻지 못합니다."}, "exportsub": {"O": "보조금을 받은 기업은 물건값을 낮추거나 생산을 늘릴 수 있어 수출이 크게 늘고 경제 성장에 조금 도움이 됩니다. 하지만 보조금에 쓸 나랏돈을 빌려 마련하면 나랏빚이 늘고, 혜택이 수출하는 큰 기업에 몰려 빈부격차가 조금 커질 수 있습니다.", "X": "지금 상태가 그대로 이어집니다. 보조금으로 수출 기업을 키울 기회는 얻지 못합니다."}, "nationalize": {"O": "외국 기업이 가져가던 이익을 나라가 갖게 되어 나라 자산이 크게 늘고, 그 이익을 노동자에게 나누면 보통 사람 소득이 조금 오르고 빈부격차가 줄어들 수 있습니다. 하지만 외국 기업의 기술과 해외 판매망이 빠져나가 수출이 크게 줄고, 외국 투자가 끊기면 경제 성장이 느려질 수 있습니다.", "X": "지금 상태가 그대로 이어집니다. 외국 기업이 가져가던 이익을 나라 안에 남길 기회는 얻지 못합니다."}, "repay": {"O": "빚을 미리 갚으면 앞으로 낼 이자가 줄고 나랏빚이 크게 줄어듭니다. 하지만 모아 둔 돈으로 갚기 때문에 나라 자산이 줄고, 그동안 다른 곳에 쓸 돈이 빠듯해 경제 성장이 조금 느려지고 국민 행복도도 조금 떨어질 수 있습니다.", "X": "지금 상태가 그대로 이어집니다. 나랏빚과 이자 부담을 미리 줄일 기회는 얻지 못합니다."}, "oilreserve": {"O": "석유를 미리 사서 저장하면 비상시에 꺼내 쓸 수 있는 나라 자산이 늘어납니다. 하지만 당장 석유를 많이 사 와야 해서 수입이 늘고, 기지를 짓고 기름을 사는 데 돈이 묶여 경제 성장은 조금 느려질 수 있습니다.", "X": "지금 상태가 그대로 이어집니다. 유가가 오를 때를 대비해 석유를 쌓아 둘 기회는 얻지 못합니다."}, "chipimport": {"O": "최신 장비로 반도체를 만들면 품질 좋은 제품을 외국에 팔 수 있어 수출이 크게 늘고, 경제 성장과 보통 사람 소득에도 조금 도움이 됩니다. 하지만 비싼 장비를 사 오느라 수입이 크게 늘고, 장비값을 치르는 만큼 나라 자산이 줄어듭니다.", "X": "지금 상태가 그대로 이어집니다. 최신 장비로 반도체 수출을 키울 기회는 얻지 못합니다."}, "remit": {"O": "수수료가 없어지면 외국에서 일하는 사람들이 보내는 돈이 고스란히 가족에게 가서 보통 사람 소득이 조금 오르고, 주로 형편이 어려운 가정이 혜택을 받아 빈부격차가 조금 줄어들 수 있습니다. 외국 돈이 나라 안으로 더 들어와 나라 자산이 늘고 경제 성장에도 조금 도움이 됩니다.", "X": "지금 상태가 그대로 이어집니다. 해외에서 일하는 인민의 돈을 더 많이 집으로 들여올 기회는 얻지 못합니다."}, "coalimp2": {"O": "석탄을 오래 싸게 살 수 있으면 석탄 발전을 늘려 발전 설비가 크게 늘고 전력 공급에 도움이 되며, 값싼 전기로 경제 성장에도 조금 도움이 됩니다. 하지만 20년 동안 석탄을 사 와야 해서 수입이 크게 늘고, 석탄을 태울 때 이산화탄소가 많이 나와 기후가 나빠질 수 있습니다.", "X": "지금 상태가 그대로 이어집니다. 값싼 석탄으로 전기를 늘릴 기회는 얻지 못합니다."}, "greenexport": {"O": "세계 여러 나라가 탄소를 줄이려고 재생에너지 설비를 많이 찾으므로, 태양광 패널과 풍력 날개를 만들어 팔면 수출이 크게 늘고 경제 성장에 도움이 됩니다. 이 설비가 쓰이는 만큼 화석 연료 발전이 줄어 기후가 나아질 수 있습니다. 하지만 원료와 부품 일부를 사 와야 해서 수입도 늘어납니다.", "X": "지금 상태가 그대로 이어집니다. 재생에너지 부품을 새 수출 산업으로 키울 기회는 얻지 못합니다."}, "carbonborder": {"O": "공장을 저탄소로 바꾸면 이산화탄소 배출이 줄어 기후가 나아지고, 유럽의 탄소 세금을 덜 내게 되어 우리 물건의 수출이 크게 늘 수 있습니다. 하지만 공장 설비를 바꾸는 데 큰돈이 들어 나랏빚이 늘고, 바꾸는 동안 생산이 줄어 경제 성장이 조금 느려질 수 있습니다.", "X": "탄소를 많이 내보내는 공장이 그대로라 유럽으로 파는 물건에 탄소 세금이 붙고, 값이 비싸진 우리 물건이 덜 팔려 수출이 크게 줄어들 수 있습니다. 공장을 깨끗하게 바꿀 기회도 얻지 못합니다."}, "sovfund": {"O": "쓰지 않고 쌓아 둔 돈을 해외 주식과 사업에 투자하면 이익이 붙어 나라 자산이 늘 수 있습니다. 투자 이익을 나라 안에서 쓰면 경제 성장에도 조금 도움이 됩니다.", "X": "지금 상태가 그대로 이어집니다. 쌓인 돈을 굴려 나라 자산을 불릴 기회는 얻지 못합니다."}, "austerity": {"O": "공무원 월급과 복지 예산을 깎으면 나라가 쓰는 돈이 줄어 나랏빚이 크게 줄어듭니다. 하지만 사람들이 받는 돈이 줄어 보통 사람 소득이 조금 떨어지고 생활이 어려워져 국민 행복도가 떨어지며, 쓰는 돈이 줄면 가게와 공장 매출도 줄어 경제 성장이 느려질 수 있습니다.", "X": "지금 상태가 그대로 이어집니다. 나라 살림을 줄여 나랏빚을 갚을 기회는 얻지 못합니다."}, "tourism2": {"O": "관광객이 숙박과 음식, 기념품에 쓰는 외국 돈은 물건을 판 것과 같아 수출이 크게 늘고 나라 자산이 조금 늘며, 경제 성장에도 조금 도움이 됩니다. 외국 사람과 교류하고 우리 문화를 자랑할 기회가 생겨 국민 행복도도 조금 오를 수 있습니다.", "X": "지금 상태가 그대로 이어집니다. 관광객이 쓰는 외화를 벌어들일 기회는 얻지 못합니다."}, "ifcloan": {"O": "대출받은 돈이 들어오면 당장 쓸 수 있는 나라 자산이 늘고, 그 돈을 쓰면 경제 성장에 조금 도움이 됩니다. 하지만 이자가 높은 빌린 돈이라 나랏빚이 크게 늘어납니다.", "X": "지금 상태가 그대로 이어집니다. 당장 쓸 돈을 빠르게 마련할 기회는 얻지 못합니다."}, "smuggle": {"O": "밀수품을 막으면 몰래 들어오던 외국 물건이 줄어 수입이 줄고, 새던 세금을 거둬 나라 자산이 조금 늘어날 수 있습니다. 하지만 싸게 팔리던 밀수품이 사라져 물건값이 오르면 국민 행복도가 조금 떨어지고, 국경 장사가 위축되어 경제 성장도 조금 느려질 수 있습니다.", "X": "지금 상태가 그대로 이어집니다. 새는 세금을 막을 기회는 얻지 못합니다."}, "incometax": {"O": "돈을 많이 버는 사람에게 세금을 더 걷으면 세율이 조금 오르고, 그 돈을 어려운 사람을 돕는 데 쓸 수 있어 빈부격차가 줄어들 수 있습니다. 세금이 공평하게 걷힌다는 느낌에 국민 행복도도 조금 오를 수 있습니다. 하지만 부자들의 투자 의욕이 줄면 경제 성장이 조금 느려질 수 있습니다.", "X": "지금 상태가 그대로 이어집니다. 많이 버는 사람에게서 세금을 더 걷어 빈부격차를 줄일 기회는 얻지 못합니다."}, "vat": {"O": "물건을 살 때마다 세금이 붙어 세율이 오르고, 나라가 세금을 넓고 고르게 걷을 수 있습니다. 하지만 물건값이 올라 보통 사람 소득과 국민 행복도가 조금 떨어지고, 소비가 줄어 경제 성장이 조금 느려질 수 있습니다. 가난한 사람일수록 번 돈 가운데 물건 사는 데 쓰는 비율이 높아 부담이 상대적으로 커서 빈부격차도 조금 커질 수 있습니다.", "X": "지금 상태가 그대로 이어집니다. 나라가 세금을 넓고 고르게 더 걷을 기회는 얻지 못합니다."}, "evasion": {"O": "빼돌린 세금을 찾아내면 실제로 걷히는 세금이 늘어 세율이 조금 오르는 효과가 있고, 부자와 기업이 내야 할 몫을 내게 되어 빈부격차가 줄어들 수 있습니다. 세금이 공정하게 걷힌다는 믿음에 국민 행복도가 조금 오를 수 있습니다. 하지만 기업이 단속을 부담스러워해 투자를 줄이면 경제 성장이 조금 느려질 수 있습니다.", "X": "지금 상태가 그대로 이어집니다. 빠져나가던 세금을 되찾을 기회는 얻지 못합니다."}, "taxholiday": {"O": "세금이 면제되면 외국 기업이 공장을 지으러 들어와 수출이 크게 늘고 경제 성장에 도움이 되며, 일자리가 생겨 보통 사람 소득도 조금 오를 수 있습니다. 하지만 그 기업에게서 세금을 걷지 못해 세율은 조금 낮아지는 효과가 생깁니다.", "X": "지금 상태가 그대로 이어집니다. 외국 기업의 공장을 끌어와 수출을 늘릴 기회는 얻지 못합니다."}, "luxurytax": {"O": "고급 승용차와 명품에 무거운 세금을 매기면 세율이 조금 오르고, 비싸진 사치품을 덜 사 와 수입이 줄어듭니다. 사치품을 사는 부자에게 세금을 더 걷는 셈이라 빈부격차도 조금 줄어들 수 있습니다.", "X": "지금 상태가 그대로 이어집니다. 사치품 수입을 줄이고 부자에게서 세금을 더 걷을 기회는 얻지 못합니다."}, "fueltax": {"O": "기름값이 오르면 사람들이 차를 덜 타고 기름을 아껴 석유 수입이 줄고, 이산화탄소 배출이 줄어 기후가 나아질 수 있으며 세율도 조금 오릅니다. 하지만 교통비와 물건 운송비가 올라 국민 행복도가 조금 떨어지고 경제 성장도 조금 느려질 수 있습니다.", "X": "지금 상태가 그대로 이어집니다. 기름 소비와 석유 수입을 줄일 기회는 얻지 못합니다."}, "landtax": {"O": "쓰지 않는 땅에 세금을 매기면 땅을 묵혀 두며 값이 오르기만 기다리던 사람이 땅을 팔거나 쓰게 되어 빈부격차가 줄어들 수 있습니다. 땅값이 안정되면 보통 사람이 집과 가게를 구하기 쉬워져 보통 사람 소득이 조금 오르고, 세율도 조금 오릅니다. 하지만 땅을 사고팔던 돈의 흐름이 줄어 경제 성장은 조금 느려질 수 있습니다.", "X": "지금 상태가 그대로 이어집니다. 놀고 있는 땅을 쓰이게 하고 빈부격차를 줄일 기회는 얻지 못합니다."}, "welfare": {"O": "병원비를 나라가 대 주면 돈이 없어 치료를 미루던 사람도 병원에 갈 수 있어 국민 행복도가 크게 오르고 빈부격차가 줄어들 수 있습니다. 병원비로 나가던 돈을 아껴 보통 사람 소득도 조금 늘어납니다. 하지만 의료비를 나라가 부담하는 만큼 나라 자산이 줄어듭니다.", "X": "지금 상태가 그대로 이어집니다. 돈 걱정 없이 치료받는 나라를 만들 기회는 얻지 못합니다."}, "carbontax2": {"O": "탄소를 많이 내보내는 연료에 세금을 매기면 사람과 기업이 연료를 아껴 기후가 나아지고, 세율도 조금 오릅니다. 걷은 세금으로 가난한 가정의 전기요금을 돕기 때문에 빈부격차가 줄고 국민 행복도가 조금 오를 수 있습니다. 하지만 연료값이 올라 기업의 생산 비용이 늘면 경제 성장은 조금 느려질 수 있습니다.", "X": "지금 상태가 그대로 이어집니다. 탄소를 줄이면서 가난한 가정을 도울 기회는 얻지 못합니다."}, "statuetax": {"O": "동상을 세우려고 세금을 더 걷으면 세율이 조금 오르지만, 동상은 생활에 보탬이 되지 않아 사람들 손에 남는 돈만 줄어 보통 사람 소득이 조금 떨어질 수 있습니다. 내 세금이 지도자를 꾸미는 데 쓰인다는 불만이 커져 국민 행복도가 떨어지고, 동상을 세우는 비용으로 나라 자산도 조금 줄어듭니다.", "X": "쓸모없는 세금을 내지 않게 되어 국민이 안도하고 국민 행복도가 조금 오를 수 있습니다. 그 돈은 국민 생활에 그대로 남습니다."}, "rareearth": {"O": "희토류는 풍력 발전기와 전기차에 꼭 필요한 재료라, 정련해서 팔면 수출이 크게 늘고 경제 성장에 도움이 됩니다. 하지만 정련 과정에서 나오는 방사성 물질과 산성 폐수가 땅과 물을 오염시켜 자연환경이 나빠지고, 주민의 건강 걱정에 국민 행복도가 조금 떨어질 수 있습니다.", "X": "희토류를 직접 만들지 않으니 필요한 희토류와 자석을 외국에서 사 와야 해서 수입이 늘어날 수 있습니다. 희토류를 정련해 팔 기회도 얻지 못합니다."}, "cobalt": {"O": "코발트를 싸게 사 오면 배터리를 값싸게 만들어 팔 수 있어 수출이 늘고 경제 성장에 도움이 됩니다. 하지만 코발트를 사 오는 만큼 수입이 늘고, 어린이 노동으로 캔 광물을 쓴다는 사실에 마음이 불편한 사람이 생겨 국민 행복도가 조금 떨어질 수 있습니다. 값싼 원료로 얻은 이익이 배터리 기업에 몰려 빈부격차도 조금 커질 수 있습니다.", "X": "다른 곳에서 코발트를 구하려면 값이 더 비싸, 같은 양을 사 오는 데 돈이 더 들어 수입 부담이 조금 늘어날 수 있습니다. 원료값이 올라 배터리 생산 비용이 커지면 경제 성장도 조금 느려질 수 있습니다."}, "pvwaste": {"O": "재활용을 의무로 하면 패널 속 납 같은 유해 물질이 땅에 묻히지 않고 은과 규소 같은 재료를 다시 쓰게 되어 자연환경이 나아질 수 있습니다. 하지만 재활용 공장을 짓는 데 나랏돈이 들어 나라 자산이 조금 줄고, 기업 부담이 늘어 경제 성장도 조금 느려질 수 있습니다.", "X": "수명이 다한 패널이 그대로 버려지면 그 안의 납 같은 중금속이 빗물에 녹아 흙과 지하수를 오염시켜 자연환경이 나빠질 수 있습니다. 패널 속 재료를 다시 쓸 기회도 얻지 못합니다."}, "windbird": {"O": "바람이 센 곳에 풍력 단지를 지으면 연료 없이 많은 전기를 만들 수 있어 발전 설비가 크게 늘고, 화석 연료 발전을 대신해 기후가 나아지며 경제 성장에도 도움이 됩니다. 하지만 철새가 지나는 길목에서 커다란 날개가 돌면 새가 부딪히거나 먼 길을 돌아가야 해서 자연환경이 크게 나빠질 수 있습니다.", "X": "지금 상태가 그대로 이어집니다. 바람이 가장 센 해안에서 전기를 많이 얻을 기회는 얻지 못합니다."}, "aiwater": {"O": "냉각수 사용을 줄이면 마을 우물과 지하수가 덜 말라 식수 걱정이 줄어 국민 행복도가 오르고, 땅과 강의 물이 지켜져 자연환경이 나아질 수 있습니다. 하지만 데이터센터가 컴퓨터를 충분히 식히지 못해 일을 줄이면 경제 성장이 조금 느려질 수 있습니다.", "X": "데이터센터가 물을 계속 넉넉히 쓰며 돌아가 경제 성장에 조금 도움이 됩니다. 하지만 마을 우물과 지하수가 더 말라 식수가 부족해지면 국민 행복도가 떨어지고, 주변 땅과 생물이 물을 잃어 자연환경도 나빠질 수 있습니다."}, "aipriority": {"O": "정전 때 병원과 가정에 전기가 먼저 가면 생명과 생활이 지켜져 국민 행복도가 오르고, 형편이 어려운 사람도 똑같이 보호받아 빈부격차가 조금 줄어들 수 있습니다. 하지만 비싼 요금을 내는 데이터센터가 뒤로 밀려 경제 성장은 조금 줄어들 수 있습니다.", "X": "전기를 그때그때 나누면 돈을 많이 내는 데이터센터에 먼저 가기 쉬워 경제 성장에 조금 도움이 될 수 있습니다. 하지만 정전 때 병원과 가정이 뒤로 밀릴 수 있다는 불안 때문에 국민 행복도가 조금 떨어질 수 있습니다."}, "nukeai": {"O": "원자력 발전소 한 곳의 전기를 외국 기업에 오래 팔면 안정적으로 돈이 들어와 수출이 크게 늘고 나라 자산도 늘어나 경제 성장에 도움이 됩니다. 그 전기는 외국 기업이 직접 가져가므로 우리 전력망이 떠맡을 전력 수요는 조금 줄어들 수 있습니다. 하지만 원자력 발전소의 전기를 가정에서 쓸 수 없게 되어 보통 사람 소득은 조금 줄어들 수 있습니다.", "X": "지금 상태가 그대로 이어집니다. 다만 발전소 전기를 팔아 벌 수 있었던 큰돈은 얻지 못합니다."}, "grayh2": {"O": "회색 수소라고 정직하게 표시하면 청정 수소보다 값은 낮지만 수소를 꾸준히 팔 수 있어 수출이 늘고 경제 성장에 조금 도움이 됩니다. 거짓 표시 없이 거래하므로 사는 나라와 믿음을 쌓을 수 있습니다.", "X": "지금 상태가 그대로 이어집니다. 다만 수소를 팔아 수출을 늘릴 기회는 얻지 못합니다."}, "egsquake": {"O": "땅속 뜨거운 암석의 열로 증기를 만들어 발전하면 연료를 태우지 않아 탄소 배출이 적으므로 기후에 도움이 되고, 새 발전 설비가 생겨 전력 공급이 늘어날 수 있습니다. 발전소를 짓고 돌리면서 경제 성장에도 조금 도움이 됩니다. 지진을 감시하며 천천히 가동하므로 위험한 신호를 미리 살필 수 있습니다.", "X": "지금 상태가 그대로 이어집니다. 다만 탄소 배출이 적은 새 발전 설비로 전력 공급을 늘릴 기회는 얻지 못합니다."}, "pylon": {"O": "송전탑이 마을을 피해 돌아가면 주민들의 삶터가 지켜져 국민 행복도가 조금 오를 수 있습니다. 하지만 길이 길어져 공사비가 늘어나므로 나랏빚이 조금 늘고 경제 성장은 조금 줄어들 수 있으며, 더 많은 산림을 지나야 해서 자연환경도 조금 나빠질 수 있습니다.", "X": "송전탑 건설이 미뤄져 지금 상태가 그대로 이어집니다. 다만 남쪽 원자력 발전소의 전기를 수도로 보낼 길은 아직 얻지 못합니다."}, "biofuelfood": {"O": "옥수수로 연료를 만들면 석유를 덜 사 와도 되므로 수입이 줄고, 새 에너지 설비가 생겨 전력 공급에 도움이 되며 경제 성장에도 조금 도움이 됩니다. 바이오 연료도 태울 때 이산화탄소가 나오지만 옥수수가 자라면서 이산화탄소를 흡수하므로 석유보다 기후에 조금 도움이 될 수 있습니다. 하지만 식량으로 쓸 옥수수가 줄어 곡물값이 오르므로 보통 사람 소득은 조금 줄어들 수 있습니다.", "X": "지금 상태가 그대로 이어집니다. 다만 석유 수입을 줄일 기회는 얻지 못합니다."}, "fakeoffset": {"O": "실제 숲 면적대로 상쇄권을 팔면 숲을 지키는 일 자체가 돈이 되므로 숲을 보호할 이유가 생겨 자연환경이 조금 나아질 수 있습니다. 판매 수익으로 나라 자산이 조금 늘고 경제 성장에도 조금 도움이 됩니다.", "X": "지금 상태가 그대로 이어집니다. 다만 숲을 지키면서 돈을 벌 기회는 얻지 못합니다."}, "cloudseed": {"O": "구름 속에 뿌린 요오드화은 알갱이는 얼음 결정이 생기는 씨앗 역할을 해, 얼음 결정이 자라 비로 떨어지기 쉬워지므로 가뭄 지역에 비가 조금 늘어날 수 있습니다. 그러면 농사와 자연환경이 조금 나아지고 국민 행복도와 경제 성장에도 조금 도움이 됩니다.", "X": "지금 상태가 그대로 이어집니다. 다만 가뭄을 덜어 줄 새로운 방법은 얻지 못합니다."}, "aicoalrestart": {"O": "닫았던 석탄 발전소를 다시 돌리면 발전 설비가 크게 늘어 전력 공급이 크게 늘고, 데이터센터가 계속 커질 수 있어 경제 성장에 도움이 됩니다. 하지만 석탄을 태우면 이산화탄소가 나와 기후가 나빠질 수 있습니다.", "X": "석탄 발전소를 다시 돌리지 않으면 전기가 모자라 데이터센터를 늘리는 속도를 늦춰야 하므로 전력 수요가 줄어들 수 있습니다. 하지만 데이터센터 사업이 늦어져 경제 성장은 조금 줄어들 수 있습니다."}, "seadump": {"O": "폐수를 제대로 처리하지 않고 바다에 버리면 처리 비용을 아껴 경제 성장이 크게 늘고 나라 자산도 늘어날 수 있습니다. 하지만 방사성 물질과 유해 물질이 바다 생물의 몸에 쌓이고 먹이 사슬을 따라 퍼져 자연환경이 크게 나빠질 수 있습니다.", "X": "폐수를 제대로 처리하려면 비싼 처리 비용이 들어 경제 성장이 조금 줄고 나라 자산도 조금 줄어들 수 있습니다. 이것은 바다를 오염시키지 않는 대신 치르는 비용입니다."}, "cfc": {"O": "값싼 프레온 가스를 만들어 팔면 수출이 크게 늘고 경제 성장에 도움이 됩니다. 하지만 프레온 가스는 성층권의 오존층을 파괴할 뿐 아니라 이산화탄소보다 열을 훨씬 잘 가두는 온실 기체여서 기후가 크게 나빠질 수 있습니다.", "X": "지금 상태가 그대로 이어집니다. 다만 금지된 물질을 팔아 벌 수 있었던 돈은 얻지 못합니다."}, "borderlog": {"O": "남의 나라 열대림 나무를 베어 팔면 목재 수출이 크게 늘고 경제 성장에 도움이 됩니다. 하지만 열대림이 사라지면 그곳에 사는 많은 생물의 서식지가 없어져 자연환경이 크게 나빠지고, 이산화탄소를 흡수하던 숲이 줄어 기후도 나빠질 수 있습니다.", "X": "지금 상태가 그대로 이어집니다. 다만 목재를 팔아 수출을 늘릴 기회는 얻지 못합니다."}, "sanctionbust": {"O": "제재를 받는 나라는 석유를 구하기 어려워 비싼 값이라도 사려 하므로, 시세의 두 배를 받고 팔면 수출이 크게 늘 수 있습니다. 들어온 돈으로 나라 자산이 늘고 경제 성장도 크게 늘어날 수 있습니다.", "X": "지금 상태가 그대로 이어집니다. 다만 석유를 비싸게 팔아 벌 수 있었던 큰돈은 얻지 못합니다."}, "eezfish": {"O": "이웃 나라 바다에서 물고기를 더 잡으면 수산물 수출이 늘고 어민 소득이 올라 보통 사람 소득이 조금 늘며 경제 성장에도 도움이 됩니다. 하지만 물고기를 지나치게 잡으면 바다의 물고기 수가 회복되지 못해 자연환경이 나빠질 수 있습니다.", "X": "우리 바다에서만 조업하면 이미 줄어든 물고기로 버텨야 하므로 어민 소득이 줄어 보통 사람 소득이 조금 줄어들 수 있습니다. 그 밖에는 지금 상태가 그대로 이어집니다."}, "riverdivert": {"O": "상류에 댐을 쌓아 물을 우리 들판으로 돌리면 농사가 늘어 보통 사람 소득이 조금 늘고 경제 성장에도 도움이 되며, 댐에 모인 물로 수력 발전을 해 전력 공급이 크게 늘어날 수 있습니다. 하지만 강물의 흐름이 막히고 하류로 가는 물이 줄어 강과 주변 생태계가 망가지므로 자연환경이 나빠질 수 있습니다.", "X": "지금 상태가 그대로 이어집니다. 다만 농사를 늘리고 수력 발전으로 전기를 얻을 기회는 아직 얻지 못합니다."}, "basel": {"O": "유해 폐기물을 받아 주는 대가로 돈을 받으면 나라 자산이 늘고 경제 성장에 도움이 됩니다. 하지만 중금속 같은 유해 물질이 흙과 지하수로 스며들어 자연환경이 크게 나빠지고, 주민 건강이 걱정되어 국민 행복도도 조금 떨어질 수 있습니다.", "X": "지금 상태가 그대로 이어집니다. 다만 폐기물을 받아 주고 얻을 수 있었던 돈은 얻지 못합니다."}, "emissionfraud": {"O": "배출량을 정직하게 보고하면 탄소국경세를 내야 해서 수출품값이 올라 수출이 줄고 경제 성장도 조금 줄어들 수 있습니다. 하지만 실제 배출량을 정확히 알아야 줄이는 대책을 세울 수 있으므로 기후에는 조금 도움이 됩니다.", "X": "보고가 미뤄져 지금 상태가 그대로 이어집니다. 다만 정확한 배출량을 바탕으로 온실가스를 줄일 대책을 세울 기회는 얻지 못합니다."}, "childmine": {"O": "어린이 노동을 단속하면 아이들이 위험한 일 대신 학교에 다닐 수 있어 국민 행복도가 오르고, 가난한 집 아이도 배울 기회를 얻어 빈부격차가 조금 줄어들 수 있습니다. 하지만 광산이 어른 일꾼에게 더 높은 임금을 줘야 해서 경제 성장은 조금 줄어들 수 있습니다.", "X": "값싼 어린이 노동을 그대로 쓰면 광산의 인건비가 줄어 경제 성장에 조금 도움이 될 수 있습니다. 하지만 아이들이 위험한 일을 하며 학교에 가지 못해 국민 행복도가 떨어질 수 있습니다."}, "spybattery": {"O": "외국의 핵심 설계 자료를 그대로 얻으면 오랜 연구 없이 배터리 성능을 끌어올릴 수 있어 수출이 크게 늘고 경제 성장에 도움이 됩니다. 배터리 공장 일자리가 늘어 보통 사람 소득도 조금 늘어날 수 있습니다.", "X": "지금 상태가 그대로 이어집니다. 다만 배터리 기술을 한꺼번에 끌어올릴 기회는 얻지 못합니다."}, "spychip": {"O": "다른 회사가 오랜 시간 들여 만든 반도체 설계도를 얻으면 개발 비용과 시간을 아껴 곧바로 같은 반도체를 만들 수 있으므로 수출이 크게 늘고 경제 성장도 크게 늘어날 수 있습니다.", "X": "지금 상태가 그대로 이어집니다. 다만 반도체 기술을 단숨에 얻을 기회는 얻지 못합니다."}, "spyai": {"O": "많은 돈과 전기를 들여 학습시킨 인공지능 모델을 그대로 가져오면 학습 비용 없이 바로 인공지능 서비스를 열 수 있어 수출이 크게 늘고 경제 성장에 도움이 됩니다.", "X": "지금 상태가 그대로 이어집니다. 다만 인공지능 기술을 단숨에 얻을 기회는 얻지 못합니다."}, "spysolar": {"O": "특허료 없이 고효율 태양 전지를 만들면 값싸게 팔 수 있어 수출이 크게 늘고 경제 성장에 도움이 됩니다. 또 태양광 발전 설비가 크게 늘어 전력 공급이 늘고, 화석 연료를 덜 태우게 되어 기후에도 조금 도움이 됩니다.", "X": "지금 상태가 그대로 이어집니다. 다만 태양 전지를 값싸게 만들어 팔 기회는 얻지 못합니다."}, "counterspy": {"O": "법원 영장을 받아 의심되는 사람만 수사하면 다른 기술자들의 사생활은 지키면서 기술이 새는 것을 막을 수 있어 경제 성장과 국민 행복도에 조금 도움이 됩니다.", "X": "수사하지 않으면 기술이 새는 것을 막을 방법이 없어 우리 제품이 경쟁력을 잃고 수출이 줄어들 수 있습니다. 그 결과 경제 성장도 조금 줄어들 수 있습니다."}, "spysell": {"O": "허가 절차를 거쳐 꼭 지켜야 할 핵심 기술은 남기고 일부만 팔면 기술료가 들어와 수출이 늘고 나라 자산과 경제 성장에도 조금 도움이 됩니다.", "X": "지금 상태가 그대로 이어집니다. 다만 기술을 팔아 벌 수 있었던 돈은 얻지 못합니다."}, "elninoprep": {"O": "엘니뇨가 오면 지역에 따라 가뭄이나 폭우가 생길 수 있으므로, 저수지를 미리 채우고 가뭄에 강한 볍씨를 나눠 주면 농사 피해에 대비할 수 있어 국민 행복도가 조금 오르고 저수지 물이 주변 생태계를 도와 자연환경도 조금 나아질 수 있습니다. 하지만 준비에 돈이 들어 나라 자산이 조금 줄고 경제 성장도 조금 줄어들 수 있습니다.", "X": "따로 준비하지 않아 지금 상태가 그대로 이어집니다. 다만 엘니뇨로 날씨가 바뀔 때를 미리 대비할 기회는 얻지 못합니다."}, "dust": {"O": "공장 가동을 줄이면 연료를 덜 태워 미세먼지와 이산화탄소가 함께 줄어 국민 행복도가 오르고 기후에도 조금 도움이 됩니다. 공장이 쓰던 전기가 줄어 전력 수요도 줄어들 수 있습니다. 하지만 생산이 줄어 경제 성장은 조금 줄어들 수 있습니다.", "X": "공장을 그대로 돌리면 미세먼지가 계속 나와 사람들이 숨쉬기 힘들어지므로 국민 행복도가 크게 떨어질 수 있습니다. 먼지와 오염 물질이 땅과 물에도 내려앉아 자연환경이 조금 나빠질 수 있습니다."}, "water": {"O": "농업용수를 데이터센터 냉각에 쓰면 데이터센터가 멈추지 않아 경제 성장에 도움이 됩니다. 하지만 논밭과 하천에 갈 물이 줄어 자연환경이 크게 나빠지고, 농민들의 수확이 줄어 보통 사람 소득이 조금 줄며 빈부격차가 커지고 국민 행복도도 떨어질 수 있습니다.", "X": "농업용수를 지키면 냉각수가 모자란 데이터센터가 가동을 줄여야 하므로 경제 성장이 줄어들 수 있습니다. 그 대신 농사에 쓸 물은 그대로 남습니다."}, "fish": {"O": "어장을 잃은 어민들에게 보상금을 주면 어민 가정이 버틸 수 있어 보통 사람 소득이 조금 늘고 빈부격차가 조금 줄며 국민 행복도도 조금 오를 수 있습니다. 하지만 보상에 돈이 들어 경제 성장은 조금 줄어들 수 있습니다.", "X": "보상하지 않으면 어장을 잃은 어민들의 생계가 어려워져 빈부격차가 조금 커지고 국민 행복도가 떨어질 수 있습니다."}, "landslide": {"O": "산비탈에 나무를 다시 심으면 뿌리가 흙을 붙잡고 빗물이 천천히 스며들어 산사태 위험이 줄고 자연환경이 나아질 수 있습니다. 주민들이 안심하게 되어 국민 행복도가 조금 오르지만, 공사비가 들어 경제 성장은 조금 줄어들 수 있습니다.", "X": "산림을 복원하지 않으면 흙을 붙잡아 줄 뿌리가 없어 비가 올 때마다 흙이 쓸려 내려가므로 자연환경이 나빠질 수 있습니다. 산사태 걱정이 이어져 국민 행복도도 떨어질 수 있습니다."}, "flood": {"O": "방류 경보와 제방을 보강하면 댐에서 물을 내보낼 때 주민들이 미리 피하고 물이 넘치는 것을 막을 수 있어 국민 행복도가 오를 수 있습니다. 하지만 공사비가 들어 경제 성장은 조금 줄어들 수 있습니다.", "X": "보강하지 않으면 다음 홍수에도 하류 마을이 피해를 입을 수 있어 국민 행복도가 크게 떨어질 수 있습니다. 피해를 복구할 여유가 없는 가난한 가정이 더 큰 어려움을 겪어 빈부격차도 조금 커질 수 있습니다."}, "minewater": {"O": "정화 시설로 폐수 속 중금속과 산성 물질을 걸러 내면 강물이 깨끗해져 물고기가 돌아오므로 자연환경이 나아질 수 있습니다. 주민들이 안심하고 물을 쓸 수 있어 국민 행복도가 조금 오르지만, 시설을 짓는 비용 때문에 경제 성장은 조금 줄어들 수 있습니다.", "X": "정화 시설이 없으면 광산 폐수가 계속 강으로 흘러들어 물속 생물이 살기 어려워지므로 자연환경이 크게 나빠질 수 있습니다. 오염된 물을 걱정하는 주민이 늘어 국민 행복도도 떨어질 수 있습니다."}, "hospital": {"O": "병원마다 비상 발전기가 있으면 정전이 나도 수술과 치료 장비를 계속 돌릴 수 있어 국민 행복도가 오를 수 있습니다. 하지만 발전기 설치 비용이 들어 경제 성장은 조금 줄어들 수 있습니다.", "X": "지원하지 않으면 정전 때마다 병원 치료가 멈출 수 있다는 불안이 커져 국민 행복도가 떨어질 수 있습니다."}, "cryptobill": {"O": "전기를 많이 쓰는 채굴장에 전기 공급을 줄이면 전력 수요가 크게 줄어 동네 전기요금 부담이 가벼워지므로 국민 행복도가 오를 수 있습니다. 하지만 채굴장 사업이 줄어 경제 성장은 조금 줄어들 수 있습니다.", "X": "그대로 두면 채굴장이 전기를 계속 많이 써 동네 전기요금이 높게 유지되므로 국민 행복도가 떨어질 수 있습니다. 전기요금 부담은 가난한 집에 더 무겁게 느껴져 빈부격차도 조금 커질 수 있습니다."}, "ewastekids": {"O": "처리장을 멈추면 중금속이 더 이상 공기와 흙으로 퍼지지 않아 자연환경이 나아지고, 아이들 건강을 지킬 수 있어 국민 행복도가 오를 수 있습니다. 하지만 처리장 가동이 멈춰 경제 성장은 조금 줄어들 수 있습니다.", "X": "처리장을 계속 돌리면 아이들이 중금속에 계속 노출되어 건강이 위협받으므로 국민 행복도가 크게 떨어질 수 있습니다."}, "villageschool": {"O": "전기가 들어온 마을에서 원격 수업을 받으면 산골 아이들도 도시 아이들처럼 배울 수 있어 빈부격차가 줄고 국민 행복도가 오를 수 있습니다. 배운 사람이 늘면 더 좋은 일자리를 얻어 보통 사람 소득이 늘고 경제 성장에도 조금 도움이 됩니다. 컴퓨터와 통신 장비를 쓰므로 전력 수요는 조금 늘어날 수 있습니다.", "X": "지금 상태가 그대로 이어집니다. 다만 산골 아이들이 더 배울 기회는 얻지 못합니다."}, "asthma": {"O": "무료 진료소와 공기 정화 학교가 생기면 돈이 없어 병원에 못 가던 사람도 치료받을 수 있어 국민 행복도가 오르고 빈부격차가 조금 줄어들 수 있습니다. 하지만 시설을 짓고 운영하는 비용이 들어 경제 성장은 조금 줄어들 수 있습니다.", "X": "지원하지 않으면 치료비를 감당하기 어려운 가난한 사람들이 더 오래 아프게 되어 빈부격차가 커지고 국민 행복도가 크게 떨어질 수 있습니다."}, "protest": {"O": "석탄 발전소를 줄이면 미세먼지와 이산화탄소가 줄어 국민 행복도가 크게 오르고 기후도 나아질 수 있습니다. 하지만 석탄 발전 설비가 크게 줄어 전력 공급이 크게 줄고 경제 성장도 줄어들 수 있습니다.", "X": "아무 발표도 하지 않으면 시민들의 요구가 무시되어 국민 행복도가 크게 떨어지고, 시위가 길어지면 일상과 경제 활동이 막혀 경제 성장도 조금 줄어들 수 있습니다."}, "foodprice": {"O": "나랏돈으로 식량을 들여와 시장에 풀면 쌀 공급이 늘어 쌀값이 내려가므로, 먹거리 부담이 줄어 보통 사람 소득이 조금 늘고 빈부격차가 조금 줄며 국민 행복도가 오를 수 있습니다. 하지만 식량을 사는 데 나랏돈을 써 경제 성장은 조금 줄어들 수 있습니다.", "X": "식량을 들여오지 않으면 쌀이 모자라 값이 계속 높으므로, 먹거리에 돈을 더 써야 해서 보통 사람 소득이 줄고 형편이 어려운 집일수록 끼니를 잇기 힘들어 빈부격차가 커질 수 있습니다. 국민 행복도도 크게 떨어질 수 있습니다."}, "slum": {"O": "공공 임대 주택을 지으면 집을 잃은 사람들이 싼 값에 안정된 집을 얻어 국민 행복도가 오르고, 집값 부담이 줄어 보통 사람 소득이 조금 늘며 빈부격차가 줄어들 수 있습니다. 새 집들이 전기를 쓰므로 전력 수요는 늘어날 수 있습니다. 하지만 건설비가 들어 경제 성장은 조금 줄어들 수 있습니다.", "X": "주택을 짓지 않으면 집을 잃은 사람들이 계속 빈민가로 몰려 빈부격차가 커지고 국민 행복도가 떨어질 수 있습니다."}, "cooperative": {"O": "어민들이 풍력 단지 지분을 가지면 전기를 판 수익을 나눠 받아 보통 사람 소득이 늘고 빈부격차가 줄며 국민 행복도도 오를 수 있습니다. 풍력 발전 설비가 크게 늘어 전력 공급이 크게 늘고 경제 성장에도 도움이 됩니다.", "X": "지금 상태가 그대로 이어집니다. 다만 어민과 함께 풍력 발전을 늘릴 기회는 얻지 못합니다."}, "fishprotest": {"O": "어민들과 협상하면 피해에 대한 보상과 대책을 함께 정할 수 있어 국민 행복도가 오르고 빈부격차가 조금 줄어들 수 있습니다. 하지만 보상 비용이 들어 경제 성장은 조금 줄어들 수 있습니다.", "X": "협상하지 않으면 어민들이 바다를 계속 막아 풍력 단지 공사가 멈출 수 있으므로 경제 성장이 조금 줄어들 수 있습니다. 어민들의 불만도 쌓여 국민 행복도가 떨어질 수 있습니다."}, "damtour": {"O": "호수 위에 태양광 판을 띄우면 땅을 따로 쓰지 않고도 태양광 발전 설비가 크게 늘어 전력 공급이 늘고, 화석 연료를 덜 태워 기후에도 도움이 됩니다. 생태 관광으로 주민 소득이 조금 늘고 경제 성장에 도움이 되며 국민 행복도도 조금 오를 수 있습니다.", "X": "지금 상태가 그대로 이어집니다. 다만 호수를 활용해 전기와 관광 수입을 함께 얻을 기회는 얻지 못합니다."}, "relocation": {"O": "이재민에게 새 마을을 지어 주면 집을 잃은 사람들이 다시 안정된 생활을 할 수 있어 국민 행복도가 오르고 빈부격차가 줄어들 수 있습니다. 하지만 건설비가 들어 경제 성장은 조금 줄어들 수 있습니다.", "X": "지원하지 않으면 스스로 집을 다시 지을 형편이 안 되는 이재민들이 오랫동안 어렵게 지내게 되어 빈부격차가 커지고 국민 행복도가 크게 떨어질 수 있습니다."}, "recycle": {"O": "폐배터리에서 니켈을 다시 뽑아 쓰면 새 광산을 파지 않아도 되어 숲과 땅이 덜 망가지므로 자연환경이 나아질 수 있습니다. 광석을 캐고 옮기는 과정이 줄어 에너지를 아끼므로 기후에도 조금 도움이 되고, 재활용 산업이 커져 경제 성장에도 도움이 됩니다.", "X": "지금 상태가 그대로 이어집니다. 다만 광산을 넓히지 않고 자원을 얻을 기회는 얻지 못합니다."}, "lawsuit": {"O": "피해 주민에게 배상하고 안전 기준을 강화하면 주민들의 피해가 회복되어 국민 행복도가 오르고 빈부격차가 조금 줄며, 오염 물질 관리가 엄격해져 자연환경도 나아질 수 있습니다. 하지만 배상금과 안전 설비 비용이 들어 경제 성장은 줄어들 수 있습니다.", "X": "소송에 맞서면 피해 주민들이 보상을 받지 못한 채 기다려야 하므로 국민 행복도가 떨어질 수 있습니다."}, "sanction": {"O": "개발 방식을 국제 기준에 맞추면 환경을 해치던 생산 방식을 바꾸게 되어 자연환경이 나아지고 국민 행복도도 조금 오를 수 있습니다. 하지만 생산 방식을 바꾸는 동안 비용이 들고 생산이 줄어 경제 성장은 줄어들 수 있습니다.", "X": "아무것도 바꾸지 않으면 수입 금지가 그대로 이어져 물건을 팔 곳이 줄어들므로 경제 성장이 크게 줄어들 수 있습니다. 일자리가 흔들려 국민 행복도도 떨어질 수 있습니다."}, "hearing": {"O": "지도자가 잘못을 인정하고 전력망 투자 계획을 내놓으면 국민들이 다시 믿음을 갖게 되어 국민 행복도가 오를 수 있습니다. 하지만 전력망 투자에 돈이 들어 경제 성장은 조금 줄어들 수 있습니다.", "X": "청문회에 나가지 않으면 국민들이 지도자가 책임을 피한다고 느껴 국민 행복도가 크게 떨어질 수 있습니다."}, "cryptocrash": {"O": "채굴 업체가 떠나 채굴기가 멈추면서 전력 수요가 크게 줄어들 수 있습니다. 빈 건물을 직업 훈련 센터로 바꾸면 일자리를 잃은 사람들이 새 기술을 배워 보통 사람 소득이 조금 늘고 국민 행복도가 오를 수 있습니다. 하지만 센터를 꾸미는 비용이 들어 경제 성장은 조금 줄어들 수 있습니다.", "X": "채굴 업체가 떠나 채굴기가 멈추면서 전력 수요가 크게 줄어들 수 있습니다. 하지만 빈 건물을 그대로 두면 일자리를 잃은 사람들이 갈 곳이 없어 경제 성장이 줄고, 빈부격차가 커지며 국민 행복도도 떨어질 수 있습니다."}, "seafood": {"O": "오염원을 막고 바다를 정화하면 바다 생태계가 회복되어 자연환경이 나아지고, 어촌 사람들이 다시 희망을 가져 국민 행복도가 오를 수 있습니다. 하지만 정화 사업에 비용이 들어 경제 성장은 줄어들 수 있습니다.", "X": "아무것도 하지 않으면 수산물을 팔 길이 계속 막혀 어촌 소득이 줄므로 경제 성장이 조금 줄고, 어민들이 더 가난해져 빈부격차가 커지며 국민 행복도도 떨어질 수 있습니다."}, "startup": {"O": "마을 청년들이 전국을 돌며 태양광 설비를 고치고 설치하면 제대로 돌아가는 태양광 발전 설비가 늘어 전력 공급이 늘 수 있습니다. 산골 마을에 일자리가 생겨 보통 사람 소득이 늘고 빈부격차가 줄며, 경제 성장과 국민 행복도에도 도움이 됩니다.", "X": "지금 상태가 그대로 이어집니다. 다만 산골 청년들의 일자리와 태양광 설비를 함께 늘릴 기회는 얻지 못합니다."}, "mudslide": {"O": "위험 지역을 미리 점검하면 무너지기 쉬운 비탈을 찾아 나무를 심고 보강할 수 있어 자연환경이 나아지고, 주민들이 안심하게 되어 국민 행복도가 오를 수 있습니다. 하지만 전국을 점검하고 보강하는 비용이 들어 경제 성장은 조금 줄어들 수 있습니다.", "X": "점검하지 않으면 헐벗은 산 아래 마을들이 다음 장마에도 위험에 놓여 국민 행복도가 크게 떨어질 수 있습니다."}, "factoryfire": {"O": "비상구와 스프링클러가 있으면 불이 나도 불길을 초기에 잡고 노동자들이 빨리 대피할 수 있어 국민 행복도가 오르고, 위험한 일터에서 일하는 사람들이 보호받아 빈부격차도 조금 줄어들 수 있습니다. 하지만 공장마다 설비 비용이 들어 경제 성장은 조금 줄어들 수 있습니다.", "X": "공장 주인에게 맡기면 안전 설비가 없는 공장이 많이 남아 노동자들의 불안이 커지므로 국민 행복도가 떨어질 수 있습니다."}, "boycott": {"O": "노동 시간을 줄이고 안전 기준을 높이면 노동자들의 삶이 나아져 국민 행복도가 오르고 빈부격차가 줄어들 수 있습니다. 하지만 인건비와 안전 설비 비용이 늘어 경제 성장은 조금 줄어들 수 있습니다.", "X": "기다리기만 하면 세계 소비자들이 계속 우리 옷을 사지 않아 공장 주문이 줄어들므로 경제 성장이 줄어들 수 있습니다."}, "erosion": {"O": "나무를 다시 심고 계단식 둑을 쌓으면 뿌리와 둑이 흙을 붙잡아 흙이 쓸려 내려가는 것을 막으므로 자연환경이 크게 나아질 수 있습니다. 자라는 나무가 이산화탄소를 흡수해 기후에도 조금 도움이 됩니다. 하지만 공사비가 들어 경제 성장은 조금 줄어들 수 있습니다.", "X": "손쓰지 않으면 비가 올 때마다 흙이 쓸려 내려와 논밭을 덮으므로 자연환경이 나빠지고, 농사를 망친 농민들의 소득이 줄어 보통 사람 소득과 경제 성장이 조금 줄어들 수 있습니다."}, "haze": {"O": "숲 태우기를 금지하고 불을 끄면 숲이 지켜져 자연환경이 나아지고, 나무가 탈 때 나오던 이산화탄소가 줄어 기후에도 도움이 됩니다. 연기가 걷혀 국민 행복도가 조금 오르지만, 헬기 운영 비용이 들고 숲을 태워 농지를 만들던 일이 막혀 경제 성장은 조금 줄어들 수 있습니다.", "X": "바람이 바뀌기만 기다리면 숲이 계속 타면서 이산화탄소가 나와 기후가 조금 나빠지고, 연기 때문에 숨쉬기 힘들어 국민 행복도도 떨어질 수 있습니다."}, "neighborsue": {"O": "배상금을 내고 이웃 나라와 함께 숲을 되살리면 다시 자란 나무가 이산화탄소를 흡수해 기후에 조금 도움이 됩니다. 하지만 배상금과 숲 복원 비용이 들어 경제 성장은 줄어들 수 있습니다.", "X": "배상을 거부하면 이웃 나라와 관계가 나빠져 서로 물건을 사고파는 일이 줄어들 수 있으므로 경제 성장이 줄어들 수 있습니다. 나라 사이 갈등이 커져 국민 행복도도 조금 떨어질 수 있습니다."}, "mineaccident": {"O": "탄광을 멈추고 구조대를 보내면 갇힌 광부들을 빨리 구할 수 있고, 모든 탄광을 점검해 같은 사고를 막을 수 있어 국민 행복도가 오를 수 있습니다. 하지만 탄광이 멈춘 동안 석탄 생산이 줄어 경제 성장은 조금 줄어들 수 있습니다.", "X": "탄광 회사에만 맡기면 구조에 필요한 장비와 인력이 모자랄 수 있어 국민들의 걱정과 분노가 커지므로 국민 행복도가 크게 떨어질 수 있습니다."}, "minerstrike": {"O": "광부들의 임금을 올리고 안전 설비를 갖추면 광부 가정의 소득이 늘어 보통 사람 소득이 늘고 빈부격차가 줄며 국민 행복도가 오를 수 있습니다. 하지만 탄광 운영 비용이 늘어 경제 성장은 조금 줄어들 수 있습니다.", "X": "요구를 들어주지 않으면 파업이 길어져 발전소에 석탄이 모자라고 산업 전체가 흔들리므로 경제 성장이 줄어들 수 있습니다. 갈등이 이어져 국민 행복도도 조금 떨어질 수 있습니다."}, "debt": {"O": "나라 살림을 줄여 빚을 갚으면 이자가 계속 불어나는 것은 막을 수 있지만, 나라가 쓰는 돈이 줄어 경제 성장이 줄어들 수 있습니다. 공공 서비스와 지원이 줄어 보통 사람 소득과 국민 행복도도 조금 떨어질 수 있습니다.", "X": "갚는 날을 미루면 당장 살림을 줄이지 않아도 되지만, 빚에 이자가 더 붙어 다른 곳에 쓸 돈이 줄므로 경제 성장이 조금 줄어들 수 있습니다."}, "debtcrisis": {"O": "국제기구의 돈을 빌리면 당장의 부도는 피할 수 있지만, 조건에 따라 나라 살림을 줄여야 해서 경제 성장이 줄어들 수 있습니다. 복지와 공공 지원이 줄면 형편이 어려운 사람부터 타격을 받아 보통 사람 소득이 줄고 빈부격차가 커질 수 있습니다.", "X": "조건을 거부하면 빚을 갚을 돈을 구하지 못해 나라 경제에 대한 믿음이 무너지므로 경제 성장이 크게 줄어들 수 있습니다. 사람들이 불안에 빠져 국민 행복도도 크게 떨어질 수 있습니다."}, "algae": {"O": "비료 사용을 줄이고 강가에 풀숲을 만들면 풀숲이 질소와 인 같은 영양 물질을 걸러 내 강으로 흘러드는 양이 줄므로 녹조가 줄고 자연환경이 나아질 수 있습니다. 깨끗한 수돗물을 얻을 수 있어 국민 행복도가 조금 오르지만, 비료를 덜 쓰고 땅을 내주는 농가의 부담 때문에 경제 성장은 조금 줄어들 수 있습니다.", "X": "그대로 두면 비료 속 영양 물질이 계속 강으로 흘러들어 조류가 많이 번식하므로 녹조가 이어져 자연환경이 나빠지고, 수돗물 걱정에 국민 행복도도 떨어질 수 있습니다."}, "deadzone": {"O": "비료를 줄이면 강을 따라 바다로 가는 영양 물질이 줄어 조류가 덜 번식하고, 죽은 조류가 썩으면서 산소를 써 버리는 일이 줄어 바다의 산소가 회복되므로 자연환경이 나아질 수 있습니다. 물고기가 돌아오고 농가가 지원금을 받아 보통 사람 소득이 조금 늘 수 있지만, 지원금에 돈이 들어 경제 성장은 조금 줄어들 수 있습니다.", "X": "지원하지 않으면 비료 속 영양 물질이 계속 바다로 흘러가 산소가 부족한 해역이 넓어지므로 자연환경이 나빠질 수 있습니다. 물고기가 사라져 어민 소득이 줄어 보통 사람 소득과 경제 성장이 조금 줄어들 수 있습니다."}, "heatpeak": {"O": "가장 더운 시간대의 요금을 깎아 주며 절전을 이끌면 사람들이 전기 쓰는 시간을 나누어 전력 수요가 크게 줄어들 수 있습니다. 발전소를 덜 돌리게 되어 기후에도 조금 도움이 됩니다. 하지만 더위 속에 에어컨을 덜 틀어 국민 행복도가 조금 떨어지고 경제 활동이 줄어 경제 성장도 조금 줄어들 수 있습니다.", "X": "지금 상태가 그대로 이어집니다. 다만 전력 수요를 낮춰 정전 위험을 줄일 기회는 얻지 못합니다."}, "quake": {"O": "땅속에 높은 압력으로 물을 넣으면 단층 사이의 압력이 높아져 단층이 미끄러지기 쉬워지는데, 시추를 멈추면 이런 조건이 사라져 지진 위험이 줄고 주민들이 안심하게 되어 국민 행복도가 오를 수 있습니다. 시추로 인한 땅과 지하수 오염도 줄어 자연환경이 나아질 수 있습니다. 하지만 셰일가스 생산이 멈춰 경제 성장은 줄어들 수 있습니다.", "X": "시추를 계속하면 땅속 압력 변화로 작은 지진이 이어질 수 있어 주민들의 불안이 커지므로 국민 행복도가 떨어질 수 있습니다."}, "riderstrike": {"O": "배달 노동자도 산업 재해 보험을 받으면 다쳤을 때 치료비와 생활비를 보장받아 국민 행복도가 오르고 빈부격차가 줄어들 수 있습니다. 하지만 보험료 부담이 늘어 경제 성장은 조금 줄어들 수 있습니다.", "X": "파업이 끝나기만 기다리면 배달이 멈춰 상점과 식당의 장사가 줄므로 경제 성장이 조금 줄고, 불편과 갈등이 이어져 국민 행복도도 조금 떨어질 수 있습니다."}, "islandprotest": {"O": "다른 나라 폐기물을 돌려보내고 국제 감시를 받으면 방사성 물질이 새어 나갈 위험이 줄어 자연환경이 나아지고, 섬 주민들이 안심하게 되어 국민 행복도가 오를 수 있습니다. 하지만 폐기물을 맡아 주고 받던 돈이 끊기고 돌려보내는 비용이 들어 경제 성장은 줄어들 수 있습니다.", "X": "시위를 못 본 척하면 섬 주민들의 불안과 분노가 커져 국민 행복도가 떨어질 수 있습니다."}, "greenwash": {"O": "녹색 채권으로 모은 돈을 재생에너지 사업에 쓰면 석탄 대신 깨끗한 에너지가 늘어 이산화탄소 배출이 줄므로 기후가 나아질 수 있습니다. 하지만 석탄 사업을 멈추고 잘못을 바로잡는 비용이 들어 경제 성장은 줄어들 수 있습니다.", "X": "해명하지 않으면 우리나라 채권을 믿기 어렵다고 여기는 투자자가 늘어 돈을 빌리기 어려워지므로 경제 성장이 조금 줄어들 수 있습니다. 잘못이 바로잡히지 않아 국민 행복도도 조금 떨어질 수 있습니다."}, "investorflee": {"O": "회계를 모두 공개하고 독립 감사를 받으면 나라 살림이 투명해져 국민들의 믿음이 커지므로 국민 행복도가 조금 오를 수 있습니다. 하지만 감사 결과가 나올 때까지 투자자들이 지켜보며 돈을 쉽게 넣지 않아 경제 성장은 줄어들 수 있습니다.", "X": "지켜보기만 하면 믿음을 되찾을 근거가 없어 외국 투자금이 계속 빠져나가므로 경제 성장이 크게 줄어들 수 있습니다."}, "aiblackout": {"O": "인공지능의 추천을 사람이 마지막으로 확인하면 잘못된 예측으로 발전소를 끄는 실수를 막을 수 있어 국민들이 안심하므로 국민 행복도가 조금 오를 수 있습니다. 하지만 결정이 느려지고 사람을 더 써야 해서 경제 성장은 조금 줄어들 수 있습니다.", "X": "인공지능을 그대로 두면 잘못된 예측이 다시 정전으로 이어질 수 있다는 걱정 때문에 국민 행복도가 떨어지고, 정전 위험으로 공장과 상점이 불안해져 경제 성장도 조금 줄어들 수 있습니다."}, "refugeeriot": {"O": "난민 노동자에게도 최저 임금을 보장하면 가장 낮은 임금을 받던 사람들의 소득이 올라 빈부격차가 줄고 국민 행복도가 오를 수 있습니다. 하지만 공장의 인건비가 늘어 경제 성장은 조금 줄어들 수 있습니다.", "X": "시위가 이어지면 공장이 제대로 돌아가지 못해 경제 성장이 조금 줄고, 사회 갈등이 커져 국민 행복도가 떨어질 수 있습니다."}, "coral": {"O": "냉각수를 식혀서 내보내면 바닷물 온도가 덜 올라 산호와 산호 속에 함께 사는 조류가 살 수 있는 환경이 돌아오므로 자연환경이 나아질 수 있습니다. 하지만 냉각 장치를 다는 비용이 들어 경제 성장은 조금 줄어들 수 있습니다.", "X": "그대로 두면 데워진 바닷물 때문에 산호가 함께 사는 조류를 내보내고 하얗게 죽는 일이 이어져 자연환경이 나빠질 수 있습니다. 산호에 기대어 살던 물고기가 줄어 어민 소득이 줄면 보통 사람 소득도 조금 줄어들 수 있습니다."}, "tidalflood": {"O": "갯벌은 파도의 힘을 줄여 주고 많은 생물이 사는 곳이므로, 매립지를 다시 갯벌로 되돌리면 자연환경이 크게 나아지고 해일 피해가 줄어 국민 행복도도 조금 오를 수 있습니다. 하지만 매립지를 포기해야 해서 경제 성장은 조금 줄어들 수 있습니다.", "X": "물이 빠지기만 기다리면 파도를 막아 줄 갯벌이 없어 해안 도시가 계속 침수 위험에 놓이므로 국민 행복도가 떨어지고, 피해 복구가 늦어져 경제 성장도 조금 줄어들 수 있습니다."}, "fourdaycheck": {"O": "쉬는 날이 늘면 노동자들이 피로를 풀고 일에 더 집중할 수 있어 시간당 생산량이 늘므로 경제 성장에 도움이 되고, 여가가 늘어 국민 행복도도 오를 수 있습니다.", "X": "지금 상태가 그대로 이어지며, 이미 주 4일 근무를 하는 회사들 덕분에 경제 성장은 조금 늘어날 수 있습니다. 다만 더 많은 사람이 여가를 누리며 행복해질 기회는 얻지 못합니다."}, "prosumer": {"O": "협동조합이 생기면 남는 전기를 팔 수 있어 지붕 태양광을 다는 집이 늘므로 태양광 발전 설비가 크게 늘어 전력 공급이 늘고, 화석 연료를 덜 태워 기후에도 조금 도움이 됩니다. 주민들이 판매 수익을 나눠 받아 보통 사람 소득이 조금 늘고 빈부격차가 줄며 경제 성장에도 조금 도움이 됩니다.", "X": "지금 상태가 그대로 이어집니다. 다만 주민들이 햇빛 전기로 소득을 얻을 기회는 얻지 못합니다."}, "engineers": {"O": "졸업생들이 발전기 부품 회사를 세우면 새 일자리와 기술 산업이 생겨 경제 성장에 도움이 되고, 기술을 가진 청년들의 소득이 늘어 보통 사람 소득이 조금 늘며 빈부격차가 조금 줄어들 수 있습니다.", "X": "지금 상태가 그대로 이어집니다. 다만 젊은 기술 인재가 나라 안에서 일자리를 만들 기회는 얻지 못합니다."}, "healthykids": {"O": "학교 급식을 시작하면 가난한 집 아이들도 매일 영양 있는 밥을 먹을 수 있어 빈부격차가 줄고 국민 행복도가 오를 수 있습니다. 식비 부담이 줄어 보통 사람 소득이 조금 늘고, 건강해진 아이들이 자라 경제 성장에도 조금 도움이 됩니다.", "X": "지금 상태가 그대로 이어집니다. 다만 아이들이 더 건강하게 자랄 기회는 얻지 못합니다."}, "coldchain": {"O": "냉장 창고에 농산물을 보관하면 상해서 버리는 양이 줄고 값이 좋을 때 팔 수 있어 농민 소득이 늘므로, 보통 사람 소득이 늘고 빈부격차가 줄며 경제 성장에도 도움이 됩니다. 냉장 설비를 돌리느라 전력 수요는 조금 늘어날 수 있습니다.", "X": "지금 상태가 그대로 이어집니다. 다만 농민들이 농산물을 제값에 팔 기회는 얻지 못합니다."}, "g_effsave": {"O": "남는 전기를 이웃 나라에 팔면 전기가 수출품이 되어 수출이 늘고 나라 자산이 조금 늘며 경제 성장에 도움이 됩니다. 이웃 나라가 화석 연료로 만들 전기를 대신할 수 있어 기후에도 조금 도움이 될 수 있습니다.", "X": "지금 상태가 그대로 이어집니다. 다만 남는 전기를 팔아 돈을 벌 기회는 얻지 못합니다."}, "g_cleanair": {"O": "외국 기업 지사가 들어오면 일자리와 투자가 늘어 경제 성장에 도움이 되고, 수출이 늘며 나라 자산도 조금 늘어날 수 있습니다. 좋은 일자리가 생겨 국민 행복도도 오를 수 있습니다.", "X": "지금 상태가 그대로 이어지며, 맑아진 공기 덕분에 국민 행복도는 조금 오를 수 있습니다. 다만 외국 기업을 불러 일자리와 투자를 늘릴 기회는 얻지 못합니다."}, "g_healthy": {"O": "해마다 건강 검진을 하면 병을 일찍 찾아 치료할 수 있어 노동자들이 더 건강해지므로 국민 행복도가 오르고, 일을 쉬는 날이 줄어 보통 사람 소득이 조금 늘며 경제 성장에도 도움이 됩니다.", "X": "지금 상태가 그대로 이어지며, 이미 건강해진 노동자들 덕분에 경제 성장은 조금 늘어날 수 있습니다. 다만 병을 미리 찾아 건강을 더 지킬 기회는 얻지 못합니다."}, "g_geoexport": {"O": "지열 발전 기술과 기술자를 다른 나라에 보내면 기술료가 들어와 수출이 크게 늘고 나라 자산과 경제 성장에도 도움이 됩니다. 다른 나라들이 화석 연료 대신 지열로 전기를 만들게 되어 기후에도 조금 도움이 됩니다.", "X": "지금 상태가 그대로 이어집니다. 다만 지열 기술을 팔아 수출을 늘릴 기회는 얻지 못합니다."}, "g_farmincome": {"O": "농촌 청년에게 창업 자금을 주면 젊은 농부들이 새 일을 시작해 농촌 소득이 늘므로 보통 사람 소득이 늘고 도시와 농촌 사이의 빈부격차가 줄어들 수 있습니다. 농촌에 활기가 돌아 국민 행복도와 경제 성장에도 조금 도움이 됩니다.", "X": "지금 상태가 그대로 이어집니다. 다만 돌아온 젊은 농부들이 새 일을 시작할 기회는 얻지 못합니다."}, "g_ecotour": {"O": "외국 여행자가 우리나라에서 쓰는 돈은 수출과 같은 효과를 내므로, 주민이 생태 숙소를 운영하면 수출이 늘고 주민 소득이 조금 늘며 경제 성장에도 도움이 됩니다. 숲이 지켜져야 여행자가 오므로 주민들이 숲을 보호하게 되어 자연환경도 조금 나아질 수 있습니다.", "X": "지금 상태가 그대로 이어지며, 국립공원을 찾는 여행자들 덕분에 수출과 경제 성장은 조금 늘어날 수 있습니다. 다만 그 돈이 주민들의 소득으로 이어질 기회는 얻지 못합니다."}, "g_carbonfund": {"O": "탄소세 기금을 재생에너지 기업에 투자하면 태양광 발전 설비가 크게 늘어 전력 공급에 도움이 되고, 화석 연료 대신 햇빛으로 전기를 만들어 탄소 배출이 줄어 기후가 나아질 수 있습니다. 새 기업이 자라 경제가 성장하고 수출도 늘어날 수 있습니다. 하지만 기금을 꺼내 쓰는 만큼 나라 자산은 조금 줄어듭니다.", "X": "기금을 쓰지 않고 금고에 두면 나라 자산이 조금 늘어날 수 있고, 지금 상태가 그대로 이어집니다. 하지만 재생에너지 기업을 키워 전력 공급과 수출을 늘릴 기회는 얻지 못합니다."}, "g_greentech": {"O": "효율 높은 태양 전지를 세계 시장에 팔면 수출이 크게 늘어 경제가 크게 성장하고 나라 자산도 늘어날 수 있습니다. 일자리가 생겨 보통 사람 소득이 조금 오르고, 여러 나라가 화석 연료 대신 태양광을 쓰게 되어 기후도 조금 나아질 수 있습니다.", "X": "지원이 없어도 기업이 스스로 판매를 이어 가면 경제가 조금 성장하고 수출도 어느 정도 늘어날 수 있습니다. 하지만 세계 시장을 넓게 차지할 기회는 놓칠 수 있습니다."}, "g_newminers": {"O": "탄광이 문을 닫은 마을에 풍력 부품 공장이 서면 다시 교육받은 노동자들이 새 일자리를 얻어 보통 사람 소득이 오르고 빈부격차가 줄어들 수 있습니다. 마을 경제가 살아나 국민 행복도가 높아지고, 부품을 해외에 팔아 수출과 경제 성장에도 도움이 됩니다.", "X": "지금 상태가 그대로 이어집니다. 다시 교육받은 노동자들이 일할 공장과 마을의 새 일자리를 얻을 기회는 놓치게 됩니다."}, "g_gridstable": {"O": "전기가 끊기지 않는 나라에는 정밀한 생산 설비를 가진 첨단 기업이 공장을 세우기 쉬워 투자가 늘고 경제가 성장할 수 있습니다. 첨단 제품 수출이 크게 늘고 나라 자산도 늘어나며, 일자리가 생겨 보통 사람 소득도 조금 오를 수 있습니다.", "X": "지금 상태가 그대로 이어지며 경제는 조금 성장할 수 있습니다. 하지만 안정된 전력망을 바탕으로 첨단 기업 투자를 끌어들일 기회는 놓치게 됩니다."}, "g_credit": {"O": "이자가 비싼 옛 빚을 이자가 싼 새 빚으로 바꾸면 해마다 내는 이자가 줄어 나랏빚 부담이 줄어들 수 있습니다. 아낀 이자만큼 나라 자산이 조금 늘고, 그 돈을 다른 곳에 쓸 수 있어 경제 성장에도 조금 도움이 됩니다.", "X": "지금 상태가 그대로 이어지며 경제는 조금 성장할 수 있습니다. 하지만 올라간 신용 등급을 이용해 이자 부담을 줄일 기회는 얻지 못합니다."}, "g_shield": {"O": "이웃 나라에 돈을 빌려주면 그만큼 금고에서 돈이 나가 나라 자산이 줄어들 수 있습니다. 하지만 이웃 나라 경제가 버티면 우리 물건을 계속 살 수 있어 수출이 늘고, 경제가 조금 성장하며 국민 행복도도 조금 오를 수 있습니다.", "X": "자산을 금고에 그대로 지키면 지금 상태가 그대로 이어지며 경제는 조금 성장할 수 있습니다. 하지만 이웃 나라와의 관계를 다지고 수출 시장을 넓힐 기회는 얻지 못합니다."}, "g_tradeboom": {"O": "수출 이익의 일부를 피해 농민에게 나누면 소득이 고르게 퍼져 빈부격차가 줄고 보통 사람 소득이 조금 오를 수 있습니다. 수출도 계속 늘고 경제도 조금 성장할 수 있습니다. 하지만 기금에 나랏돈이 들어가 나라 자산은 조금 줄어듭니다.", "X": "수출 이익이 기업에 그대로 남으면 수출이 늘고 경제도 조금 성장할 수 있습니다. 하지만 피해를 본 농민들은 이익을 나눠 받지 못해 빈부격차가 커질 수 있습니다."}, "g_welfarebuild": {"O": "형편이 어려운 학생도 장학금으로 이공계 공부를 할 수 있으면 교육 기회가 고르게 퍼져 빈부격차가 줄고 국민 행복도가 오를 수 있습니다. 공부한 인재가 기술 일자리를 얻어 보통 사람 소득이 조금 오르고 경제 성장에도 조금 도움이 됩니다. 하지만 장학금에 나랏돈이 들어가 나라 자산은 조금 줄어듭니다.", "X": "지금 상태가 그대로 이어집니다. 새로 지은 학교에서 공부하는 아이들을 과학 기술 인재로 키울 기회는 얻지 못합니다."}, "g_scholars": {"O": "연구자가 자유롭게 주제를 정할 수 있으면 새 기술과 발명이 나오기 쉬워 새로운 제품의 수출이 크게 늘어날 수 있습니다. 그 덕분에 경제가 성장하고 보통 사람 소득도 조금 오를 수 있습니다.", "X": "지금 상태가 그대로 이어지며 경제는 조금 성장할 수 있습니다. 하지만 돌아온 젊은 과학자들의 연구 능력을 새 기술로 키울 기회는 놓치게 됩니다."}, "g_cleangov": {"O": "정부 계약을 모두 공개하면 뇌물이 끼어들기 어려워 나랏돈이 새지 않고, 외국 투자자의 믿음이 커져 투자와 수출이 늘어날 수 있습니다. 경제가 성장하고 나라 자산이 조금 늘며, 공정한 계약으로 빈부격차가 조금 줄고 국민 행복도도 오를 수 있습니다.", "X": "지금 상태가 그대로 이어지며 경제는 조금 성장할 수 있습니다. 하지만 청렴한 정부라는 믿음을 법으로 굳혀 투자를 더 끌어들일 기회는 놓치게 됩니다."}, "g_trust": {"O": "탄소국경세가 줄면 유럽에서 우리 제품 값이 싸져 더 많이 팔 수 있으므로 수출이 크게 늘어날 수 있습니다. 그 덕분에 경제도 성장할 수 있습니다.", "X": "지금 상태가 그대로 이어지며 수출은 어느 정도 늘고 경제도 조금 성장할 수 있습니다. 하지만 줄어든 탄소국경세를 이용해 유럽 시장을 크게 넓힐 기회는 놓치게 됩니다."}, "g_schoolfull": {"O": "급식과 장학금이 있으면 가난한 집 아이들도 일하러 가지 않고 학교에 계속 다닐 수 있어 국민 행복도가 오르고 빈부격차가 줄어들 수 있습니다. 공부한 아이들이 자라 더 나은 일자리를 얻으면 보통 사람 소득과 경제 성장에도 조금 도움이 됩니다. 하지만 급식비와 장학금으로 나라 자산은 조금 줄어듭니다.", "X": "지금 상태가 그대로 이어집니다. 학교로 돌아온 아이들이 끝까지 공부하도록 도울 기회는 얻지 못합니다."}, "g_publictrust": {"O": "시민이 예산을 정하는 데 직접 참여하면 나랏돈이 어디에 쓰이는지 알 수 있어 정부를 더 믿게 되고 국민 행복도가 오를 수 있습니다. 시민이 필요한 곳에 예산을 나누어 빈부격차가 조금 줄고, 개혁이 순조로워 경제도 조금 성장할 수 있습니다.", "X": "지금 상태가 그대로 이어지며 국민 행복도는 조금 오를 수 있습니다. 하지만 높아진 정부 신뢰를 예산 정책까지 넓혀 더 큰 지지를 얻을 기회는 놓치게 됩니다."}, "g_ready": {"O": "재난 대응 기술을 다른 나라에 가르치면 교육과 장비 판매로 수출이 늘고 경제가 조금 성장할 수 있습니다. 우리나라의 기술이 세계에 인정받아 국민의 자부심과 행복도도 오를 수 있습니다.", "X": "지금 상태가 그대로 이어지며 경제와 국민 행복도는 조금 오를 수 있습니다. 하지만 재난 대응 기술을 수출 상품으로 키울 기회는 얻지 못합니다."}, "g_warmwinter": {"O": "단열 공사를 하면 벽과 창으로 빠져나가는 열이 줄어 난방 연료가 덜 들기 때문에 연료 수입이 줄고, 연료를 덜 태워 탄소 배출이 줄어 기후도 조금 나아질 수 있습니다. 가난한 집의 난방비 부담이 줄어 국민 행복도가 오르고 빈부격차가 조금 줄며, 경제 성장에도 조금 도움이 됩니다.", "X": "지금 상태가 그대로 이어지며 연료 수입은 조금 줄고 경제는 조금 성장할 수 있습니다. 하지만 가난한 집의 난방비 부담을 덜고 연료 사용을 더 줄일 기회는 놓치게 됩니다."}, "g_elderhappy": {"O": "노인들이 골목 가게에서 일하면 소득이 생겨 보통 사람 소득이 조금 오르고 빈부격차가 조금 줄어들 수 있습니다. 과거 자료에 담긴 편견까지 배우므로, 판단 기준을 공개하고 사람이 다시 검토하면 잘못된 판단을 바로잡을 수 있습니다. 가난한 동네 사람들이 억울하게 의심받는 일이 줄어 빈부격차가 줄고 국민 행복도가 오를 수 있습니다.", "X": "편견이 담긴 자료로 배운 인공지능이 계속 판단하면 가난한 동네 사람들이 더 자주 의심받아 빈부격차가 커지고 국민 행복도가 떨어질 수 있습니다."}, "riotai": {"O": "억울한 사람들을 풀어 주고 잘못을 인정하면 분노의 원인이 풀려 국민 행복도가 오를 수 있습니다. 하지만 폭동으로 멈춘 일상이 바로 돌아오지는 않아 경제는 조금 위축될 수 있습니다.", "X": "억울함이 풀리지 않으면 분노가 더 커져 국민 행복도가 크게 떨어지고, 거리의 혼란으로 가게와 공장이 멈춰 경제가 위축될 수 있습니다."}, "gang": {"O": "뇌물을 받는 경찰 조직과 따로 떨어진 수사 기관이 생기면 범죄 조직을 제대로 수사할 수 있어 사람들이 안심하고 국민 행복도가 오르며, 범죄 조직이 빼앗던 이익이 줄어 빈부격차도 조금 줄어들 수 있습니다. 하지만 수사 과정에서 암시장 거래가 막히면서 경제는 조금 위축될 수 있습니다.", "X": "범죄 조직이 계속 커지면 상인과 주민이 돈을 빼앗기고 불안해져 국민 행복도가 떨어지고 빈부격차가 커질 수 있습니다. 정상적인 사업도 위축되어 경제가 조금 나빠질 수 있습니다."}, "mafiastate": {"O": "항구와 세관을 되찾으면 밀수가 줄고 세금이 다시 걷혀 나라 자산이 조금 늘고 국민 행복도가 조금 오를 수 있습니다. 하지만 항구를 되찾는 동안 물건을 싣고 내리는 일이 멈춰 경제가 위축될 수 있습니다.", "X": "범죄 조직이 세관을 쥐고 있으면 세금이 걷히지 않아 나라 자산이 줄고, 밀수 이익이 범죄 조직에 몰려 빈부격차가 커질 수 있습니다. 값싼 밀수품에 밀려 정상적인 기업이 어려워져 경제도 위축될 수 있습니다."}, "campdisease": {"O": "설사병은 오염된 물속의 병원체로 퍼지므로 깨끗한 물을 주고 치료하면 환자가 줄어 국민 행복도가 오를 수 있습니다. 하지만 물과 병원을 보내는 데 나랏돈이 들어 나라 자산이 조금 줄고 경제도 조금 위축될 수 있습니다.", "X": "오염된 물을 계속 마시면 병원체가 퍼져 환자가 늘고 국민 행복도가 떨어질 수 있습니다. 아픈 사람이 늘어 경제도 조금 위축될 수 있습니다."}, "epidemic": {"O": "감염병은 사람과 사람 사이로 옮겨 가므로 모임을 줄이고 빨리 검사하고 치료하면 퍼지는 속도를 늦출 수 있습니다. 하지만 가게와 공장의 활동이 줄어 경제가 위축되고, 검사와 치료 비용으로 나라 자산이 줄며, 답답한 생활로 국민 행복도도 조금 떨어질 수 있습니다.", "X": "사람 사이의 접촉이 그대로이면 병원체가 빠르게 옮겨 가 환자가 늘어 국민 행복도가 크게 떨어질 수 있습니다. 일할 사람이 아파 쓰러지면 경제도 위축될 수 있습니다."}, "hospitalcollapse": {"O": "임시 병원을 지으면 치료받지 못하던 환자를 받을 수 있어 국민 행복도가 오를 수 있습니다. 하지만 빚을 내서 짓기 때문에 나랏빚이 늘고, 위기 속에서 경제는 조금 위축될 수 있습니다.", "X": "병원이 환자를 받지 못하면 치료가 늦어지고 의료진까지 지쳐 국민 행복도가 크게 떨어질 수 있습니다. 아픈 사람이 일터로 돌아가지 못해 경제도 위축될 수 있습니다."}, "measles": {"O": "백신은 몸이 병원체를 미리 기억하게 하므로, 접종받은 아이가 늘면 홍역이 옮겨 갈 사람이 줄어 유행이 가라앉고 국민 행복도가 오를 수 있습니다. 하지만 긴급 접종에 인력과 비용이 들어 경제는 조금 위축될 수 있습니다.", "X": "면역이 없는 아이들 사이에서 홍역 바이러스가 계속 옮겨 가 환자가 늘고 국민 행복도가 떨어질 수 있습니다. 아이를 돌보느라 일하지 못하는 부모가 늘어 경제도 조금 위축될 수 있습니다."}, "zoonosis": {"O": "감염된 가축을 처분하고 방역하면 병원체가 다른 농장과 사람에게 옮겨 갈 길이 막힙니다. 하지만 처분한 가축만큼 생산이 줄어 경제가 조금 위축되고 보통 사람 소득도 조금 줄어들 수 있습니다.", "X": "병원체가 빽빽한 축사 사이로 계속 퍼지면 사람에게도 옮을 수 있다는 불안이 커져 국민 행복도가 떨어질 수 있습니다. 병든 가축이 늘어 경제도 조금 위축될 수 있습니다."}, "quakeagain": {"O": "지열 발전소는 땅속에 물을 넣고 빼는 과정에서 단층을 건드려 지진을 일으킬 수 있으므로, 발전소를 멈추면 그 위험이 줄고 보상받은 주민들의 행복도가 오를 수 있습니다. 하지만 발전소 가동이 멈춰 경제가 위축되고, 보상금으로 나라 자산이 줄어들 수 있습니다.", "X": "발전소를 계속 돌리면 땅속 압력 변화로 지진 위험이 이어져 주민들이 불안에 떨고 국민 행복도가 크게 떨어질 수 있습니다. 집과 건물 피해가 쌓여 경제도 조금 위축될 수 있습니다."}, "waterriot": {"O": "마실 물을 마을에 먼저 보내면 물을 둘러싼 다툼이 줄고 가난한 마을의 생활이 지켜져 국민 행복도가 오르고 빈부격차가 조금 줄어들 수 있습니다. 하지만 공장에 갈 물이 줄어 생산이 멈추면서 경제가 조금 위축될 수 있습니다.", "X": "물을 나누는 기준이 없으면 마른 마을끼리 물을 두고 다툼이 커져 국민 행복도가 크게 떨어질 수 있습니다. 혼란 속에 경제도 조금 위축될 수 있습니다."}, "lakedry": {"O": "목화밭에 대던 물을 호수로 돌려보내면 호수에 물이 다시 차올라 드러난 바닥이 줄고 소금과 농약 먼지가 덜 날려 자연환경이 크게 나아질 수 있습니다. 하지만 목화 생산이 줄어 경제가 위축될 수 있습니다.", "X": "강물을 계속 목화밭에 끌어 쓰면 호수로 들어오는 물보다 증발하는 물이 많아 호수가 더 작아지고 자연환경이 나빠질 수 있습니다. 드러난 바닥에서 소금과 농약 먼지가 날려 국민 행복도도 조금 떨어질 수 있습니다."}, "dusthealth": {"O": "소금과 농약 먼지를 들이마신 주민을 일찍 검사하고 치료하면 호흡기 병이 심해지는 것을 막아 국민 행복도가 오를 수 있습니다. 하지만 검진과 치료 비용이 들어 경제는 조금 위축될 수 있습니다.", "X": "먼지가 계속 날리는데 치료를 받지 못하면 기침과 호흡기 병이 심해져 국민 행복도가 떨어질 수 있습니다."}, "wellsdry": {"O": "리튬을 덜 뽑으면 지하수를 덜 끌어 써 지하수가 회복될 수 있으므로 자연환경이 나아지고, 마을에 물이 돌아와 국민 행복도가 오를 수 있습니다. 하지만 리튬 생산이 줄어 수출이 줄고 경제가 조금 위축될 수 있습니다.", "X": "지하수를 계속 끌어 쓰면 원주민 마을의 우물이 더 마르고 물 부족이 이어져 국민 행복도가 떨어질 수 있습니다."}, "landless": {"O": "땅을 다시 나누면 농민들이 스스로 농사지어 소득을 얻을 수 있어 보통 사람 소득이 오르고 빈부격차가 줄어들 수 있습니다. 하지만 대농장 중심의 대규모 생산이 줄어 경제는 조금 위축될 수 있습니다.", "X": "땅이 대농장에 몰린 채로 두면 땅을 잃은 농민들이 도시에서 일자리를 찾지 못해 빈부격차가 커지고 국민 행복도가 떨어질 수 있습니다."}, "fishcollapse": {"O": "물고기를 잡지 않는 기간을 정하면 물고기가 알을 낳고 자랄 시간이 생겨 바다 생태계가 회복되므로 자연환경이 나아질 수 있습니다. 하지만 그동안 고기를 잡지 못해 어민 소득이 줄어 보통 사람 소득이 조금 줄고 경제도 조금 위축될 수 있습니다.", "X": "물고기가 줄어든 채로 고기잡이가 이어지면 어촌의 소득이 더 줄어 보통 사람 소득이 떨어지고 경제도 조금 위축될 수 있습니다."}, "grainloan": {"O": "곡물 대금을 나라 자산으로 바로 갚으면 이자가 붙지 않습니다. 하지만 금고에서 큰돈이 나가 나라 자산이 줄고, 쓸 수 있는 돈이 줄어 경제가 조금 위축될 수 있습니다.", "X": "갚을 날을 미루면 당장 돈은 나가지 않지만, 미룬 기간만큼 이자가 붙어 나랏빚이 늘어날 수 있습니다."}, "inflation": {"O": "이자율을 올리면 돈을 빌리기 어려워지고 저축이 늘어 시중에 도는 돈이 줄기 때문에 물가 상승이 느려질 수 있습니다. 물가가 안정되면 월급의 가치가 덜 줄어 보통 사람 소득에 조금 도움이 됩니다. 하지만 소비와 투자가 줄어 경제가 위축되고 국민 행복도가 조금 떨어질 수 있습니다.", "X": "물가가 계속 오르면 같은 월급으로 살 수 있는 물건이 줄어 보통 사람 소득이 줄어들고 국민 행복도가 떨어질 수 있습니다. 경제도 조금 위축될 수 있습니다."}, "breadriot": {"O": "식량 배급소에서 먹을 것을 나누면 굶주림이 줄어 분노가 가라앉고 국민 행복도가 오르며, 가난한 사람의 부담이 덜어져 빈부격차도 조금 줄어들 수 있습니다. 하지만 식량을 사는 데 나랏돈이 들어 나라 자산이 조금 줄고 경제도 조금 위축될 수 있습니다.", "X": "굶주림이 해결되지 않으면 분노가 다른 도시로 번져 국민 행복도가 크게 떨어지고, 가게와 창고가 문을 닫아 경제도 조금 위축될 수 있습니다."}, "bankrun": {"O": "나라가 예금을 지켜 준다고 하면 사람들이 은행이 어려워져도 돈을 잃지 않는다고 믿어 한꺼번에 예금을 찾을 이유가 사라지고, 불안이 줄어 국민 행복도가 조금 오를 수 있습니다. 하지만 보장할 돈을 마련해야 해 나랏빚이 늘고 경제는 조금 위축될 수 있습니다.", "X": "모두가 한꺼번에 돈을 찾으면 은행은 빌려준 돈을 바로 돌려받지 못해 버티기 어려워집니다. 은행이 흔들리면 기업이 돈을 빌리지 못해 경제가 위축되고 국민 행복도가 떨어질 수 있습니다."}, "shortdebt": {"O": "국영 기업 지분을 담보로 내놓으면 외국 은행이 돈을 떼일 걱정이 줄어 만기를 늘려 주므로, 급하게 비싼 돈을 빌리지 않아도 되어 나랏빚 부담이 조금 줄어들 수 있습니다. 하지만 담보로 잡힌 지분만큼 나라 자산이 줄고, 위기 속에서 경제는 조금 위축될 수 있습니다.", "X": "만기를 늘리지 못하면 빚을 갚기 위해 더 높은 이자로 다시 빌려야 해 나랏빚이 크게 늘어날 수 있습니다. 경제도 조금 위축될 수 있습니다."}, "tradewar": {"O": "관세를 함께 낮추면 이웃 나라에서 우리 물건값이 내려가 수출이 늘어날 수 있습니다. 하지만 우리도 관세를 낮추므로 외국 물건이 더 들어와 수입이 늘고, 외국 물건과 경쟁하는 국내 기업이 어려워져 경제는 조금 위축될 수 있습니다.", "X": "보복 관세가 그대로이면 이웃 나라에서 우리 물건값이 비싸져 덜 팔리므로 수출이 크게 줄고 경제가 위축될 수 있습니다."}, "exportcrash": {"O": "새 수출 시장을 찾으면 막힌 주문을 다른 나라에서 채울 수 있어 수출이 크게 늘어날 수 있습니다. 하지만 새 시장을 여는 데 시간과 비용이 들어 경제는 조금 위축될 수 있습니다.", "X": "막힌 수출 시장을 대신할 곳이 없으면 공장 주문이 계속 줄어 수출이 크게 줄고 경제가 위축될 수 있습니다. 일감이 줄어 노동자의 벌이가 줄면서 보통 사람 소득도 조금 줄어들 수 있습니다."}, "unemploy": {"O": "기본 소득은 실업자의 생활비를 받쳐 주고 직업 교육은 새 일자리로 옮겨 갈 기술을 주므로, 국민 행복도가 오르고 빈부격차가 줄며 보통 사람 소득이 조금 오를 수 있습니다. 하지만 큰돈이 들어 나랏빚이 늘고 경제는 조금 위축될 수 있습니다.", "X": "일자리를 잃은 사람들이 소득도 새 기술도 얻지 못하면 빈부격차가 커지고 국민 행복도가 크게 떨어질 수 있습니다. 쓸 돈이 없어 소비가 줄면서 경제도 조금 위축될 수 있습니다."}, "luddite": {"O": "노동자 대표와 함께 자동화 속도를 정하면 일자리를 잃을 걱정이 줄고 갈등이 대화로 풀려 국민 행복도가 오를 수 있습니다. 하지만 자동화가 늦춰져 생산성이 덜 오르므로 경제는 조금 위축될 수 있습니다.", "X": "일자리를 잃는 불안이 풀리지 않으면 로봇을 부수는 일이 이어져 국민 행복도가 떨어지고, 공장이 멈춰 경제도 조금 위축될 수 있습니다."}, "aiblackbox": {"O": "인공지능이 판단 이유를 설명해야 하면 사람이 그 판단이 옳은지 확인하고 잘못을 바로잡을 수 있어 믿음이 커지고 국민 행복도가 조금 오를 수 있습니다. 하지만 설명 기능을 갖추는 데 비용과 시간이 들어 경제는 조금 위축될 수 있습니다.", "X": "지금 상태가 그대로 이어집니다. 전력망을 맡은 인공지능의 판단을 사람이 확인하고 바로잡을 기회는 얻지 못합니다."}, "aiblackout2": {"O": "사람이 직접 조종하는 예비 전력망이 있으면 인공지능이 오류를 일으켜도 전기를 다시 보낼 수 있어 정전 걱정이 줄고 국민 행복도가 조금 오를 수 있습니다. 하지만 새 전력망을 짓는 데 돈을 빌려 나랏빚이 늘고 경제는 조금 위축될 수 있습니다.", "X": "인공지능 전력망에만 기대면 오류가 날 때 대신할 장치가 없어 정전 걱정이 이어지므로 국민 행복도가 크게 떨어질 수 있습니다. 전기가 끊기면 공장과 가게가 멈춰 경제도 위축될 수 있습니다."}, "overtour": {"O": "관광세를 걷고 주민 주택을 지키면 집이 숙박업소로 바뀌는 속도가 늦춰져 주민들이 살던 곳에 머물 수 있으므로 국민 행복도가 오르고 빈부격차가 조금 줄어들 수 있습니다. 하지만 세율이 조금 오르고 관광객의 씀씀이가 줄어 경제는 조금 위축될 수 있습니다.", "X": "관광 수입이 계속 들어와 경제는 조금 성장할 수 있습니다. 하지만 집이 숙박업소로 바뀌며 집세가 올라 주민들이 밀려나므로 빈부격차가 커지고 국민 행복도가 떨어질 수 있습니다."}, "housing": {"O": "공공 임대 주택이 많이 공급되면 집을 구하는 사람이 싼값에 살 곳을 얻어 국민 행복도가 오르고 빈부격차가 줄어들 수 있습니다. 건설 일감이 늘어 경제도 조금 성장할 수 있습니다. 하지만 짓는 데 큰돈이 들어 나랏빚이 늘어날 수 있습니다.", "X": "집값이 월급보다 빨리 오르면 집을 가진 사람과 못 가진 사람의 재산 차이가 벌어져 빈부격차가 커지고 국민 행복도가 떨어질 수 있습니다."}, "emptycity": {"O": "비어 있는 아파트를 공공 임대 주택으로 쓰면 집이 필요한 사람에게 살 곳이 생겨 국민 행복도가 조금 오르고 빈부격차가 조금 줄어들 수 있습니다. 하지만 아파트를 사들이는 데 돈을 빌려 나랏빚이 늘고 경제는 조금 위축될 수 있습니다.", "X": "건설사들이 빚을 갚지 못하면 돈을 빌려준 은행과 협력 업체까지 어려워져 경제가 위축될 수 있습니다. 무너지는 기업의 뒷수습에 나랏돈이 들어 나랏빚도 늘어날 수 있습니다."}, "waterprice": {"O": "수도를 나라가 맡으면 이익보다 공공의 필요를 먼저 따져 요금을 정할 수 있어 국민 행복도가 오르고, 가난한 집의 부담이 줄어 빈부격차가 줄어들 수 있습니다. 하지만 수도 사업을 사들이는 데 돈을 빌려 나랏빚이 늘고 경제는 조금 위축될 수 있습니다.", "X": "물은 누구나 써야 하는 필수품이라 요금이 올라도 줄여 쓰기 어려우므로 생활 부담이 커지고 국민 행복도가 떨어질 수 있습니다."}, "elderpoverty": {"O": "기초 연금이 있으면 소득이 없는 노인도 기본 생활비를 받아 국민 행복도가 오르고 빈부격차가 줄어들 수 있습니다. 하지만 해마다 연금을 주는 데 돈이 들어 나랏빚이 늘고 경제는 조금 위축될 수 있습니다.", "X": "소득이 없는 노인들이 계속 가난에 머물러 빈부격차가 조금 커지고 국민 행복도가 떨어질 수 있습니다."}, "pylonprotest": {"O": "지도자가 직접 사과하고 보상하면 노인들의 억울함이 풀리고 응원하던 시민들의 마음도 누그러져 국민 행복도가 오를 수 있습니다. 하지만 보상금으로 나라 자산이 조금 줄고 경제도 조금 위축될 수 있습니다.", "X": "억울함을 들어 주지 않으면 노인들의 단식이 이어지고 전국의 응원이 분노로 바뀌어 국민 행복도가 떨어질 수 있습니다."}, "heatdeath": {"O": "병원과 가정에 전기를 먼저 보내도록 법을 고치면 폭염 정전 때 생명을 지킬 수 있어 국민 행복도가 오를 수 있습니다. 하지만 데이터센터 같은 시설의 전기 사용이 제한되어 경제는 조금 위축될 수 있습니다.", "X": "사람의 생명보다 시설의 전기를 앞세운 기준이 그대로 남으면 분노와 슬픔이 커져 국민 행복도가 크게 떨어질 수 있습니다."}, "exposed": {"O": "잘못을 인정하고 조사를 받는 동안 여러 나라가 거래를 미룰 수 있어 수출이 줄고 경제가 위축될 수 있습니다. 하지만 숨기지 않고 책임지는 태도로 믿음을 지켜 국민 행복도는 조금 오를 수 있습니다.", "X": "증거가 드러난 잘못에 대응하지 않으면 다른 나라들이 우리 제품을 믿지 못해 수출이 크게 줄고 경제가 조금 위축될 수 있습니다."}, "unsanction": {"O": "불법 사업을 멈추면 그 사업으로 벌던 돈이 끊기고 국제 기준을 맞추는 동안 수출이 크게 줄어 경제가 위축될 수 있으며, 사 오는 물건도 줄어 수입이 줄어들 수 있습니다. 하지만 국제 사회의 요구에 책임 있게 답하는 만큼 국민 행복도는 조금 오를 수 있습니다.", "X": "국제 기준을 따르지 않고 버티면 여러 나라가 우리와의 거래를 막을 수 있어 수출이 크게 줄고 사 오는 물건도 크게 줄어들 수 있습니다. 그 결과 경제가 크게 위축되고 국민 행복도도 떨어질 수 있습니다."}, "spycaught": {"O": "사과하고 배상하면 피해를 갚느라 나라 자산이 줄고, 신뢰가 회복될 때까지 수출이 줄어 경제가 위축될 수 있습니다.", "X": "기술 절도를 모른 척하면 상대 나라가 우리 기업의 물건을 받지 않을 수 있어 수출이 크게 줄고 경제가 위축될 수 있습니다."}, "g_elninoready": {"O": "엘니뇨 대비 기술을 이웃 나라에 가르치면 우리 기술과 품종을 찾는 나라가 늘어 수출이 늘고 경제가 조금 성장할 수 있습니다. 이웃 나라와 함께 위기를 이겨 낸다는 자부심으로 국민 행복도도 오를 수 있습니다.", "X": "지금 상태가 그대로 이어지며 경제와 국민 행복도는 조금 오를 수 있습니다. 하지만 엘니뇨 대비 기술을 수출하고 이웃 나라와 관계를 다질 기회는 얻지 못합니다."}, "elninohit": {"O": "흉년으로 소득이 끊긴 농민에게 긴급 구호를 하면 생계가 유지되어 국민 행복도가 오르고 빈부격차가 조금 줄어들 수 있습니다. 하지만 구호에 나랏돈이 들어 나라 자산이 줄고 경제도 조금 위축될 수 있습니다.", "X": "흉년에 도움을 받지 못한 농민들은 생계를 꾸리기 어려워 보통 사람 소득이 줄고 빈부격차가 커지며 국민 행복도가 크게 떨어질 수 있습니다. 경제도 조금 위축될 수 있습니다."}, "seeddrought": {"O": "인공강우는 구름 속 수증기를 미리 비로 내리게 하므로 바람 아래쪽 지방에 갈 비가 줄 수 있다는 걱정이 있습니다. 이를 멈추고 동부 농민에게 보상하면 피해 지역의 불만이 줄어 국민 행복도가 오르고 빈부격차가 조금 줄어들 수 있습니다. 하지만 보상금으로 나라 자산이 조금 줄고 경제도 조금 위축될 수 있습니다.", "X": "인공강우를 계속하면 동부 지방의 가뭄 피해가 이어져 동부 농민들이 피해를 떠안게 되므로 빈부격차가 커지고 국민 행복도가 떨어질 수 있습니다."}, "seedneighbor": {"O": "인공강우를 멈추고 물 협정을 맺으면 이웃 나라와의 갈등이 줄어 국민 행복도가 조금 오르고, 구름씨를 뿌리던 비행기 운항이 멈춰 기후도 조금 나아질 수 있습니다. 하지만 협정에 따른 비용으로 나라 자산이 줄고, 인공강우로 얻던 물이 줄어 경제가 조금 위축될 수 있습니다.", "X": "이웃 나라의 요구를 무시하면 관계가 나빠져 이웃 나라가 우리 물건을 덜 살 수 있으므로 수출이 크게 줄고 경제가 조금 위축될 수 있습니다. 갈등이 길어져 국민 행복도도 조금 떨어질 수 있습니다."}, "unrest": {"O": "시위대 대표를 직접 만나 개혁안을 내놓으면 시민들의 요구가 정책에 반영될 길이 열려 국민 행복도가 크게 오르고 빈부격차가 조금 줄어들 수 있습니다. 하지만 개혁에 나랏돈이 들어 나라 자산이 조금 줄고 경제도 조금 위축될 수 있습니다.", "X": "시민들의 고통에 답하지 않으면 분노가 더 쌓여 국민 행복도가 크게 떨어지고, 시위가 길어져 경제도 조금 위축될 수 있습니다."}, "coral2": {"O": "채굴 구역을 줄이면 바닥의 흙이 덜 일어나 물이 맑아지고, 산호 속에 사는 조류가 다시 햇빛을 받아 산호와 물고기가 돌아올 수 있으므로 자연환경이 나아질 수 있습니다. 하지만 채굴로 얻던 광물이 줄어 수출이 줄고 경제가 조금 위축될 수 있습니다.", "X": "흙탕물이 계속 산호초를 덮으면 산호 속 조류가 햇빛을 받지 못해 산호가 더 죽고 물고기가 떠나 자연환경이 나빠질 수 있습니다. 고기잡이로 살던 주민들의 벌이가 줄어 보통 사람 소득도 조금 줄어들 수 있습니다."}, "c_smog": {"O": "공장 가동을 줄이면 굴뚝에서 나오는 미세 먼지와 오염 물질이 줄어 스모그가 걷히고 국민 행복도가 오를 수 있으며, 석탄을 덜 태워 이산화탄소 배출이 줄어 기후도 나아질 수 있습니다. 하지만 생산이 줄어 경제가 위축될 수 있습니다.", "X": "바람이 약한 겨울에는 오염 물질이 흩어지지 못하고 쌓이므로, 배출을 줄이지 않으면 스모그가 이어져 호흡기 환자가 늘고 국민 행복도가 크게 떨어질 수 있습니다."}, "c_waterwar": {"O": "데이터센터는 서버의 열을 식히는 데 많은 물을 쓰므로, 물 사용에 상한을 두면 논밭에 물이 다시 돌아가 국민 행복도가 오르고 농민 소득이 늘어 보통 사람 소득도 조금 오를 수 있습니다. 하지만 데이터센터 운영이 제한되어 경제가 위축될 수 있습니다.", "X": "가뭄 속에 데이터센터가 냉각수를 계속 끌어 쓰면 논밭에 갈 물이 모자라 농민의 벌이가 줄면서 보통 사람 소득이 줄고 국민 행복도가 떨어질 수 있습니다."}, "c_jobless": {"O": "인공지능 기업에 세금을 매겨 청년 일자리를 만들면 자동화로 생긴 이익이 일자리를 잃은 사람들에게도 나뉘어 빈부격차가 줄고 보통 사람 소득이 조금 오르며 국민 행복도가 오를 수 있습니다. 하지만 세율이 조금 오르고 기업의 투자 의욕이 줄어 경제는 조금 위축될 수 있습니다.", "X": "자동화의 이익이 기업에만 몰리고 일자리를 잃은 청년은 소득이 없으므로 빈부격차가 커지고 국민 행복도가 크게 떨어질 수 있습니다."}, "c_debttrap": {"O": "소득이 많은 사람에게 세금을 더 걷어 이자를 갚으면 나랏빚이 줄고, 복지가 지켜져 빈부격차가 줄며 국민 행복도가 오를 수 있습니다. 하지만 세율이 조금 오르고 투자가 줄어 경제가 조금 위축될 수 있습니다.", "X": "이자를 갚느라 복지가 줄면 가난한 집이 더 어려워져 빈부격차가 커지고 국민 행복도가 떨어질 수 있습니다. 빚이 그대로여서 이자가 계속 쌓여 나랏빚도 늘고 경제도 조금 위축될 수 있습니다."}, "c_blockade": {"O": "불법 사업을 공개하고 국제 감시를 받으면 불법 사업으로 벌던 돈이 끊기고 믿음이 회복되기까지 시간이 걸려 수출이 크게 줄고 경제가 위축될 수 있습니다. 하지만 잘못을 바로잡는 모습에 국민 행복도는 조금 오를 수 있습니다.", "X": "잘못을 감춘 채 버티면 수입국들이 우리 물건을 계속 받지 않아 수출이 크게 줄고 경제가 크게 위축될 수 있습니다."}, "c_climaterefugee": {"O": "숲을 되살리면 나무뿌리가 흙을 붙잡고 빗물을 머금어 산사태와 가뭄 피해가 줄어 자연환경이 크게 나아질 수 있고, 집을 잃은 이주민에게 정착촌이 생겨 국민 행복도도 오를 수 있습니다. 하지만 큰돈이 들어 나랏빚이 늘고 경제는 조금 위축될 수 있습니다.", "X": "고향을 떠난 사람들이 도시 변두리에서 살 곳과 일자리를 찾지 못하면 빈부격차가 커지고 국민 행복도가 떨어질 수 있습니다. 경제도 조금 위축될 수 있습니다."}, "c_gridcollapse": {"O": "에너지 절약법으로 전기를 아끼면 전력 수요가 크게 줄고, 저장 장치에 남는 전기를 모아 두었다가 모자랄 때 쓸 수 있어 정전 위험이 줄어들 수 있습니다. 하지만 장치를 사는 데 돈을 빌려 나랏빚이 늘고, 전기 사용이 제한되어 경제가 // 손으로 쓴 해설에 빠진 나라 살림 변화(수출·수입·자산·빚·세금)를 한 문장 덧붙인다
function econNote(c, opt, side, text){
  const e = econEffect(c, opt, side) || {}, t = [];
  if (e.ex && !/수출/.test(text)) t.push(e.ex > 0 ? '수출이 늘 수 있습니다' : '수출이 줄 수 있습니다');
  if (e.im && !/수입/.test(text)) t.push(e.im > 0 ? '외국에서 사 오는 물건이 늘어 나라 돈이 더 나갈 수 있습니다' : '외국에서 사 오는 물건이 줄어 나라 돈이 덜 나갑니다');
  if (e.as && !/자산|나랏돈|나라 돈|예산|돈이 들/.test(text)) t.push(e.as > 0 ? '나라 자산이 늘 수 있습니다' : '나라 돈이 들어갑니다');
  if (e.as > 0 && /돈이 들|예산이 들|나랏돈이 들/.test(text)) t.push('그 대신 다른 곳에서 나라 자산이 늘 수 있습니다');
  if (e.debt && !/빚/.test(text)) t.push(e.debt > 0 ? '나랏빚이 늘 수 있습니다' : '나랏빚이 줄 수 있습니다');
  if (e.tax && !/세금|세율/.test(text)) t.push(e.tax > 0 ? '세금이 오를 수 있습니다' : '세금이 줄어들 수 있습니다');
  return t.length ? ' 나라 살림에서는 ' + t.join('. ') + '.' : '';

function econDeltas(){
  const e = S.lastEcon || {}, out = [];
  const pc = (n, v, good) => `<span class="${good ? 'up' : 'dn'}">${n} ${v > 0 ? '+' : ''}${v}%</span>`;
  if (e.ex) out.push(pc('수출', e.ex, e.ex > 0));
  if (e.im) out.push(pc('수입', e.im, e.im < 0));
  if (e.tax) out.push(`<span class="${e.tax > 0 ? 'up' : 'dn'}">세율 ${e.tax > 0 ? '+' : ''}${e.tax}%p · 세금 수입 ${fmt(Math.round(S.taxRev))}조</span>`);
  if (e.as) out.push(`<span class="${e.as > 0 ? 'up' : 'dn'}">자산 ${e.as > 0 ? '+' : ''}${fmt(Math.round(e.as / 100 * S.gdp))}조</span>`);
  if (e.debt && isOpen()) out.push(`<span class="${e.debt < 0 ? 'up' : 'dn'}">나랏빚 ${e.debt > 0 ? '+' : ''}${fmt(Math.round(e.debt / 100 * S.gdp))}조</span>`);
  return out;
}
function renderResult(side, opt, pw){
  clearTimers();

    .concat(pw.out ? [] : [`<span class="up">기본 성장 +${BASE_GROWTH*100}%</span>`])
    .concat(isOpen()? STATS.filter(x=>opt.d[x.k]).map(x=>{const v=opt.d[x.k], good=x.inv?v<0:v>0; return `<span class="${good?'up':'dn'}">${x.n} ${v>0?'+':''}${v}</span>`}) : [])
    .concat(econDeltas())
    .concat(isOpen() && S.slumpNow ? [`<span class="dn">경제 침체 · 국민 행복도 -${SLUMP_HAPPY}</span>`] : []);
  const tag = side==='A' ? ['var(--ai)','AI의 안 결재'] : side==='O' ? ['var(--o)','승인'] : ['var(--x)','반려'];
  const mv = S.rankMove || {from:0, to:0};
  let rankLine = '';
  if (mv.to < mv.from){
    const passed = []; for (let i = mv.to - 1; i <= mv.from - 2; i++) passed.push(worldName(i));
    const names = passed.length > 2 ? `${passed.slice(-2).join(', ')} 등 ${passed.length}개 나라` : passed.join(', ');
    rankLine = `<div class="power up">세계 순위 ${mv.from}위 → ${mv.to}위 · ${josa(names, '을', '를')} 제쳤습니다!</div>`;
  } else if (mv.to > mv.from){
    const by = []; for (let i = mv.from - 1; i <= mv.to - 2; i++) by.push(worldName(i));
    const names = by.length > 2 ? `${by.slice(0, 2).join(', ')} 등 ${by.length}개 나라` : by.join(', ');
    rankLine = `<div class="power">세계 순위 ${mv.from}위 → ${mv.to}위 · ${names}에게 따라잡혔습니다.</div>`;
  }
  if (S.stampHit) rankLine = `<div class="power bad">생각 없이 찍은 도장: 반려 없이 승인을 ${S.oStreak}번 이어 가는 동안 국민에게 해로운 안건에도 ${S.oBad}번 도장을 찍었습니다. 지도자가 무엇이든 승인만 한다는 소문이 돌자, 인민위원들이 결재 서류에 뒷돈 사업을 몰래 끼워 넣었습니다. GDP -1%${isOpen() ? ' · 빈부격차 +2 · 국민 행복도 -2' : ''}</div>` + rankLine;
  else if (side === 'O' && !isWise(S.card, 'O') && S.oBad === STAMP_LINE - 1) rankLine = `<div class="power">인민위원들이 수군거립니다. "지도자 동지께서 요즘 해로운 안건에도 승인만 하신다던데…" (해설을 읽고 해로운 안건은 반려해 보세요)</div>` + rankLine;
  const powerLine = pw.out
    ? `<div class="power bad">전력 공급 ${pw.sup}GW < 수요 ${pw.dem}GW → 정전이 일어났습니다! 공장이 멈춰 GDP가 3% 줄었습니다.</div>`
    : `<div class="power">전력 공급 ${pw.sup}GW / 수요 ${pw.dem}GW · 전기가 모자라지 않았습니다.</div>`;
  layout(`<div class="result">
    <span class="tag" style="background:${tag[0]};${side==='A'?'color:var(--aiInk)':''}">${tag[1]}</span>
    <p>${sentence(opt)}</p>
    ${S.climateNote ? `<div class="power ${S.climateNote.ok === true ? 'up' : S.climateNote.ok === false ? 'bad' : ''}">올해 기후 · ${S.weather.n}: ${S.climateNote.t}</div>` : ''}
    ${powerLine}
    ${rankLine}
    ${S.coupPending ? '<div class="power bad">궁전 밖이 심상치 않습니다. 멀리서 탱크 소리가 들립니다…</div>' : (S.slumpNow ? `<div class="news"><b>${esc(PAPER())}</b>${S.slump >= 3 ? '최근 몇 년 경제 성장이 기대에 못 미쳐… "살림살이가 나아지지 않는다"는 목소리가 커지고 있다' : '최근 3년 경제 성장이 기대보다 더뎌… 일자리를 걱정하는 사람들이 늘고 있다'}</div>` : (warnings().length ? `<div class="news"><b>${esc(PAPER())}</b>${warnings()[0]}</div>` : ''))}
    <div class="delta">${deltas.join('')}</div>
    ${S.card.dl && side !== 'A' ? `<div class="dlnote"><b>정답이 없는 안건</b> 승인해도 반려해도 나름의 까닭이 있습니다. 지도자 동지는 <b>「${S.card.dl[side === 'O' ? 0 : 1]}」</b>${josa(S.card.dl[side === 'O' ? 0 : 1], '을', '를').slice(-1)} 더 중요하게 여겼고, 대신 「${S.card.dl[side === 'O' ? 1 : 0]}」${josa(S.card.dl[side === 'O' ? 1 : 0], '을', '를').slice(-1)} 조금 내려놓았습니다.</div>` : ''}
    ${S.cause && !S.cause.combo ? `<div class="bsum"><b>나의 선택이 이어져 지금까지 바꾼 것</b><small>${(S.cause.path || []).map(p => `「${esc(p.title)}」`).join(' → ')} → 「${esc(S.card.title)}」</small><div class="delta">${chainSum([...(S.cause.path || []), {title:S.card.title, year:yearOf(S.turn)}])}</div></div>` : ''}
    ${S.balBonus ? `<div class="power up">균형 성장 ${S.hsRun}년째: 경제가 크면서 국민 삶·공정함·환경도 나빠지지 않았습니다. 투자와 인재가 몰려 GDP +${Math.round(S.balBonus * 1000) / 10}%</div>` : ''}

function rankList(){
  const all=[...mates().map(b=>({name:mateLabel(b),flag:b.flag,gdp:b.gdp,grade:b.grade||''})), {name:`${S.nation}(${S.name}) · 나`,flag:MYFLAG,gdp:myBest(),grade:drankOf(S).lv+'급',me:true}].sort((a,b)=>b.gdp-a.gdp);
  const rank=all.findIndex(x=>x.me)+1;
  const show = all.slice(0,5).concat(rank>5?[all[rank-1]]:[]);
  return {rank, total:all.length, html:`<div class="rank">${show.map(r=>`<div class="${r.me?'me':''}"><span>${all.indexOf(r)+1}</span><span>${r.flag ? flagSVG(r.flag, 24) + ' ' : ''}${esc(r.name)}</span><span class="rg">${r.grade?esc(r.grade):''}</span><span>${fmt(r.gdp)}조</span></div>`).join('')}</div>`};
}
function endGame(){
  clearTimers(); PLAYING = false;
